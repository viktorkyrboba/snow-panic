    const fdt = clamp(now - (this._lastNow ?? now), 0, 0.05) * 60; this._lastNow = now;
    // Горы привязаны к камере (бесконечно далёкие).
    r.drawFar(this.mountains, M4.translation(this.tmp, this.center(camS), camY - 30, -camS), 0.0016);
    for (const ch of this.chunks.values()) r.draw(ch.mesh, M4.identity(this.tmp));
    // Тени: сначала неподвижные (готовые), потом движущиеся (матрицей).
    for (const ch of this.chunks.values()) if (ch.shadow.count) r.drawShadow(ch.shadow, M4.identity(this.tmp));
    for (const o of this.obstacles) if (o.shadow && !o.off && o.s > camS - 6 && o.s < camS + 175) r.drawShadow(o.shadow, M4.identity(this.tmp));
    // Препятствия: целые — на месте, сбитые — улетают вверх-вперёд, кувыркаясь, и тают.
    const fm = this.flyM || (this.flyM = M4.create());
    for (const o of this.obstacles) {
      if (!o.mesh || o.s < camS - 6 || o.s > camS + 175) continue;
      if (!o.off) { r.draw(o.mesh, o.mat); continue; }
      if (o.fly === undefined) o.fly = 0;
      if (o.fly >= 1) continue;
      o.fly = Math.min(1, o.fly + 0.04 * fdt);
      const f = o.fly;
      // В сторону от игрока и вверх, чуть назад — чтобы не закрывать обзор.
      M4.translation(fm, (o.flyDir || 1) * f * 18, f * 10 - f * f * 4, f * 5);
      M4.multiply(fm, fm, o.mat);
      M4.multiply(fm, fm, M4.rotZ(f * 3 * (o.flyDir || 1)));
      r.draw(o.mesh, fm, 1 - f * f);
    }

    const tg = this.target;
    for (const c of this.coins) {
      if (c.s < camS - 5 || c.s > camS + 170) continue;
      if (c.taken) {
        // Монета летит к игроку (пылесос).
        if (!(c.fly > 0) || c.fly >= 1) continue;
        c.fly = Math.min(1, c.fly + 0.07 * fdt);
        const k = c.fly * c.fly;
        M4.compose(this.tmp, lerp(c.x, tg.x, k), lerp(c.y, tg.y + 1, k), -lerp(c.s, tg.s, k), now * 12, 0, 0, 1 - 0.5 * k);
        r.draw(this.coinMesh, this.tmp);
        continue;
      }
      M4.compose(this.tmp, c.x, c.y + Math.sin(now * 3 + c.s) * 0.12, -c.s, now * 3 + c.s);
      r.draw(this.coinMesh, this.tmp);
    }
    for (const p of this.pickups) {
      if (p.taken || p.s < camS - 5 || p.s > camS + 170) continue;
      const bob = Math.sin(now * 2.5 + p.s) * 0.18, pulse = 1 + Math.sin(now * 5 + p.s) * 0.06;
      M4.compose(this.tmp, p.x, p.y + bob, -p.s, now * 1.8, 0, 0, pulse);
      this.drawShadowOf(this.pickMesh[p.kind], this.tmp, p.x, p.s);
      r.draw(this.pickMesh[p.kind], this.tmp);
      M4.compose(this.tmp, p.x, p.y + bob - 0.2, -p.s, -now * 3, 0.35 * Math.sin(now * 2), 0, 1.05);
      r.draw(this.haloMesh[p.kind], this.tmp);
    }
    for (const sm of this.snowmen) {
      if (sm.s < camS - 10 || sm.s > camS + 170 || sm.t > 1.2) continue;
      if (sm.alive) M4.compose(this.tmp, sm.x, this.height(sm.x, sm.s) - 0.1, -sm.s, 0);
      else M4.compose(this.tmp, sm.x, sm.y, -sm.s, sm.rot, sm.rot * 0.7, 0, 1 - sm.t * 0.5);
      if (sm.alive) this.drawShadowOf(this.snowmanMesh, this.tmp, sm.x, sm.s);
      r.draw(this.snowmanMesh, this.tmp, sm.alive ? 1 : clamp(1.2 - sm.t, 0, 1));
    }
  }
}

// --- player.js ---
// Игрок: скорость, повороты, прыжки, пригибание, трюки, бонусы, столкновения.

const G = 15; // «аркадная» гравитация
const JUMP_V = 7.2, SPRING_V = 10.5, DOUBLE_V = 9;
const POWER_TIME = { boost: 4.5, spring: 10, magnet: 10 };
const BOOST_EXTRA = 11; // +м/с к максимуму при ускорении

class Player {
  constructor(renderer, ride = 'tube', up = {}) {
    this.r = renderer;
    this.meshes = {};
    this.setRide(ride, up);
    this.m = M4.create();
    this.reset(0);
  }

  setRide(id, up = {}) {
    this.rideId = id;
    this.cfg = rideStats(id, up);
    if (!this.meshes[id]) {
      const b = RideModels.build(id), mk = (mb) => this.r.createMesh(mb);
      this.meshes[id] = { vehicle: mk(b.vehicle), body: mk(b.body), head: mk(b.head), arm: mk(b.arm), scarf: mk(b.scarf), scarfRing: mk(b.scarfRing), rig: b.rig };
    }
    this.parts = this.meshes[id];
    this.mesh = this.parts.vehicle;
  }

  reset(x) {
    Object.assign(this, {
      hits: this.cfg.hp, lastNearS: -99,
      x, s: 2, y: 0, vy: 0, v: 6, vx: 0,
      grounded: true, onRamp: null, onIce: false, pull: null, flung: false, flingSpin: 0,
      yaw: 0, yawVel: 0, pitch: 0, roll: 0,
      airYaw: 0, airPitch: 0, airTime: 0, doubleUsed: false, autoFlip: 0,
      crouching: false, crouchAmt: 0,
      // анимация персонажа
      bob: 0, bobV: 0, lean: 0, headYaw: 0, headPitch: 0, arms: 0, glance: 0, glanceT: 3, hopT: 2, prevVy: 0, steerVis: 0,
      avalancheGap: 999,
      power: { boost: 0, spring: 0, magnet: 0 },
      alive: true, crashT: 0, invuln: 0,
      bank: 0,
    });
  }

  vmax() { return this.cfg.vmaxBase + (this.vBonus || 0) + Math.min(this.s / 140, this.cfg.vmaxGrow) + (this.power.boost > 0 ? BOOST_EXTRA : 0); }

  // Высота корпуса над снегом: сидя ниже, стоя на доске выше; пригнувшись — почти вдвое ниже.
  bodyHeight() { return (this.cfg.height || 1.75) * (1 - 0.5 * this.crouchAmt); }
  rel(world) { return this.y - world.height(this.x, this.s); }

  // events — массив для UI/звука: {type, ...}
  update(dt, input, world, events) {
    const c = this.cfg;
    if (!this.alive) { this._crashAnim(dt, world); return; }
    if (this.invuln > 0) this.invuln -= dt;
    for (const k in this.power) if (this.power[k] > 0) {
      this.power[k] -= dt;
      if (this.power[k] <= 0) { this.power[k] = 0; events.push({ type: 'powerEnd', kind: k }); }
    }

    const vmax = this.vmax();
    const steer = input.steer;
    const crouch = input.crouch !== undefined ? input.crouch : input.tuck;
    const jump = input.takeJump ? input.takeJump() : !!input.jump;
    const boost = this.power.boost > 0;
    this.crouching = crouch && this.grounded;
    this.crouchAmt = damp(this.crouchAmt, this.crouching ? 1 : 0, 14, dt);

    if (this.grounded) {
      // Лёд: разгоняет и почти не даёт рулить.
      const ice = world.icy(this.x, this.s);
      if (ice && !this.onIce) events.push({ type: 'ice' });
      this.onIce = ice;
      const acc = boost ? c.tuckAccel * 2.2 : crouch ? c.tuckAccel : c.accel;
      const a = acc * (1 - this.v / (vmax * (crouch ? 1.12 : 1)) * (ice ? 0.85 : 1));
      this.v += a * dt;
      if (input.brake && !boost) this.v -= c.brake * dt;
      this.v -= Math.abs(steer) * 1.2 * dt;
      // Глубокий снег за краем коридора тормозит.
      const u = this.x - world.center(this.s);
      const out = Math.abs(u) - TRACK.HALF - 2.5;
      if (out > 0) this.v -= out * 2.2 * dt;
      this.v = Math.max(this.v, 4);
      this.vx = damp(this.vx, steer * c.steer * (0.55 + 0.45 * this.v / vmax), c.steerResp * (ice ? 0.22 : 1), dt);
      // Ватрушка лениво крутится от поворотов.
      this.yawVel = damp(this.yawVel, steer * c.groundSpin, 2, dt);
      this.yaw += this.yawVel * dt;
      if (!c.groundSpin) this.yaw = damp(wrapAngle(this.yaw), 0, 6, dt);
      this.pitch = damp(this.pitch, 0, 10, dt);
      // Прыжок с земли (с пружиной — высокий).
      if (jump) {
        this._takeoff(this.power.spring > 0 ? SPRING_V : JUMP_V);
        events.push({ type: 'hop', big: this.power.spring > 0 });
      }
    } else {
      // Двойной прыжок — только с пружиной.
      if (jump && this.power.spring > 0 && !this.doubleUsed) {
        this.doubleUsed = true; this.vy = Math.max(this.vy, DOUBLE_V);
        events.push({ type: 'djump' });
      }
      // В воздухе ← → смещают в сторону с наклоном, как на земле (без вращения на месте).
      // Выстрелило резинкой — летишь кувырком, руль не помогает.
      if (this.flung) { this.pitch += this.flingSpin * dt; this.yaw += this.flingSpin * 0.5 * dt; }
      else this.vx = damp(this.vx, steer * c.steer * 0.85, c.steerResp * 0.7, dt);
      this.yaw = damp(wrapAngle(this.yaw), 0, 3, dt);
      // Сальто: клавиши — пока держишь; свайп — автоматически ровно один оборот.
      const fs = input.takeFlip ? input.takeFlip() : (input.flipSwipe || 0);
      if (fs) this.autoFlip += fs * Math.PI * 2;
      let step = input.flip * c.flipRate * dt;
      if (this.autoFlip) {
        const a = Math.sign(this.autoFlip) * Math.min(Math.abs(this.autoFlip), c.flipRate * 1.6 * dt);
        this.autoFlip -= a; step += a;
      }
      this.pitch += step;
      this.airPitch += step;
      this.airTime += dt;
    }

    // Внешняя сила (резинка в режиме «Связка»): тянет вбок и вперёд/назад.
    if (this.pull && !this.flung) {
      this.vx += this.pull.x * dt * (this.grounded ? 1 : 0.5);
      this.v = Math.max(4, this.v + this.pull.s * dt * (this.grounded ? 1 : 0.5));
    }
    this.bank = damp(this.bank, -this.vx * 0.03, 6, dt);
    this.x += this.vx * dt;
    // Граница трассы — линия флажков с сеткой: дальше не уехать, отталкивает обратно.
    const u = this.x - world.center(this.s), lim = this.flung ? TRACK.HALF + 9 : TRACK.HALF + 0.9 - c.radius * 0.5;   // выстреленного уносит за флажки
    if (Math.abs(u) > lim) {
      const side = Math.sign(u);
      this.x = world.center(this.s) + side * lim;
      if (this.vx * side > 0) {
        if (Math.abs(this.vx) > 3) events.push({ type: 'wall', side });
        this.vx = -side * Math.abs(this.vx) * 0.35;
        this.v *= 0.97;
      }
    }
    const prevS = this.s;
    this.s += this.v * dt;

    const g = world.ground(this.x, this.s);
    if (this.grounded) {
      if (this.onRamp && !g.ramp) {
        // Сошли с трамплина — полёт.
        this._takeoff(5.5 + this.v * 0.06 + (this.power.spring > 0 ? 3 : 0));
        events.push({ type: 'jump' });
      } else if (this.grounded) {
        const prevY = this.y;
        this.y = g.y;
        this.vy = (this.y - prevY) / Math.max(dt, 1e-4);
      }
      this.onRamp = g.ramp;
    } else {
      this.vy -= G * dt;
      this.y += this.vy * dt;
      if (this.y <= g.y) {
        this.y = g.y;
        this._land(events);
        this.onRamp = g.ramp;
      }
    }

    this._collide(world, prevS, events);
    this._animate(dt, steer);
  }

  // Живость персонажа: пружина подпрыгивания, наклон, голова, руки.
  _animate(dt, steer) {
    // Пружина «таз над сиденьем»: толчки от кочек, отрыва и приземления.
    if (this.grounded) {
      const dv = this.vy - this.prevVy;                    // резкая смена вертикальной скорости = кочка
      if (Math.abs(dv) > 0.6) this.bobV += clamp(dv, -6, 6) * 0.08;
      // иногда сам подпрыгивает от инерции на быстрой езде
      this.hopT -= dt;
      if (this.hopT <= 0) { this.hopT = 1.5 + Math.random() * 2.5; if (this.v > 14) this.bobV += 0.9 + Math.random() * 0.8; }
    }
    this.prevVy = this.vy;
    this.bobV += (-170 * this.bob - 11 * this.bobV) * dt;
    this.bob = clamp(this.bob + this.bobV * dt, -0.16, 0.22);
    // Наклон корпуса в поворот, голова смотрит туда, куда рулишь.
    this.steerVis = damp(this.steerVis, steer, 8, dt);
    this.lean = damp(this.lean, -this.steerVis * 0.32, 7, dt);
    // Иногда оглядывается назад, особенно когда лавина близко.
    this.glanceT -= dt;
    if (this.glanceT <= 0 && this.glance <= 0 && this.grounded) {
      const close = this.avalancheGap < 40;
      if (close || Math.random() < 0.35) { this.glance = 0.7; this.glanceSide = Math.random() < 0.5 ? -1 : 1; }
      this.glanceT = close ? 2 + Math.random() * 2 : 4 + Math.random() * 4;
    }
    if (this.glance > 0) this.glance -= dt;
    const yawT = this.glance > 0 ? this.glanceSide * 2.3 : -this.steerVis * 0.6;
    this.headYaw = damp(this.headYaw, yawT, this.glance > 0 ? 9 : 6, dt);
    this.headPitch = damp(this.headPitch, this.grounded ? 0 : -0.25, 5, dt);
    // Руки: в полёте вверх (и машут), на земле — в обычной позе.
    this.arms = damp(this.arms, this.grounded ? 0 : 1, this.grounded ? 9 : 5, dt);
  }

  _takeoff(vy) {
    this.bobV -= 1.6;                                  // тело «отстаёт» при отрыве
    this.grounded = false; this.onRamp = null;
    this.vy = vy; this.doubleUsed = false;
    this.airYaw = 0; this.airPitch = 0; this.airTime = 0;
  }

  // Резинка-рогатка выстрелила: подбрасывает вверх и в сторону, при падении — авария.
  fling(vx, vy) {
    if (!this.alive) return;
    this._takeoff(vy); this.vx = vx; this.flung = true; this.flingSpin = (Math.random() < 0.5 ? -1 : 1) * 9;
    this.v *= 0.7;
  }

  _land(events) {
    if (this.flung) { this.flung = false; this.flingSpin = 0; this.grounded = true; this.crash('rope', events); return; }
    this.bobV -= clamp(Math.abs(this.vy) * 0.35, 0.5, 4);   // приседает от удара и пружинит обратно
    this.grounded = true; this.autoFlip = 0;
    const p = wrapAngle(this.pitch);
    if (Math.abs(p) > this.cfg.landTol && this.invuln <= 0 && this.power.boost <= 0) { this.crash('landing', events); return; }
    const halfSpins = Math.floor((Math.abs(this.airYaw) + 0.6) / Math.PI);
    const flips = Math.floor((Math.abs(this.airPitch) + 0.8) / (Math.PI * 2));
    const tricks = [];
    let pts = 0;
    if (flips >= 2) { tricks.push(T('dflip')); pts += 1200; }
    else if (flips === 1) { tricks.push(T('flip')); pts += 500; }
    if (halfSpins >= 2) { tricks.push(`${T('spin')} ${halfSpins * 180}`); pts += halfSpins * 100; }
    if (this.airTime > 1.0) pts += Math.round(this.airTime * 40);
    if (tricks.length && Math.abs(p) < 0.25) { tricks.push(T('clean')); pts += 100; }
    pts = Math.round(pts * this.cfg.trickMul);
    this.pitch = p;
    events.push({ type: 'land', tricks, pts, air: this.airTime, flips });
    this.airYaw = this.airPitch = 0; this.airTime = 0;
  }

  // Удар о что-то (препятствие, птица). Возвращает true, если заезд окончен.
  // Убрать препятствие с трассы (у забора — все столбики сразу) и отправить его в полёт.
  _knock(obj) {
    if (!obj) return;
    const list = obj.grp ? obj.grp.posts : [obj];
    const dir = obj.x >= this.x ? 1 : -1;
    for (const o of list) { o.off = true; o.flyDir = dir; }
  }

  hit(kind, events, obj) {
    if (this.invuln > 0) return false;
    if (this.power.boost > 0) {
      this._knock(obj);
      events.push({ type: 'smash', x: obj ? obj.x : this.x, s: obj ? obj.s : this.s, boost: true });
      return false;
    }
    if (this.cfg.smash && kind === 'rock' && obj && obj.r < 1.4) {
      this._knock(obj); this.v *= 0.85; events.push({ type: 'smash', x: obj.x, s: obj.s }); return false;
    }
    if (this.hits > 0) {
      this.hits--; this._knock(obj); this.invuln = 1.2; this.v *= 0.7;
      events.push({ type: 'shield', left: this.hits }); return false;
    }
    this.crash(kind, events);
    return true;
  }

  givePower(kind, events) {
    this.power[kind] = POWER_TIME[kind];
    events.push({ type: 'power', kind });
  }

  _collide(world, prevS, events) {
    const R = this.cfg.radius;
    const rel = this.y - world.height(this.x, this.s);
    for (const o of world.obstacles) {
      if (o.s < this.s - 4) continue;
      if (o.s > this.s + 4) break;
      if (o.off) continue;
      const d = Math.hypot(o.x - this.x, o.s - this.s);
      if (d < o.r + R && rel < o.h) { if (this.hit(o.kind, events, o)) return; continue; }
      if (!o.passed && o.s < this.s) {
        o.passed = true;
        // Один «впритирку» на препятствие (у забора несколько столбиков с одним s).
        if (d < o.r + R + 1.3 && this.grounded && this.invuln <= 0 && o.s - (this.lastNearS ?? -99) > 2) {
          this.lastNearS = o.s; events.push({ type: 'near' });
        }
      }
    }
    for (const sm of world.snowmen) {
      if (!sm.alive || Math.abs(sm.s - this.s) > 3) continue;
      if (Math.hypot(sm.x - this.x, sm.s - this.s) < 0.75 + R && rel < 2.5) {
        sm.alive = false; sm.t = 0; sm.y = world.height(sm.x, sm.s);
        sm.vx = (sm.x - this.x) * 3 + this.vx * 0.5; sm.vy = 6; sm.vs = this.v * 0.8;
        if (this.power.boost <= 0) this.v *= 0.9;
        events.push({ type: 'snowman', x: sm.x, s: sm.s });
      }
    }
    // Магнит: монеты рядом сами летят к игроку.
    const mag = this.power.magnet > 0, pick = mag ? 7 : 1.5, ahead = mag ? 9 : 2;
    for (const c of world.coins) {
      if (c.s < this.s - 2) continue;
      if (c.s > this.s + ahead) break;
      if (c.taken) continue;
      if (Math.hypot(c.x - this.x, c.s - this.s) < pick && Math.abs(c.y - (this.y + 0.9)) < (mag ? 6 : 1.8)) {
        c.taken = true; c.fly = mag ? 0.0001 : 0; events.push({ type: 'coin' });
      }
    }
    for (const p of world.pickups || []) {
      if (p.taken || Math.abs(p.s - this.s) > 2.2) continue;
      if (Math.hypot(p.x - this.x, p.s - this.s) < 1.7 && Math.abs(p.y - (this.y + 0.9)) < 2) {
        p.taken = true; this.givePower(p.kind, events);
      }
    }
  }

  crash(kind, events) {
    if (!this.alive) return;
    this.alive = false; this.crashT = 0; this.crashKind = kind;
    this.crashSpin = (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 3);
    this.vy = Math.max(this.vy, 4);
    for (const k in this.power) this.power[k] = 0;
    events.push({ type: 'crash', kind });
  }

  _crashAnim(dt, world) {
    this.crashT += dt;
    this.arms = damp(this.arms, 1, 6, dt); this.headYaw = Math.sin(this.crashT * 9) * 0.8;
    if (this.crashKind === 'avalanche') { this.v = damp(this.v, 0, 2, dt); return; }
    this.v = damp(this.v, 0, 2.5, dt);
    this.s += this.v * dt * 0.6;
    this.vy -= G * dt; this.y += this.vy * dt;
    const gy = world.height(this.x, this.s);
    if (this.y < gy) { this.y = gy; this.vy = Math.abs(this.vy) * 0.3; }
    this.yaw += this.crashSpin * dt * Math.max(0, 1 - this.crashT * 0.6);
    this.roll = damp(this.roll, 1.4, 3, dt);
  }

  revive(world) {
    this.flung = false; this.flingSpin = 0;
    this.alive = true; this.invuln = 2.5; this.grounded = true; this.onRamp = null;
    this.x = world.center(this.s); this.vx = 0; this.v = Math.max(this.v, 14);
    this.pitch = 0; this.roll = 0; this.y = world.height(this.x, this.s);
    for (const o of world.obstacles) if (o.s > this.s - 2 && o.s < this.s + 25 && Math.abs(o.x - this.x) < 6) this._knock(o);
  }

  draw(r, world, now) {
    // наклон по склону + крен на поворотах + трюки
    const slope = Math.atan(TRACK.SLOPE) * (this.grounded ? 1 : 0.5);
    M4.translation(this.m, this.x, this.y, -this.s);
    M4.multiply(this.m, this.m, M4.rotY(-Math.atan(this.vx / Math.max(this.v, 1)) * 0.6));
    M4.multiply(this.m, this.m, M4.rotX(-slope - this.pitch));
    M4.multiply(this.m, this.m, M4.rotZ(this.bank + this.roll));
    M4.multiply(this.m, this.m, M4.rotY(this.yaw));
    // Призрак (ghostA): полупрозрачный, голубоватый, без тени.
    const ghost = this.ghostA || 0;
    const P = this.parts, rig = P.rig, sh = world.drawShadowOf && !ghost ? (mesh, mm) => world.drawShadowOf(mesh, mm, this.x, this.s) : () => {};
    const blink = this.invuln > 0 && Math.floor(now * 10) % 2 === 0, a = ghost || (blink ? 0.45 : 1);
    const glow = ghost ? [0.55, 0.85, 1, 0.55] : this.power.boost > 0 ? [1, 0.55, 0.15, 0.25 + 0.15 * Math.sin(now * 20)] : null;
    const W = this.mw || (this.mw = Array.from({ length: 10 }, () => M4.create()));

    // Транспорт
    sh(P.vehicle, this.m); r.draw(P.vehicle, this.m, a, glow);

    // Таз персонажа: сиденье + подпрыгивание + наклон в поворот + пригибание.
    // Стоя (сноуборд) пригибание — сгиб ног от ступней: ноги остаются на доске, корпус опускается.
    // Тело сжимается по высоте отдельной матрицей; голова и руки крепятся к несжатой точке на нужной высоте.
    const stand = rig.pose === 'stand', c = this.crouchAmt, k = 1 - (stand ? 0.3 : 0.18) * c;
    const lift = stand ? (rig.legLen || 0.84) : 0;
    const base = W[0];
    M4.multiply(base, this.m, M4.translation(W[7], rig.seat[0], rig.seat[1] - lift + this.bob, rig.seat[2]));
    if (rig.yaw) M4.multiply(base, base, M4.rotY(rig.yaw));
    M4.multiply(base, base, M4.rotZ(this.lean * (rig.yaw ? 0.6 : 1)));
    M4.multiply(base, base, M4.rotX(c * (stand ? 0.18 : 0.45)));
    const bodyM = M4.multiply(W[6], base, M4.scale(1, k, 1));
    M4.multiply(bodyM, bodyM, M4.translation(W[7], 0, lift, 0));
    sh(P.body, bodyM); r.draw(P.body, bodyM, a, glow);
    const hip = M4.multiply(W[5], base, M4.translation(W[7], 0, lift * k, 0));

    // Голова с шарфом
    const neck = W[1];
    M4.multiply(neck, hip, M4.translation(W[7], 0, 0.66 * k, 0.02));
    sh(P.scarfRing, neck); r.draw(P.scarfRing, neck, a);
    M4.multiply(neck, neck, M4.rotY(this.headYaw * (rig.yaw ? 0.5 : 1) + (rig.yaw ? -rig.yaw * 0.7 : 0)));
    M4.multiply(neck, neck, M4.rotX(this.headPitch));
    sh(P.head, neck); r.draw(P.head, neck, a, glow);
    const sc = W[2];
    M4.multiply(sc, hip, M4.translation(W[7], 0.05, 0.66 * k, 0.16));
    M4.multiply(sc, sc, M4.rotX(-0.5 - clamp(this.v / 30, 0, 1) * 0.6 + Math.sin(now * 17) * 0.18 * clamp(this.v / 20, 0.2, 1)));
    r.draw(P.scarf, sc, a);

    // Руки: поза по умолчанию → в полёте вверх и машут.
    for (const side of [-1, 1]) {
      const arm = W[3 + (side > 0 ? 1 : 0)];
      M4.multiply(arm, hip, M4.translation(W[7], side * 0.33, 0.56 * k, 0.02));
      const wave = this.arms * Math.sin(now * 9 + side) * 0.35;
      const az = lerp(rig.armZ, 2.5, this.arms) + wave + (this.alive ? 0 : Math.sin(now * 14 + side * 2) * 0.6);
      const ax = lerp(rig.armX, 0, this.arms) + this.steerVis * side * 0.15;
      M4.multiply(arm, arm, M4.rotZ(side * az));
      M4.multiply(arm, arm, M4.rotX(ax));
      sh(P.arm, arm); r.draw(P.arm, arm, a, glow);
    }

    // Активные бонусы видны на транспорте: петарда сзади, шарики над головой.
    if (this.power.boost > 0 && world.pickMesh) {
      const q = M4.multiply(W[8], this.m, M4.translation(W[7], 0, 0.6, 1.05));
      M4.multiply(q, q, M4.rotX(-Math.PI / 2));
      r.draw(world.pickMesh.boost, q);
    }
    if (this.power.spring > 0 && world.pickMesh) {
      const q = M4.multiply(W[9], hip, M4.translation(W[7], 0.1, 1.55, 0.2));
      M4.multiply(q, q, M4.rotZ(Math.sin(now * 2.2) * 0.12));
      r.draw(world.pickMesh.spring, q);
    }
  }
}

// --- rival.js ---
// Гонка с ботом: соперник едет по той же трассе. Он не трогает мир (монеты, бонусы и препятствия остаются игроку):
// объезжает препятствия, прыгает с трамплинов, иногда ошибается и спотыкается, на сложном — жжёт петарды.
// Скорость — от «крейсерской» скорости игрока (с его улучшениями) и «резинки», чтобы гонка была напряжённой.
// Без DOM — тестируется в Node.

const RACE = {
  len: 2200,   // гонка длиннее обычного заезда: есть время отыграться после падения
  diff: {
    easy: { pace: 0.72, mistake: 0.25, look: 16, boostEvery: 0, boost: 0, catchUp: 0.02, slowAhead: 0.2, rides: ['sled', 'tube', 'board'], world: 0.2, boulders: false, reward: 60, name: 'Rookie Rudy' },
    medium: { pace: 0.92, mistake: 0.09, look: 22, boostEvery: 24, boost: 6, catchUp: 0.07, slowAhead: 0.1, rides: ['board', 'sled', 'tub'], world: 0.42, boulders: true, reward: 130, name: 'Frosty Fran' },
    hard: { pace: 0.99, mistake: 0.03, look: 28, boostEvery: 14, boost: 8, catchUp: 0.1, slowAhead: 0.06, rides: ['tub', 'board', 'sled'], world: 0.62, boulders: true, reward: 250, name: 'Blizzard Bob' },
  },
  laneOffset: 2.6,      // на старте: игрок левее центра, бот правее
};

class Rival {
  // body — объект для отрисовки (Player в браузере); в тестах можно передать простой объект.
  constructor(body, rnd = Math.random) { this.body = body; this.rnd = rnd; }

  reset(world, level, playerRide) {
    const cfg = RACE.diff[level];
    this.cfg = cfg; this.level = level;
    this.ride = cfg.rides.find((r) => r !== playerRide) || cfg.rides[0];
    this.stats = rideStats(this.ride, {});
    this.s = 2; this.x = world.center(this.s) + RACE.laneOffset; this.v = 6; this.vx = 0; this.vy = 0;
    this.y = world.height(this.x, this.s); this.grounded = true; this.onRamp = null;
    this.boostT = 0; this.boostCd = cfg.boostEvery ? 6 + this.rnd() * cfg.boostEvery * 0.5 : Infinity;
    this.stumble = 0; this.decided = new Set(); this.finished = false; this.finishT = 0; this.t = 0; this.steer = 0;
  }

  // Скорость, которую держит хороший игрок без петард на этой дистанции.
  cruise(player) {
    const c = this.stats;
    return c.vmaxBase + (player.vBonus || 0) + Math.min(this.s / 140, c.vmaxGrow);
  }

  update(dt, world, player, running) {
    if (!running) return;
    this.t += dt;
    const cfg = this.cfg;
    if (this.finished) { this.v = damp(this.v, 0, 1.2, dt); this.s += this.v * dt; this._follow(dt, world); return; }

    // Целевая скорость: темп сложности × крейсерская игрока + резинка по отрыву.
    let want = this.cruise(player) * cfg.pace;
    const gap = this.s - player.s;
    if (gap > 35) want *= 1 - Math.min(cfg.slowAhead, (gap - 35) / 300);
    if (gap < -25) want *= 1 + Math.min(cfg.catchUp, (-gap - 25) / 250);
    if (this.boostCd !== Infinity) {
      this.boostCd -= dt;
      if (this.boostCd <= 0 && this.grounded) { this.boostT = 2.2; this.boostCd = cfg.boostEvery * (0.75 + this.rnd() * 0.5); }
    }
    if (this.boostT > 0) { this.boostT -= dt; want += cfg.boost; }
    if (this.stumble > 0) { this.stumble -= dt; want *= 0.55; }
    if (this.t < 0.4) want = Math.min(want, 8);
    this.v = damp(this.v, want, this.v < want ? 0.7 : 1.5, dt);

    // Руль: держит линию по центру/чуть в стороне, объезжает препятствия впереди.
    let target = world.center(this.s + 12) + Math.sin(this.s * 0.013) * 3;
    for (const o of world.obstacles) {
      if (o.off || o.s < this.s + 1 || o.s > this.s + cfg.look) continue;
      if (Math.abs(o.x - target) > o.r + 2.2) continue;
      // Ошибка: иногда не замечает препятствие (решение одно на препятствие).
      if (!this.decided.has(o)) { this.decided.add(o); o.__miss = o.__miss || new Set(); if (this.rnd() < cfg.mistake) o.__miss.add(this); }
      if (o.__miss && o.__miss.has(this)) continue;
      target = o.x + (target >= o.x ? 1 : -1) * (o.r + 2.4);
    }
    const lim = TRACK.HALF - 0.8, cu = world.center(this.s);
    target = clamp(target, cu - lim, cu + lim);
    this.steer = clamp((target - this.x) / 2.5, -1, 1);
    this.vx = damp(this.vx, this.steer * this.stats.steer * 0.85, this.stats.steerResp, dt);
    this.x = clamp(this.x + this.vx * dt, cu - lim, cu + lim);
    this.s += this.v * dt;

    // Столкновение с препятствием (только если «не заметил»): спотыкается, мир не меняется.
    if (this.stumble <= 0 && this.grounded) {
      for (const o of world.obstacles) {
        if (o.off || Math.abs(o.s - this.s) > 0.8) continue;
        if (Math.abs(o.x - this.x) < o.r + this.stats.radius * 0.8) { this.stumble = 0.9; this.v *= 0.6; this.bump = 1; break; }
      }
    }
    this._follow(dt, world);
    if (world.finish && this.s >= world.finish && !this.finished) { this.finished = true; this.finishT = this.t; }
  }

  // Высота: по рельефу и трамплинам, с прыжками.
  _follow(dt, world) {
    const g = world.ground(this.x, this.s);
    if (this.grounded) {
      if (this.onRamp && !g.ramp) { this.grounded = false; this.vy = 5.5 + this.v * 0.06 + TRACK.SLOPE * this.v * 0.3; this.air = 0; }
      else this.y = g.y;
      this.onRamp = g.ramp;
    }
    if (!this.grounded) {
      this.air += dt; this.vy -= 15 * dt; this.y += this.vy * dt;
      if (this.y <= g.y) { this.y = g.y; this.grounded = true; this.vy = 0; this.onRamp = g.ramp; this.bump = 0.6; }
    }
    this.bump = Math.max(0, (this.bump || 0) - dt * 2);
  }

  // Перенести состояние в тело для отрисовки (Player) и анимировать.
  syncBody(dt) {
    const p = this.body; if (!p) return;
    p.x = this.x; p.s = this.s; p.y = this.y; p.v = this.v; p.vx = this.vx; p.vy = this.vy; p.grounded = this.grounded;
    p.pitch = this.grounded ? 0 : -Math.min(0.5, this.air * 0.4); p.airPitch = 0;
    p.bank = damp(p.bank || 0, -this.vx * 0.03, 6, dt);
    p.roll = this.stumble > 0 ? Math.sin(this.t * 20) * 0.25 * this.stumble : 0;
    p.power.boost = this.boostT > 0 ? this.boostT : 0;
    p.alive = true; p.invuln = 0; p.avalancheGap = 99;
    if (this.bump) p.bobV += this.bump * 0.3;
    p._animate(dt, this.steer);
  }
}

// --- rope.js ---
// Режим «Связка»: до 4 райдеров соединены резинками по цепочке (1–2–3–4).
// Резинка тянет только при растяжении (как эспандер), гасит колебания, может зацепиться за ёлку или камень:
// тогда она огибает препятствие, и если команда продолжает разъезжаться — натягивается до предела
// и выстреливает связанных райдеров в сторону («рогатка»). Без DOM — тестируется в Node.

const ROPE = {
  rest: 6.5,        // длина без натяжения, м
  stiff: 7.5,       // жёсткость: м/с² на метр растяжения
  damp: 2.2,        // гашение по скорости растяжения
  maxPull: 34,      // предел ускорения от одной резинки, м/с²
  snapLen: 15,      // длина вокруг препятствия, при которой связку выстреливает
  snagTypes: { tree: 1, rock: 1 },
  flingSide: 15,    // м/с вбок при выстреле
  flingUp: 8.5,     // м/с вверх
  hearts: 3,
  len: 1600,        // длина трассы до финиша
  worldDiff: 0.12,  // препятствий меньше, чем в гонке: главная опасность — резинка
  reviveT: 1.4,
  slots: [-3.6, -1.2, 1.2, 3.6],   // строй поперёк трассы (для 4)
};

// Одна резинка между двумя райдерами. Тела: { x, s, v, vx, y, alive }.
class RopeLink {
  constructor(i) { this.i = i; this.snag = null; this.side = 0; this.len = 0; this.prevLen = 0; this.T = 0; this.cool = 0; }
  reset() { this.slackT = 0; this.snag = null; this.side = 0; this.len = 0; this.prevLen = 0; this.T = 0; this.cool = 0; }
}

const Rope = {
  // Места в строю для n райдеров (по центру трассы).
  slotsFor(n) { return n <= 1 ? [0] : n === 2 ? [-1.8, 1.8] : n === 3 ? [-3, 0, 3] : ROPE.slots.slice(); },
  // Знак: с какой стороны от прямой A→B лежит точка P.
  side(ax, as, bx, bs, px, ps) { return Math.sign((bx - ax) * (ps - as) - (bs - as) * (px - ax)) || 1; },
  // Расстояние от точки до отрезка (в плоскости x–s).
  segDist(ax, as, bx, bs, px, ps) {
    const dx = bx - ax, ds = bs - as, L2 = dx * dx + ds * ds;
    const t = L2 ? clamp(((px - ax) * dx + (ps - as) * ds) / L2, 0, 1) : 0;
    return Math.hypot(ax + dx * t - px, as + ds * t - ps);
  },

  // Шаг физики для пары связанных тел. Возвращает силы {a:{x,s}, b:{x,s}} и, возможно, событие выстрела.
  step(link, A, B, obstacles, dt) {
    if (link.cool > 0) link.cool -= dt;
    // 1) Зацеп: резинка проходит сквозь ёлку/камень между райдерами — теперь она её огибает.
    if (!link.snag && link.cool <= 0 && A.alive && B.alive) {
      const s0 = Math.min(A.s, B.s) - 1, s1 = Math.max(A.s, B.s) + 1;
      for (const o of obstacles) {
        if (o.s < s0) continue;
        if (o.s > s1) break;
        if (o.off || !ROPE.snagTypes[o.kind]) continue;
        const core = o.r * 0.55;
        // Препятствие у самого райдера — это удар, не зацеп.
        if (Math.hypot(A.x - o.x, A.s - o.s) < o.r + 0.6 || Math.hypot(B.x - o.x, B.s - o.s) < o.r + 0.6) continue;
        if (Rope.segDist(A.x, A.s, B.x, B.s, o.x, o.s) < core) {
          link.snag = o; link.side = Rope.side(A.x, A.s, B.x, B.s, o.x, o.s);
          return { ...Rope._force(link, A, B, dt), ev: { type: 'snag', o } };
        }
      }
    }
    // 2) Отцеп: препятствие оказалось с другой стороны резинки (распрямилась) — или райдеры
    //    съехались вплотную, резинка провисла и соскользнула. Это и есть спасение от «рогатки».
    if (link.snag) {
      const o = link.snag, close = Math.hypot(A.x - B.x, A.s - B.s) < ROPE.rest * 0.75;
      link.slackT = close ? (link.slackT || 0) + dt : 0;
      if (o.off || Rope.side(A.x, A.s, B.x, B.s, o.x, o.s) !== link.side || link.slackT > 0.3) { link.snag = null; link.cool = 0.6; link.slackT = 0; return { ...Rope._force(link, A, B, dt), ev: { type: 'unsnag' } }; }
    }
    const f = Rope._force(link, A, B, dt);
    // 3) Рогатка: зацепившаяся резинка растянута до предела — выстреливает обоих.
    if (link.snag && link.len > ROPE.snapLen && A.alive && B.alive) {
      const o = link.snag; link.snag = null; link.cool = 2.5;
      const out = (p) => ({ x: Math.sign(p.x - o.x || 1) * ROPE.flingSide, up: ROPE.flingUp });
      return { ...f, ev: { type: 'fling', o, a: out(A), b: out(B) } };
    }
    return f;
  },

  // Натяжение: тянет только растянутая резинка, к точке зацепа (или прямо к соседу).
  _force(link, A, B, dt) {
    const P = link.snag ? { x: link.snag.x, s: link.snag.s } : null;
    const la = P ? Math.hypot(P.x - A.x, P.s - A.s) : Math.hypot(B.x - A.x, B.s - A.s);
    const lb = P ? Math.hypot(B.x - P.x, B.s - P.s) : la;
    link.prevLen = link.len || (P ? la + lb : la);
    link.len = P ? la + lb + link.snag.r * 0.5 : la;
    const rate = dt > 0 ? (link.len - link.prevLen) / dt : 0;
    const ext = link.len - ROPE.rest;
    let T = ext > 0 ? ROPE.stiff * ext + ROPE.damp * rate : 0;
    T = clamp(T, 0, ROPE.maxPull); link.T = T;
    const zero = { a: { x: 0, s: 0 }, b: { x: 0, s: 0 } };
    if (!T) return zero;
    const ta = P || B, tb = P || A;
    const da = Math.max(1e-3, Math.hypot(ta.x - A.x, ta.s - A.s)), db = Math.max(1e-3, Math.hypot(tb.x - B.x, tb.s - B.s));
    return { a: { x: T * (ta.x - A.x) / da, s: T * (ta.s - A.s) / da }, b: { x: T * (tb.x - B.x) / db, s: T * (tb.s - B.s) / db } };
  },

  // Точки резинки для отрисовки: провисает, когда не натянута; огибает зацеп.
  points(link, A, B, yAt, n = 8) {
    const pts = [];
    const seg = (P, Q, sagMax) => {
      const L = Math.hypot(Q.x - P.x, Q.s - P.s);
      const sag = Math.max(0, sagMax - L * 0.06) * clamp(1 - link.T / 6, 0, 1);
      for (let i = 0; i <= n; i++) {
        const t = i / n, x = P.x + (Q.x - P.x) * t, s = P.s + (Q.s - P.s) * t;
        const y = P.y + (Q.y - P.y) * t - sag * 4 * t * (1 - t);
        pts.push([x, Math.max(y, yAt(x, s) + 0.08), -s]);
      }
    };
    const a = { x: A.x, s: A.s, y: A.y + 0.75 }, b = { x: B.x, s: B.s, y: B.y + 0.75 };
    if (link.snag) {
      const o = link.snag, p = { x: o.x, s: o.s, y: yAt(o.x, o.s) + Math.min(1.1, (o.h || 2) * 0.35) };
      seg(a, p, 0.2); pts.pop(); seg(p, b, 0.2);
    } else seg(a, b, 1.3);
    return pts;
  },
};

// Бот-напарник: держит своё место в строю, объезжает препятствия и — главное — не разводит
// резинку по разные стороны ёлки: объезжает её с той же стороны, что и сосед.
class TeamBot {
  constructor(slotX, rnd = Math.random, skill = 0.9) { this.slotX = slotX; this.rnd = rnd; this.skill = skill; this.input = { steer: 0, crouch: false, jump: false, flip: 0 }; this.decided = new Map(); }
  think(me, mates, world) {
    // Выбор полосы: перебираем смещения поперёк трассы и берём самую «дешёвую» —
    // свободную от препятствий впереди, близкую к своему месту в строю и к соседям,
    // и не разводящую резинку по разные стороны ёлки.
    const cu = world.center(me.s + 8), lim = TRACK.HALF - 1.2;
    const cx = mates.length ? mates.reduce((a, m) => a + m.x, 0) / mates.length : cu;
    const home = cu + this.slotX * 0.7, want = mates.length ? home * 0.5 + (cx + this.slotX * 0.5) * 0.5 : home;
    const near = [];
    for (const o of world.obstacles) {
      if (o.off || o.s < me.s - 1) continue;
      if (o.s > me.s + 34) break;
      if (!this.decided.has(o)) this.decided.set(o, this.rnd() < this.skill);
      if (this.decided.get(o)) near.push(o);
    }
    let best = me.x, bestC = Infinity;
    for (let k = -16; k <= 16; k++) {
      const x = cu + (k / 16) * lim;
      let c = Math.abs(x - want) * 0.6 + Math.abs(x - (this.lane ?? me.x)) * 0.25;
      for (const o of near) {
        const d = Math.abs(x - o.x), clear = o.r + 1.7, w = 1 + Math.max(0, 30 - (o.s - me.s)) * 0.15;
        if (d < clear) c += (clear - d) * 12 * w;
        // ёлка между мной (на этой полосе) и соседом — риск «рогатки»
        if (ROPE.snagTypes[o.kind]) for (const m of mates) if ((o.x - x) * (o.x - m.x) < 0 && Math.abs(m.s - o.s) < 14) c += 6;
      }
      if (c < bestC) { bestC = c; best = x; }
    }
    this.lane = best;
    this.input.steer = clamp((best - me.x) / 1.3 - me.vx * 0.12, -1, 1);
    this.input.crouch = false; this.input.jump = false;
    return this.input;
  }
}

// --- avalanche.js ---
// Лавина. Держится позади игрока на «спокойной» дистанции, но время от времени делает рывок:
// разгоняется быстрее игрока и подбирается вплотную. Уйти можно петардой (гарантированно
// появляется впереди) или идеально чистой ездой в группировке. Рывок выдыхается сам.
// Без DOM — тестируется в Node.

const AVAL = {
  startGap: 45,
  maxGap: 110,          // дальше этого лавина не отстаёт (подтягивается)
  calmGap: [55, 72],    // где держится в спокойном режиме (ближе — на сложных уровнях)
  firstSurge: [13, 19], // сек до первого рывка
  surgeEvery: [24, 36], // сек между рывками (на сложных — чаще)
  surgeMinS: 120,       // раньше этой дистанции рывков нет
  surgeRel: [4.5, 7.5], // насколько быстрее «крейсерской» скорости игрока идёт рывок
  surgeMax: 11,         // сек, потом выдыхается
  holdGap: 8,           // вплотную лавина ползёт медленно — даёт шанс
  holdRel: 1.1,
  retreatRel: 7,        // насколько медленнее игрока откатывается после рывка
  killGap: 1.5,
};

class Avalanche {
  // intensity 0..1 — сложность (уровень или бесконечный режим).
  constructor(rnd = Math.random) { this.rnd = rnd; this.intensity = 0.3; this.surges = true; this.reset(); }

  reset() {
    this.s = -AVAL.startGap; this.v = 10; this.t = 0;
    this.mode = 'calm';            // calm | surge | retreat | stop
    this.timer = lerp(AVAL.firstSurge[0], AVAL.firstSurge[1], this.rnd());
    this.surgeT = 0;
    this.calmGap = lerp(AVAL.calmGap[1], AVAL.calmGap[0], this.intensity);
  }

  setIntensity(k) { this.intensity = clamp(k, 0, 1); this.calmGap = lerp(AVAL.calmGap[1], AVAL.calmGap[0], this.intensity); }
  gap(player) { return player.s - this.s; }
  get surging() { return this.mode === 'surge'; }

  // «Крейсерская» скорость игрока — его максимум без петарды и группировки.
  _cruise(player) { return player.power.boost > 0 ? player.vmax() - BOOST_EXTRA : player.vmax(); }

  update(dt, player, events) {
    if (this.mode === 'stop') { this.v = damp(this.v, 0, 1.5, dt); this.s += this.v * dt; return; }
    this.t += dt;
    const gap = this.gap(player), boost = player.power.boost > 0;
    let want;

    if (this.mode === 'calm') {
      // Покачивается около своей дистанции: дальше — догоняет, ближе — притормаживает.
      want = player.v + clamp((gap - this.calmGap) * 0.12, -3, 2.5);
      // Лавина не «ждёт» медленного: ниже половины крейсерской скорости игрока не сбавляет — стоять нельзя.
      if (this.t > 4) want = Math.max(want, this._cruise(player) * 0.55);
      if (this.t < 4) want = Math.min(want, 8 + this.t * 4);          // на старте разгоняется вместе с игроком
      if (this.surges && player.alive && player.s > AVAL.surgeMinS) {
        this.timer -= dt;
        if (this.timer <= 0) { this.mode = 'surge'; this.surgeT = 0; events.push({ type: 'avSurge' }); }
      }
    } else if (this.mode === 'surge') {
      this.surgeT += dt;
      const rel = lerp(AVAL.surgeRel[0], AVAL.surgeRel[1], this.intensity);
      want = gap > AVAL.holdGap ? this._cruise(player) + rel : player.v + AVAL.holdRel;
      if (boost) { this._retreat(); events.push({ type: 'avEscape' }); }
      else if (this.surgeT > AVAL.surgeMax) { this._retreat(); events.push({ type: 'avCalm' }); }
    } else {   // retreat
      want = player.v - AVAL.retreatRel;
      if (gap > this.calmGap) this.mode = 'calm';
    }

    if (boost) want = Math.min(want, player.v * 0.4);   // с петардой лавина отстаёт
    this.v = damp(this.v, Math.max(want, 4), this.mode === 'surge' ? 2.2 : 1.6, dt);
    this.s += this.v * dt;
    if (player.s - this.s > AVAL.maxGap) this.s = player.s - AVAL.maxGap;
    if (player.alive && player.s - this.s < AVAL.killGap) player.crash('avalanche', events);
  }

  _retreat() {
    this.mode = 'retreat';
    const k = lerp(1, 0.65, this.intensity);
    this.timer = lerp(AVAL.surgeEvery[0], AVAL.surgeEvery[1], this.rnd()) * k;
  }

  stop() { this.mode = 'stop'; }
  // После «Продолжить за видео» — отодвинуть и успокоить.
  pushBack(player, dist = 70) { this.s = Math.min(this.s, player.s - dist); if (this.mode === 'surge') this._retreat(); }
}

// --- boulder.js ---
// Валун: срывается со склона сбоку впереди и катится наперерез игроку.
// Пока далеко — подправляет курс на игрока, последние метры катится прямо:
// можно перепрыгнуть (прыжок) или уйти в сторону.

const BOULDER = {
  firstAt: 250,        // раньше этой дистанции валунов нет
  firstDelay: [5, 10],
  gap: [10, 18],       // секунды между валунами
  spawnAhead: 85,      // м впереди игрока
  side: TRACK.HALF + 7,// откуда срывается (от центра трассы)
  down: 7,             // скорость вниз по склону, м/с
  r: 0.9,              // радиус (высота ~1.8 м); верх шара узкий — перепрыгивается
  aimUntil: 22,        // ближе этого — курс не меняет
  maxVx: 14,
};

class BoulderSystem {
  constructor(rnd = Math.random) { this.rnd = rnd; this.enabled = true; this.stopAt = Infinity; this.reset(); }

  reset() {
    this.b = null;
    this.timer = lerp(BOULDER.firstDelay[0], BOULDER.firstDelay[1], this.rnd());
  }

  // Предупреждение горит, пока валун не прокатился мимо игрока.
  get warning() { return !!(this.b && !this.b.passed); }

  update(dt, player, world, events) {
    if (!this.b) {
      if (!this.enabled || !player.alive || player.s < BOULDER.firstAt || player.s > this.stopAt) return;
      this.timer -= dt;
      if (this.timer > 0) return;
      const side = this.rnd() < 0.5 ? -1 : 1, s = player.s + BOULDER.spawnAhead;
      const x = world.center(s) + side * BOULDER.side;
      this.b = { s, x, side, vx: 0, y: world.height(x, s) + BOULDER.r, t: 0, rollS: 0, rollX: 0, passed: false, hit: false, vy: 0 };
      events.push({ type: 'rockWarn', side });
      return;
    }
    const b = this.b;
    b.t += dt;
    if (b.hit) {
      // Сбитый петардой или ударом — отлетает и падает.
      b.vy -= 15 * dt; b.y += b.vy * dt; b.x += b.vx * dt; b.s += BOULDER.down * dt;
      if (b.t > 3) this._done(player);
      return;
    }
    b.s += BOULDER.down * dt;
    const gap = b.s - player.s;
    if (gap > BOULDER.aimUntil && player.alive) {
      const closing = Math.max(player.v - BOULDER.down, 3);
      const want = clamp((player.x - b.x) / Math.max(gap / closing, 0.4), -BOULDER.maxVx, BOULDER.maxVx);
      b.vx = damp(b.vx, want, 4, dt);
    }
    b.x += b.vx * dt;
    b.rollS += (BOULDER.down / BOULDER.r) * dt;
    b.rollX += (b.vx / BOULDER.r) * dt;
    b.y = world.height(b.x, b.s) + BOULDER.r + Math.abs(Math.sin(b.t * 5)) * 0.18;

    if (!b.passed && player.alive && Math.abs(gap) < BOULDER.r + player.cfg.radius * 0.7) {
      const dx = Math.abs(b.x - player.x), rel = player.rel(world);
      if (dx < BOULDER.r + player.cfg.radius * 0.6 && rel < BOULDER.r * 2 * 0.7) {
        b.passed = true; b.hit = true; b.vy = 6; b.vx = (b.x >= player.x ? 1 : -1) * 8; b.t = 0;
        player.hit('boulder', events, null);
        return;
      }
    }
    if (!b.passed && gap < -(BOULDER.r + 1)) { b.passed = true; if (player.alive) events.push({ type: 'rockDodge' }); }
    if (gap < -25) this._done(player);
  }

  _done(player) {
    this.b = null;
    const k = player.s > 2000 ? 0.75 : 1;   // дальше — чаще
    this.timer = lerp(BOULDER.gap[0], BOULDER.gap[1], this.rnd()) * k;
  }
}

// --- input.js ---
// Управление: клавиатура и тач. На выходе: steer (-1..1), crouch (пригнуться/разгон), brake,
// flip (-1/0/1 в воздухе), jump (одноразовый флаг прыжка).

const STEER_PX = 45;   // смещение пальца для полного поворота
const SWIPE_PX = 45;   // свайп: столько пикселей по вертикали…
const SWIPE_MS = 260;  // …за столько миллисекунд

class Input {
  constructor(el) {
    this.keys = new Set();
    this.touchSteer = 0;
    this.touchCrouchT = 0;
    this.flipSwipe = 0;  // сальто свайпом (одноразово)
    this.jumpBuf = 0;   // буфер нажатия прыжка, чтобы не терять нажатие между кадрами
    // Игра подставляет функции: игрок в воздухе? доступен ли двойной прыжок (шарики)?
    this.isAirborne = () => false;
    this.canDoubleJump = () => false;
    this.touches = new Map();
    this.anyPressed = false;
    this.onPause = null;

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'KeyP' && this.onPause) this.onPause();   // Esc не трогаем: в браузере он выходит из полноэкранного режима
      if (e.code === 'Space' && !e.repeat) this.jumpBuf = 0.15;
      this.keys.add(e.code); this.anyPressed = true;
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => { this.keys.clear(); this.touches.clear(); this._recalc(); });

    // Тач — всё одним пальцем:
    //  • ведёшь палец влево/вправо — поворот (как джойстик: 45 px от точки касания = полный поворот);
    //  • свайп вверх или короткий тап — прыжок, свайп вниз — пригнуться;
    //  • в воздухе свайп вверх/вниз — полное сальто вперёд/назад.
    // Один свайп — одно действие за касание (длинный свайп вверх не превращается в прыжок + сальто).
    const opt = { passive: false };
    el.addEventListener('touchstart', (e) => { e.preventDefault(); for (const t of e.changedTouches) this._start(t.identifier, t.clientX, t.clientY); }, opt);
    el.addEventListener('touchmove', (e) => { e.preventDefault(); for (const t of e.changedTouches) this._move(t.identifier, t.clientX, t.clientY); }, opt);
    const end = (e) => { e.preventDefault(); for (const t of e.changedTouches) this._end(t.identifier); };
    el.addEventListener('touchend', end, opt);
    el.addEventListener('touchcancel', end, opt);
    // Мышь (ноутбуки, тачпады): зажал кнопку и ведёшь влево/вправо — то же, что палец; резкий взмах вверх — прыжок.
    el.addEventListener('mousedown', (e) => { if (e.button === 0) { e.preventDefault(); this._start('mouse', e.clientX, e.clientY); } });
    window.addEventListener('mousemove', (e) => { if (this.touches.has('mouse')) this._move('mouse', e.clientX, e.clientY); });
    window.addEventListener('mouseup', (e) => { if (e.button === 0 && this.touches.has('mouse')) this._end('mouse'); });
    // Требование модерации: без системного контекстного меню.
    window.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  _start(id, x, y) {
    this.anyPressed = true;
    const t = performance.now();
    this.touches.set(id, { ax: x, x, y, t0: t, swiped: false, travel: 0, hist: [{ x, y, t }] });
    this.primary = id;
    this._recalc();
  }
  _move(id, x, y) {
    const tt = this.touches.get(id); if (!tt) return;
    tt.travel += Math.hypot(x - tt.x, y - tt.y);
    tt.x = x; tt.y = y;
    // Точка-«центр» джойстика тянется за пальцем, чтобы обратное движение сразу выравнивало.
    if (Math.abs(tt.x - tt.ax) > STEER_PX) tt.ax = tt.x - Math.sign(tt.x - tt.ax) * STEER_PX;
    // Свайп — только резкий взмах: за последние SWIPE_MS палец прошёл ≥ SWIPE_PX по вертикали
    // и заметно больше по вертикали, чем вбок. Медленный сдвиг пальца при рулении прыжком не считается.
    const now = performance.now();
    tt.hist.push({ x, y, t: now });
    while (tt.hist.length > 2 && now - tt.hist[0].t > SWIPE_MS) tt.hist.shift();
    if (!tt.swiped) {
      const o = tt.hist[0], dy = y - o.y, dx = x - o.x;
      if (Math.abs(dy) >= SWIPE_PX && Math.abs(dy) >= Math.abs(dx) * 1.5) {
        tt.swiped = true;
        this._swipe(dy < 0 ? 1 : -1);
      }
    }
    this._recalc();
  }
  _end(id) {
    const tt = this.touches.get(id);
    // Короткий тап без движения — прыжок (только палец: клик мышью по экрану не прыгает,
    // иначе клик, чтобы сделать окно игры активным, превращается в прыжок).
    if (tt && id !== 'mouse' && !tt.swiped && tt.travel < 12 && performance.now() - tt.t0 < 220) this._swipe(1, true);
    this.touches.delete(id);
    this._recalc();
  }

  // dir: 1 — вверх, -1 — вниз. tap — короткое касание (только прыжок).
  _swipe(dir, tap = false) {
    if (!this.isAirborne()) {
      if (dir > 0) this.jumpBuf = 0.2; else this.touchCrouchT = 0.9;    // земля: прыжок / пригнуться
    } else if (dir > 0 && this.canDoubleJump()) {
      this.jumpBuf = 0.2;                                               // шарики: двойной прыжок
    } else if (!tap) {
      this.flipSwipe = dir;                                             // воздух: полное сальто
    }
  }

  // Руление — по последнему коснувшемуся пальцу, плавно от смещения относительно точки касания.
  _recalc() {
    const t = this.touches.get(this.primary) || [...this.touches.values()].pop();
    if (!t) { this.touchSteer = 0; return; }
    const d = t.x - t.ax;
    this.touchSteer = Math.abs(d) < 6 ? 0 : clamp(d / STEER_PX, -1, 1);
  }

  update(dt) {
    if (this.touchCrouchT > 0) this.touchCrouchT -= dt;
    if (this.jumpBuf > 0) this.jumpBuf -= dt;
  }

  // Сброс одноразовых команд: старт заезда, «GO!», выход из паузы — чтобы нажатие,
  // сделанное в меню или во время отсчёта, не срабатывало прыжком в начале езды.
  clearActions() { this.jumpBuf = 0; this.flipSwipe = 0; this.touchCrouchT = 0; for (const t of this.touches.values()) t.swiped = true; }

  // Прыжок читается один раз за кадр (Player вызывает takeJump).
  takeJump() { if (this.jumpBuf > 0) { this.jumpBuf = 0; return true; } return false; }
  // Сальто свайпом: одноразово, направление 1 (вперёд) или -1 (назад).
  takeFlip() { const f = this.flipSwipe || 0; this.flipSwipe = 0; return f; }
  get crouch() { return this.tuck || this.touchCrouchT > 0; }

  get steer() {
    const k = this.keys;
    let s = 0;
    if (k.has('ArrowLeft') || k.has('KeyA')) s -= 1;
    if (k.has('ArrowRight') || k.has('KeyD')) s += 1;
    return clamp(s + this.touchSteer, -1, 1);
  }
  get tuck() { return this.keys.has('ArrowUp') || this.keys.has('KeyW'); }
  get brake() { return this.keys.has('ArrowDown') || this.keys.has('KeyS'); }
  // В воздухе: вверх — сальто вперёд, вниз — назад.
  get flip() {
    let f = 0;
    if (this.tuck) f += 1;
    if (this.brake) f -= 1;
    return clamp(f, -1, 1);
  }
}

// --- music.js ---
// Музыка без слов, сочинена для игры и синтезируется кодом (WebAudio) — никаких чужих записей и прав.
// Треки: menu (спокойная зимняя тема), гора-за-горой (погоня; у каждой горы своя тональность и окраска),
// endless, джинглы win / lose. Работает и в обычном AudioContext (игра), и в OfflineAudioContext (видео).

const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);
const _ = null;

// Аккорды: [корень, тип]. maj7, m7, maj, min, sus.
const CHORD = {
  maj: [0, 4, 7], min: [0, 3, 7], maj7: [0, 4, 7, 11], m7: [0, 3, 7, 10], sus: [0, 5, 7], add9: [0, 4, 7, 14],
};
const chordNotes = (root, type) => CHORD[type].map((i) => root + i);

// --- Тема меню: ре мажор, 90 bpm, музыкальная шкатулка + пэд + бубенцы ---
const MENU_MEL = [

// --- Погоня: ми минор, 136 bpm, бас восьмыми, бочка, арпеджио, мелодия во второй половине ---
const RUN_CH = [[52, 'min'], [48, 'maj'], [55, 'maj'], [50, 'maj']];

const ARP = [0, 2, 1, 2, 3, 2, 1, 2];

// --- Гонка: ля минор, хук во второй половине ---
const RACE_CH = [[57, 'min'], [53, 'maj'], [60, 'maj'], [55, 'maj']];
const RACE_MEL = [

  [79, _, _, _, 74, _, _, _, 71, _, 74, _, 79, _, _, _],
];   // индексы нот аккорда (с октавой)

// У каждой горы своя окраска одной и той же «погони»: тональность, темп, тембр, бубенцы.
const RUN_STYLE = {
  forest: { tr: 0, bpm: 132, lead: 'square', bells: false },
  pass: { tr: -2, bpm: 136, lead: 'sawtooth', bells: false },
  gorge: { tr: 3, bpm: 138, lead: 'triangle', bells: false, sparkle: true },
  village: { tr: -4, bpm: 130, lead: 'square', bells: false, swing: true },
  eve: { tr: 1, bpm: 134, lead: 'triangle', bells: true, sparkle: true },
  endless: { tr: -1, bpm: 142, lead: 'sawtooth', bells: false },
};

class Music {
  constructor() {
    this.ctx = null; this.out = null; this.track = null; this.want = null;
    this.on = true; this.intensity = 0; this.timer = 0;
  }

  // Подключение к звуковому контексту игры (после первого касания/клика) или к офлайн-контексту.
  attach(ctx, dest) {
    this.ctx = ctx;
    this.out = ctx.createGain(); this.out.gain.value = this.on ? 1 : 0; this.out.connect(dest);
    const len = ctx.sampleRate, nb = ctx.createBuffer(1, len, ctx.sampleRate), d = nb.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = nb;
    // Реверб: импульс из затухающего шума — «зимний» простор.
    const rl = Math.floor(ctx.sampleRate * 1.8), ir = ctx.createBuffer(2, rl, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < rl; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / rl, 3); }
    this.verb = ctx.createConvolver(); this.verb.buffer = ir;
    this.verbIn = ctx.createGain(); this.verbIn.gain.value = 0.35;
    this.verbIn.connect(this.verb); this.verb.connect(this.out);
    if (this.want) this.play(this.want);
  }

  setOn(on) {
    this.on = on;
    if (on && this.track && this.ctx) this.track.next = this.ctx.currentTime + 0.1;   // не догонять пропущенные ноты
    if (this.out) this.out.gain.setTargetAtTime(on ? 1 : 0, this.ctx.currentTime, 0.05);
  }
  setIntensity(k) { this.intensity = k; }

  // Сменить трек (плавно). Джинглы (win/lose) играют один раз, затем — следующий трек.
  play(name, after = null) {
    this.want = name;
    if (!this.ctx || (this.track && this.track.name === name)) return;
    const t = this.ctx.currentTime;
    if (this.track) { const old = this.track.bus; old.gain.setTargetAtTime(0, t, 0.25); setTimeout(() => old.disconnect(), 1500); }
    const bus = this.ctx.createGain(); bus.gain.value = 0; bus.connect(this.out); bus.gain.setTargetAtTime(this._vol(name), t, 0.3);
    const song = this._song(name);
    this.track = { name, bus, song, step: 0, next: t + 0.12, after };
    if (!this.timer && !this.offline) this.timer = setInterval(() => this._tick(), 25);
  }
  // Громкость треков выровнена по средней громкости (меню и джинглы тише по своей природе).
  _vol(name) { return { menu: 0.55, win: 0.5, lose: 0.9, race: 0.3 }[name] || 0.32; }
  stop() { if (this.track) { this.track.bus.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2); this.track = null; } this.want = null; }

  _tick() {
    const tr = this.track; if (!tr || !this.on) return;
    const ahead = this.ctx.currentTime + 0.2;
    while (tr.next < ahead) {
      const dur = 60 / tr.song.bpm / 4;
      const swing = tr.song.swing && tr.step % 2 ? dur * 0.18 : 0;
      tr.song.step(this, tr.step, tr.next + swing, tr.bus, dur);
      tr.next += dur; tr.step++;
      if (tr.song.len && tr.step >= tr.song.len) {   // джингл закончился
        const nxt = tr.after; this.track = null; this.want = null;
        if (nxt) this.play(nxt);
        return;
      }
    }
  }

  // Офлайн: расписать трек на secs секунд сразу (для видео).
  renderInto(name, secs) {
    this.offline = true; this.play(name);
    const tr = this.track; tr.bus.gain.value = this._vol(name); tr.next = 0.05;
    while (tr.next < secs) { const dur = 60 / tr.song.bpm / 4; tr.song.step(this, tr.step, tr.next, tr.bus, dur); tr.next += dur; tr.step++; }
  }

  // ---------- инструменты ----------
  _env(g, t, a, v, d) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  _osc(type, f, t, dur, v, dest, opts = {}) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (opts.detune) o.detune.value = opts.detune;
    if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t + dur);
    let node = o;
    if (opts.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.setValueAtTime(opts.lp, t); if (opts.lpEnd) f2.frequency.exponentialRampToValueAtTime(opts.lpEnd, t + dur); o.connect(f2); node = f2; }
    node.connect(g); this._env(g, t, opts.a || 0.005, v, dur);
    g.connect(dest); if (opts.verb) g.connect(this.verbIn);
    o.start(t); o.stop(t + (opts.a || 0.005) + dur + 0.05);
  }
  _noise(t, dur, v, type, freq, dest, q = 1) {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
    s.connect(f); f.connect(g); this._env(g, t, 0.002, v, dur); g.connect(dest);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  kick(t, d, v = 0.9) { this._osc('sine', 150, t, 0.22, v, d, { slide: 42 }); }
  snare(t, d, v = 0.35) { this._noise(t, 0.16, v, 'bandpass', 1900, d, 0.7); this._osc('triangle', 210, t, 0.08, v * 0.5, d); }
  hat(t, d, v = 0.08, open = false) { this._noise(t, open ? 0.22 : 0.045, v, 'highpass', 7500, d); }
  bells(t, d, v = 0.06) { this._noise(t, 0.09, v, 'bandpass', 9500, d, 2.5); this._noise(t + 0.03, 0.06, v * 0.7, 'bandpass', 7200, d, 3); }
  bass(t, d, m, dur, v = 0.26) { this._osc('sawtooth', midiHz(m), t, dur, v, d, { lp: 900, lpEnd: 180 }); }
  pluck(t, d, m, dur, v = 0.09, type = 'square') { this._osc(type, midiHz(m), t, dur, v, d, { lp: 2600, lpEnd: 500, verb: true }); }
  bell(t, d, m, v = 0.12) {
    const f = midiHz(m);
    this._osc('sine', f, t, 1.4, v, d, { verb: true });
    this._osc('sine', f * 2.76, t, 0.5, v * 0.25, d, { verb: true });
    this._osc('sine', f * 5.4, t, 0.25, v * 0.1, d);
  }
  pad(t, d, notes, dur, v = 0.035) {
    for (const m of notes) for (const dt of [-7, 7]) this._osc('sawtooth', midiHz(m), t, dur, v, d, { a: 0.4, lp: 1100, lpEnd: 700, detune: dt, verb: true });
  }
  lead(t, d, m, dur, v = 0.08, type = 'square') { this._osc(type, midiHz(m), t, dur, v, d, { a: 0.01, lp: 3200, lpEnd: 1400, verb: true }); }

  // ---------- треки ----------
  _song(name) {
    if (name === 'menu') return {
      bpm: 90,
      step: (M, i, t, d, sd) => {
        const bar = Math.floor(i / 16) % 8, s = i % 16, [root, type] = MENU_CH[bar % 4];
        if (s === 0) { M.pad(t, d, chordNotes(root, type), sd * 15.5); M.bass(t, d, root - 24, sd * 7, 0.16); }
        if (s === 8) M.bass(t, d, root - 24 + (bar % 2 ? 7 : 0), sd * 7, 0.13);
        const m = MENU_MEL[bar][s]; if (m) M.bell(t, d, m, 0.1);
        if (s % 4 === 2) M.bells(t, d, 0.025);
        if (bar >= 4 && s % 8 === 0) M.kick(t, d, 0.35);
      },
    };
    if (name === 'win') return {
      bpm: 150, len: 24,
      step: (M, i, t, d, sd) => {
        const seq = [72, _, 76, _, 79, _, 84, _, _, _, 83, 84, 88, _, _, _, _, _, _, _, _, _, _, _];
        if (seq[i]) { M.lead(t, d, seq[i], sd * 2.5, 0.09, 'triangle'); M.bell(t, d, seq[i] + 12, 0.05); }
        if (i === 0 || i === 12) M.pad(t, d, chordNotes(i ? 60 : 60, i ? 'add9' : 'maj'), sd * 10, 0.03);
        if (i % 4 === 0 && i < 16) M.kick(t, d, 0.5);
        if (i === 12) M.hat(t, d, 0.08, true);
      },
    };
    if (name === 'lose') return {
      bpm: 120, len: 16,
      step: (M, i, t, d, sd) => {
        const seq = [67, _, _, 66, _, _, 63, _, _, _, 62, _, _, _, _, _];
        if (seq[i]) M.lead(t, d, seq[i], sd * 3, 0.08, 'triangle');
        if (i === 0) M.pad(t, d, chordNotes(55, 'min'), sd * 14, 0.025);
      },
    };
    if (name === 'race') return {
      // Гонка: ля минор, 150 bpm — «четыре в пол», открытые тарелки на слабую долю, хлопок, бас-галоп, стабы и хук.
      bpm: 150,
      step: (M, i, t, d, sd) => {
        const bar = Math.floor(i / 16) % 8, s = i % 16, [root, type] = RACE_CH[bar % 4], hi = M.intensity;
        if (s % 4 === 0) M.kick(t, d, 0.85);
        if (s % 4 === 2) M.hat(t, d, 0.09, true);
        if (s === 4 || s === 12) { M.snare(t, d, 0.28); M._noise(t + 0.01, 0.1, 0.18, 'bandpass', 1200, d, 0.5); }
        if (s % 2 === 1) M.hat(t, d, 0.03);
        // бас-галоп: корень шестнадцатыми с акцентом
        M.bass(t, d, root - 24 + (s === 6 || s === 14 ? 12 : 0), sd * 0.9, s % 4 === 0 ? 0.24 : 0.15);
        // стабы аккорда на слабые доли
        if (s === 2 || s === 6 || s === 10) for (const m of chordNotes(root + 12, type)) M.pluck(t, d, m, sd * 0.9, 0.025, 'sawtooth');
        if (bar >= 4) { const m = RACE_MEL[bar - 4][s]; if (m) M.lead(t, d, m, sd * 2.2, 0.07, 'square'); }
        else if (s % 4 === 3) M.pluck(t, d, chordNotes(root, type)[s % 3] + 24, sd, 0.03, 'triangle');
        if (s === 15 && bar % 2 === 1) M._osc('sine', midiHz(root), t, 0.12, 0.2, d, { slide: midiHz(root + 12) });
        if (hi > 0.5 && s % 2 === 0) M.hat(t, d, 0.05);
      },
    };
    const st = RUN_STYLE[name] || RUN_STYLE.forest;
    return {
      bpm: st.bpm, swing: st.swing,
      step: (M, i, t, d, sd) => {
        const bar = Math.floor(i / 16) % 8, s = i % 16, [r0, type] = RUN_CH[bar % 4], root = r0 + st.tr;
        const notes = chordNotes(root, type).concat(root + 12), hi = M.intensity;
        // ударные
        if (s % 4 === 0) M.kick(t, d, 0.8);
        if (s === 4 || s === 12) M.snare(t, d, 0.3);
        if (s % 2 === 0) M.hat(t, d, s % 4 === 2 ? 0.07 : 0.04);
        if (hi > 0.5 && s % 2 === 1) M.hat(t, d, 0.05);                          // рывок лавины: шестнадцатые
        if (hi > 0.5 && s >= 12) M._osc('sine', midiHz(45 + (s - 12) * 3 + st.tr), t, 0.12, 0.25, d, { slide: 60 });   // томы
        if (s === 15 && bar % 4 === 3) M.hat(t, d, 0.07, true);
        if (st.bells && s % 2 === 0) M.bells(t, d, 0.03);
        // бас восьмыми: корень, на рывке — октавами
        if (s % 2 === 0) M.bass(t, d, root - 24 + (hi > 0.5 && s % 4 === 2 ? 12 : 0) + (s === 14 ? 7 : 0), sd * 1.6, 0.22);
        // арпеджио (первая половина) / мелодия (вторая)
        if (bar < 4) { if (s % 2 === 0) M.pluck(t, d, notes[ARP[(s / 2) % 8]] + 12, sd * 1.8, 0.05, st.lead); }
        else { const m = RUN_MEL[bar - 4][s]; if (m) M.lead(t, d, m + st.tr, sd * 2.6, 0.065, st.lead); if (s % 4 === 0) M.pluck(t, d, notes[s / 4 % 4] + 12, sd * 1.5, 0.03, st.lead); }
        if (st.sparkle && s % 8 === 6) M.bell(t, d, notes[(bar + s) % 4] + 24, 0.035);
        if (s === 0) M.pad(t, d, chordNotes(root + 12, type), sd * 15.5, hi > 0.5 ? 0.03 : 0.018);
      },
    };
  }
}

// --- audio.js ---
// Звук генерируется кодом (WebAudio): ветер, монеты, прыжок, приземление, удар, гул лавины.

class Sfx {
  constructor() {
    this.ctx = null; this.muted = false; this.master = null;
    this.paused = false;
    this.music = new Music();
  }

  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended' && !this.paused) this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = (this.ctx = new AC());
    this.master = ctx.createGain(); this.master.gain.value = this.muted ? 0 : 0.8; this.master.connect(ctx.destination);
    // Шумовой буфер
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.noise = buf;
    this.wind = this._loopNoise('lowpass', 500, 0);
    this.rumble = this._loopNoise('lowpass', 120, 0);
    // Музыка идёт мимо общего звука эффектов: кнопка 🔊 выключает эффекты, 🎵 — музыку (раньше 🔊 глушила и музыку).
    this.musicGain = ctx.createGain(); this.musicGain.gain.value = 0.8; this.musicGain.connect(ctx.destination);
    this.music.attach(ctx, this.musicGain);
  }

  _loopNoise(type, freq, gain) {
    const ctx = this.ctx, src = ctx.createBufferSource(); src.buffer = this.noise; src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
    return { f, g };
  }

  setMuted(m) { this.muted = m; if (this.master) this.master.gain.value = m ? 0 : 0.8; }

  pause() { this.paused = true; if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); }
  resume() { this.paused = false; if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); }

  setWind(speed01, air) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.wind.g.gain.setTargetAtTime(0.05 + speed01 * 0.22, t, 0.1);
    this.wind.f.frequency.setTargetAtTime(300 + speed01 * 900 + (air ? 600 : 0), t, 0.1);
  }
  setRumble(level) { if (this.ctx) this.rumble.g.gain.setTargetAtTime(level * 0.9, this.ctx.currentTime, 0.2); }

  _tone(freq, dur, type = 'sine', vol = 0.2, slide = 0) {
    if (!this.ctx || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }
  _burst(dur, freq, vol) {
    if (!this.ctx || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime, src = ctx.createBufferSource(); src.buffer = this.noise;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t, Math.random()); src.stop(t + dur);
  }

  coin() { this._tone(1046, 0.12, 'square', 0.06); setTimeout(() => this._tone(1568, 0.16, 'square', 0.05), 60); }
  jump() { this._tone(260, 0.3, 'triangle', 0.12, 2.2); }
  land() { this._burst(0.18, 600, 0.35); }
  crash() { this._burst(0.6, 900, 0.7); this._tone(120, 0.5, 'sawtooth', 0.15, 0.4); }
  smash() { this._burst(0.3, 2000, 0.4); }
  trick() { this._tone(660, 0.1, 'triangle', 0.1); setTimeout(() => this._tone(990, 0.18, 'triangle', 0.1), 90); }
  warn() { this._tone(880, 0.12, 'square', 0.07); setTimeout(() => this._tone(660, 0.16, 'square', 0.07), 160); }
  boost() { this._burst(0.6, 2500, 0.45); this._tone(180, 0.7, 'sawtooth', 0.07, 3.5); }
  pop() { this._burst(0.1, 4000, 0.35); }
  count(go) { if (go) { this._tone(988, 0.45, 'square', 0.09); this._tone(1318, 0.45, 'triangle', 0.06); this._burst(0.3, 3000, 0.25); } else this._tone(660, 0.18, 'square', 0.08); }
  click() { this._tone(700, 0.05, 'square', 0.05); }
}

// --- meta.js ---
// Прогресс вне заезда: сохранение, монеты, подарок дня, задания, сундук. Без DOM — тестируется в Node.

const DAILY_REWARDS = [50, 75, 100, 150, 200, 250, 400];
const CHEST_COOLDOWN = 15 * 60 * 1000;     // сундук раз в 15 минут
const COINS_PER_METERS = 25;               // бонус: +1 монета за каждые 25 м

// type: что считаем; once — за один заезд (иначе копится); targets — варианты цели.
const MISSION_POOL = [
  { type: 'dist', once: true, targets: [300, 500, 800, 1200, 1800, 2500], reward: (t) => Math.round(t / 6 / 10) * 10 + 40 },
  { type: 'coins', targets: [40, 80, 150, 250], reward: (t) => Math.round(t * 0.8 / 10) * 10 + 30 },
  { type: 'flips', targets: [2, 4, 8, 12], reward: (t) => t * 20 + 40 },
  { type: 'snowmen', targets: [3, 6, 10], reward: (t) => t * 15 + 40 },
  { type: 'near', targets: [5, 10, 20], reward: (t) => t * 8 + 40 },
  { type: 'zone', once: true, targets: [1, 2], reward: (t) => t * 120 + 60 },
  { type: 'runs', targets: [3, 5, 8], reward: (t) => t * 15 + 30 },
  { type: 'dodges', targets: [2, 4, 7], reward: (t) => t * 25 + 40 },
  { type: 'powers', targets: [3, 6, 10], reward: (t) => t * 15 + 40 },
];

// ===== Экономика магазина =====
// usd — рекомендуемые цены для Play Console / Яндекса. Правило: наборы всегда выгоднее любых монет,
// а крупные пачки монет выгоднее мелких — тогда покупка «по частям» никогда не лучше набора.
const BOOST_PRICE = { boost: 60, shield: 80, magnet: 50, spring: 40 };
const ALL5 = { boost: 5, shield: 5, magnet: 5, spring: 5 }, ALL10 = { boost: 10, shield: 10, magnet: 10, spring: 10 };
const SHOP = {
  coins: [
    { id: 'coins_s', coins: 1000, bonus: 0, usd: 0.99 },
    { id: 'coins_m', coins: 3000, bonus: 600, usd: 2.49, tag: 'popular' },
    { id: 'coins_l', coins: 8000, bonus: 4000, usd: 5.99, tag: 'bestValue' },
  ],
  packs: [
    { id: 'pack_starter', usd: 0.99, rides: ['board', 'tub'], coins: 2000, inv: ALL5, theme: 'starter' },
    { id: 'pack_party', usd: 2.99, rides: ['cart', 'sofa'], coins: 1500, inv: {}, theme: 'party' },
    { id: 'pack_speed', usd: 3.99, rides: ['skis', 'rocket'], coins: 2500, inv: {}, theme: 'speed' },
    { id: 'pack_all', usd: 9.99, rides: ['sled', 'board', 'tub', 'skis', 'cart', 'sofa', 'rocket'], coins: 10000, inv: ALL10, theme: 'all' },
  ],
  boxes: [
    { id: 'bx_mega', inv: ALL5, price: 760, mega: true },
    { id: 'bx_shield', inv: { shield: 5 }, price: 320 },
    { id: 'bx_boost', inv: { boost: 5 }, price: 240 },
    { id: 'bx_magnet', inv: { magnet: 5 }, price: 200 },
    { id: 'bx_spring', inv: { spring: 5 }, price: 160 },
  ],
  dealOff: 0.3, adCoins: 100, adPerDay: 5,
  get ids() { return this.coins.map((c) => c.id).concat(this.packs.map((p) => p.id)); },
  find(id) { return this.coins.find((c) => c.id === id) || this.packs.find((p) => p.id === id) || null; },
  isPack(id) { return this.packs.some((p) => p.id === id); },
  // Лучший курс монет за $ среди пачек — от него считаются честные скидки наборов.
  bestRate() { return Math.max(...this.coins.map((c) => (c.coins + c.bonus) / c.usd)); },
  invValue(inv) { let v = 0; for (const k in inv || {}) v += (BOOST_PRICE[k] || 0) * inv[k]; return v; },
  // Ценность набора в монетах (транспорт, которого ещё нет, + монеты + бусты).
  packValue(pk, owned = []) { return pk.coins + this.invValue(pk.inv) + pk.rides.filter((r) => !owned.includes(r)).reduce((a, r) => a + RIDES[r].price, 0); },
  packOff(pk, owned = []) { return Math.max(0, Math.round((1 - pk.usd / (this.packValue(pk, owned) / this.bestRate())) * 100)); },
  boxOff(bx) { return Math.max(0, Math.round((1 - bx.price / this.invValue(bx.inv)) * 100)); },
  // Акция дня: транспорт, которого нет, со скидкой 30 % (меняется в полночь UTC).
  deal(save, dayKey) {
    const ids = Object.keys(RIDES).filter((id) => RIDES[id].price > 0 && !save.owned.includes(id));
    if (!ids.length) return null;
    let h = 0; for (const ch of dayKey) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    const id = ids[h % ids.length], full = RIDES[id].price;
    return { id, full, price: Math.round(full * (1 - this.dealOff) / 50) * 50 };
  },
};

const Meta = {
  defaults() {
    return {
      best: 0, coins: 0, muted: false, musicOff: false,
      ride: 'tube', owned: ['tube'], up: { speed: 0, handling: 0, armor: 0 },
      daily: { last: '', streak: 0 },
      missions: [], missionSeq: 0, chestAt: 0,
      runs: 0,
      levels: {}, story: [], ended: false, race: { easy: 0, medium: 0, hard: 0 },
      nick: '', dstreak: { last: '', streak: 0, bestStreak: 0 }, dbest: { key: '', r: null }, crew: null, crewBlocked: [], clipHint: false,
      inv: { boost: 0, shield: 0, magnet: 0, spring: 0 }, bought: [], friends: [], dealDay: '', adCoins: { day: '', n: 0 },
    };
  },

  normalize(save) {
    const d = this.defaults(), s = Object.assign(d, save || {});
    s.up = Object.assign(this.defaults().up, s.up || {});
    s.daily = Object.assign(this.defaults().daily, s.daily || {});
    s.inv = Object.assign(this.defaults().inv, s.inv || {});
    if (!Array.isArray(s.bought)) s.bought = [];
    if (!Array.isArray(s.friends)) s.friends = [];
    if (!s.adCoins || typeof s.adCoins !== 'object') s.adCoins = { day: '', n: 0 };
    if (!Array.isArray(s.owned) || !s.owned.includes('tube')) s.owned = ['tube'].concat(Array.isArray(s.owned) ? s.owned : []);
    s.owned = s.owned.filter((id) => RIDES[id]);
    if (!s.owned.includes(s.ride)) s.ride = 'tube';
    if (!Array.isArray(s.missions)) s.missions = [];
    if (!s.levels || typeof s.levels !== 'object' || Array.isArray(s.levels)) s.levels = {};
    if (!Array.isArray(s.story)) s.story = [];
    s.race = Object.assign({ easy: 0, medium: 0, hard: 0 }, s.race || {});
    // Раньше улучшения были общими: переносим их на каждый купленный транспорт.
    if (!s.ups || typeof s.ups !== 'object') { s.ups = {}; for (const id of s.owned) s.ups[id] = Object.assign({}, s.up); }
    s.up = this.upOf(s, s.ride);
    s.dstreak = Object.assign(this.defaults().dstreak, s.dstreak || {});
    s.dbest = Object.assign(this.defaults().dbest, s.dbest || {});
    if (!Array.isArray(s.crewBlocked)) s.crewBlocked = [];
    this.fillMissions(s);
    return s;
  },

  dayKey(t) { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; },

  // --- Подарок дня ---
  dailyStatus(save, now) {
    const today = this.dayKey(now);
    if (save.daily.last === today) return { available: false };
    const yesterday = this.dayKey(now - 864e5);
    const day = save.daily.last === yesterday ? (save.daily.streak % DAILY_REWARDS.length) + 1 : 1;
    return { available: true, day, reward: DAILY_REWARDS[day - 1] };
  },
  claimDaily(save, now, mult = 1) {
    const st = this.dailyStatus(save, now);
    if (!st.available) return 0;
    save.daily = { last: this.dayKey(now), streak: st.day };
    const amount = st.reward * mult;
    save.coins += amount;
    return amount;
  },

  // --- Сундук ---
  chestLeft(save, now) { return Math.max(0, (save.chestAt || 0) + CHEST_COOLDOWN - now); },
  openChest(save, now, rnd = Math.random()) {
    if (this.chestLeft(save, now) > 0) return 0;
    const amount = 60 + Math.round(rnd * 9) * 10;     // 60–150
    save.chestAt = now; save.coins += amount;
    return amount;
  },

  // --- Монеты за заезд ---
  runCoins(picked, dist) { return picked + Math.floor(dist / COINS_PER_METERS); },

  // --- Магазин ---
  buyRide(save, id) {
    const r = RIDES[id];
    if (!r || save.owned.includes(id) || save.coins < r.price) return false;
    save.coins -= r.price; save.owned.push(id); save.ride = id; save.ups = save.ups || {}; save.ups[id] = save.ups[id] || { speed: 0, handling: 0, armor: 0 }; save.up = save.ups[id];
    return true;
  },
  // Покупка за реальные деньги: монеты — всегда; набор — один раз (повторная выдача ничего не даёт).
  creditProduct(save, id) {
    const c = SHOP.coins.find((x) => x.id === id);
    if (c) { save.coins += c.coins + c.bonus; return { coins: c.coins + c.bonus, rides: [] }; }
    const pk = SHOP.packs.find((x) => x.id === id);
    if (!pk || save.bought.includes(id)) return null;
    save.bought.push(id); save.coins += pk.coins;
    for (const k in pk.inv) save.inv[k] = (save.inv[k] || 0) + pk.inv[k];
    const rides = pk.rides.filter((r) => this.grantRide(save, r));
    return { coins: pk.coins, rides };
  },
  buyBox(save, id) {
    const bx = SHOP.boxes.find((x) => x.id === id);
    if (!bx || save.coins < bx.price) return false;
    save.coins -= bx.price; for (const k in bx.inv) save.inv[k] = (save.inv[k] || 0) + bx.inv[k];
    return true;
  },
  buyDeal(save, dayKey) {
    const d = SHOP.deal(save, dayKey);
    if (!d || save.coins < d.price) return false;
    save.coins -= d.price; this.grantRide(save, d.id); save.ride = d.id; save.up = this.upOf(save, d.id);
    return true;
  },
  // Монеты за видео: не больше SHOP.adPerDay в день.
  adCoinsLeft(save, dayKey) { return save.adCoins.day === dayKey ? Math.max(0, SHOP.adPerDay - save.adCoins.n) : SHOP.adPerDay; },
  takeAdCoins(save, dayKey) {
    if (!this.adCoinsLeft(save, dayKey)) return 0;
    if (save.adCoins.day !== dayKey) save.adCoins = { day: dayKey, n: 0 };
    save.adCoins.n++; save.coins += SHOP.adCoins; return SHOP.adCoins;
  },
  // Выдать транспорт без оплаты (наборы, акции).
  grantRide(save, id) {
    if (!RIDES[id] || save.owned.includes(id)) return false;
    save.owned.push(id); save.ups = save.ups || {}; save.ups[id] = save.ups[id] || { speed: 0, handling: 0, armor: 0 };
    return true;
  },
  // Улучшения у каждого транспорта свои и только у купленного.
  upOf(save, id) { return (save.ups && save.ups[id]) || { speed: 0, handling: 0, armor: 0 }; },
  buyUpgrade(save, key, id = save.ride) {
    if (!save.owned.includes(id)) return false;
    const up = (save.ups[id] = Object.assign({ speed: 0, handling: 0, armor: 0 }, save.ups[id] || {}));
    const lvl = up[key] || 0;
    if (lvl >= UPGRADES[key].max) return false;
    const cost = upgradeCost(key, lvl);
    if (save.coins < cost) return false;
    save.coins -= cost; up[key] = lvl + 1;
    if (id === save.ride) save.up = up;
    return true;
  },

  // --- Задания ---
  fillMissions(save, rnd = Math.random) {
    while (save.missions.length < 3) {
      const taken = new Set(save.missions.map((m) => m.type));
      const pool = MISSION_POOL.filter((p) => !taken.has(p.type));
      const p = pool[Math.floor(rnd() * pool.length)];
      // Цель растёт с опытом: чем больше заездов, тем дальше по списку.
      const tier = Math.min(p.targets.length - 1, Math.floor(rnd() * 2) + Math.floor((save.runs || 0) / 12));
      const target = p.targets[tier];
      save.missions.push({ id: ++save.missionSeq, type: p.type, target, prog: 0, reward: p.reward(target), done: false });
    }
  },

  // stats: для накопительных заданий — прирост с прошлого вызова, для «за заезд» — итог заезда.
  // newRun = false, если это продолжение того же заезда (после «Продолжить за видео»).
  applyRun(save, stats, newRun = true) {
    if (newRun) save.runs = (save.runs || 0) + 1;
    const fresh = [];
    for (const m of save.missions) {
      if (m.done) continue;
      const p = MISSION_POOL.find((q) => q.type === m.type);
      const v = m.type === 'coins' ? stats.picked : m.type === 'runs' ? (newRun ? 1 : 0) : (stats[m.type] || 0);
      m.prog = p.once ? Math.max(m.prog, v) : m.prog + v;
      if (m.prog >= m.target) { m.prog = m.target; m.done = true; fresh.push(m); }
    }
    return fresh;
  },

  claimMission(save, id) {
    const i = save.missions.findIndex((m) => m.id === id && m.done);
    if (i < 0) return 0;
    const m = save.missions[i];
    save.coins += m.reward;
    save.missions.splice(i, 1);
    this.fillMissions(save);
    return m.reward;
  },

  readyMissions(save) { return save.missions.filter((m) => m.done).length; },
};

// Звёзды: ⭐ доехал, ⭐ собрал монеты, ⭐ выполнил задание уровня. Без DOM — тестируется в Node.
