      $('hudDist').textContent = `${d} / ${len} ${T('m')}`;
      $('lvlFill').style.width = `${clamp(player.s / len, 0, 1) * 100}%`;
      const html = `<div class="g">⏱ ${fmtSec(runTime)}</div>${ghostChip()}`;
      if (html !== goalsHtml) { goalsHtml = html; $('goals').innerHTML = html; }
    } else $('hudDist').textContent = `${Math.floor(player.s)} ${T('m')}`;
    $('hudScore').textContent = `${score()}`;
    $('hudCoins').textContent = `${coinsRun}`;
    $('hudShieldN').textContent = player.hits;
    $('hudShield').classList.toggle('on', player.hits > 0);
    const gap = Math.max(0, player.s - aval.s);
    $('avGap').textContent = `${Math.floor(gap)} ${T('m')}`;
    $('avFill').style.width = `${clamp(100 - gap / 110 * 100, 0, 100)}%`;
    $('danger').style.opacity = clamp((32 - gap) / 32, 0, 0.85).toFixed(2);
  }

  let goalsHtml = '';
  // Отрыв от призрака в метрах.
  function ghostChip() {
    if (!ghostRun) return '';
    const gap = Math.round(player.s - ghostRider.s);
    return `<div class="g ghostc">👻 ${gap >= 0 ? '+' : '−'}${Math.abs(gap)} ${T('m')}</div>`;
  }
  const score = () => Math.floor(player.s) + trickPts;

  // Значки активных бонусов с полосой оставшегося времени.
  let powersKey = '';
  function updatePowers() {
    const act = Object.keys(player.power).filter((k) => player.power[k] > 0);
    const key = act.join(',');
    if (key !== powersKey) {
      powersKey = key;
      $('powers').innerHTML = act.map((k) => `<div class="pw pw-${k}" id="pw_${k}"><i>${POWER_SVG[k]}</i></div>`).join('');
      for (const k of act) powerMax[k] = Math.max(POWER_TIME[k], player.power[k]);
    }
    for (const k of act) {
      const el = $('pw_' + k); if (!el) continue;
      const left = player.power[k], p = clamp(left / (powerMax[k] || POWER_TIME[k]), 0, 1);
      el.style.setProperty('--p', p.toFixed(3));
      el.classList.toggle('low', left < 1.5);
    }
  }

  // --- Мир и заезд ---
  // lv — уровень (фиксированная трасса, зона и финиш); без него — бесконечный мир.
  // Для фона меню берём зону текущей горы.
  function newWorld(lv = null, menu = false) {
    if (world) world.dispose();
    if (lv) world = new World(renderer, lv.seed, { zone: lv.zone, diff: lv.diff, finish: lv.len });
    else if (menu) world = new World(renderer, (Math.random() * 1e9) | 0, { zone: MOUNTAINS[Levels.info(Levels.current(save)).m].zone });
    else world = new World(renderer, (Math.random() * 1e9) | 0);
    player.vBonus = lv ? lv.vBonus : 0;
    player.reset(world.center(0));
    player.y = world.height(player.x, player.s);
    world.update(player.s);
    aval.setIntensity(lv ? lv.intensity : 0.15); aval.reset();
    cam.x = player.x; cam.y = player.y + 4.3;
  }

  // Заезд: lvId — номер уровня, null — бесконечный режим.
  // opts.daily — дата Трассы дня ('YYYY-MM-DD'); opts.ghost — призрак из ссылки-вызова.
  function startRun(lvId = null, raceKey = null, opts = {}) {
    sfx.unlock(); sfx.click(); input.clearActions();
    const rideId = tryRide || save.ride, trial = !!tryRide;
    tryRide = null;
    fadeThrough(() => {
      level = lvId === null || lvId === undefined ? null : Levels.info(lvId);
      team = null;
      race = raceKey === 'online' ? { key: 'online', online: true, side: opts.online.side, oid: opts.online.opp.oid, cfg: { name: opts.online.opp.nick, reward: 150, boulders: false, world: 0.42 } }
        : raceKey ? { key: raceKey, cfg: RACE.diff[raceKey] } : null;
      daily = opts.daily ? { key: opts.daily, lv: Daily.level(opts.daily) } : null;
      player.setRide(rideId, Meta.upOf(save, rideId));
      // На Трассе дня и уровнях лавина и камни тоже «по зерну» — у всех одинаково, гонка с призраком честная.
      const fixed = daily ? daily.lv : level;
      aval.rnd = fixed ? makeRng(fixed.seed ^ 0x5bd1e995) : Math.random;
      boulders.rnd = fixed ? makeRng(fixed.seed ^ 0x2545f491) : Math.random;
      if (race) {
        // Трасса гонки: случайная гора, финиш на RACE.len; игрок левее, соперник правее центра.
        const on = race.online ? opts.online : null;
        const zone = on ? on.zone : RACE_ZONES[Math.floor(Math.random() * RACE_ZONES.length)];
        if (on) { aval.rnd = makeRng(on.seed ^ 0x5bd1e995); }
        newWorld({ seed: on ? on.seed : (Math.random() * 1e9) | 0, zone, diff: race.cfg.world, len: RACE.len, vBonus: 0, intensity: 0.1 });
        // Онлайн: хозяин комнаты слева, гость справа (у обоих одинаково); с ботом — игрок слева.
        const side = on ? on.side : -1;
        player.x = world.center(player.s) + side * RACE.laneOffset; player.y = world.height(player.x, player.s); cam.x = player.x;
        if (on) { rival = remote; remote.ride = RIDES[on.opp.ride] ? on.opp.ride : 'sled'; remote.reset(world, -side); }
        else { rival = botRival; rival.reset(world, raceKey, rideId); }
        rivalBody.setRide(rival.ride, {});
        rival.syncBody(0);
        $('btnPause').style.display = on ? 'none' : '';
        // Лавина в гонке настоящая: держится сзади, делает рывки и догоняет отстающего (и игрока, и бота).
        raceAvBase = { easy: 0.22, medium: 0.4, hard: 0.58 }[raceKey] ?? 0.4;
        aval.surges = true; aval.setIntensity(raceAvBase); aval.reset();
      } else if (opts.team) teamSetup(opts.team, rideId);
      else { newWorld(daily ? daily.lv : level); aval.surges = true; $('btnPause').style.display = ''; }
      // Призрак: из ссылки-вызова, иначе свой лучший заезд по этой трассе.
      let gr = opts.ghost ? { run: opts.ghost, own: false } : null;
      if (!gr && daily && ghosts.daily && ghosts.daily.key === daily.key) { const g = ownGhost(ghosts.daily); if (g) gr = { run: g, own: true }; }
      if (!gr && level) { const g = ownGhost(ghosts.lv && ghosts.lv[level.id]); if (g) gr = { run: g, own: true }; }
      ghostRun = gr;
      if (gr) ghostRider.start(gr.run); else ghostRider.stop();
      recorder = daily || level ? new GhostRecorder() : null;
      if (daily && daily.key === Daily.key()) { save.dstreak = Daily.play(save.dstreak, daily.key); persist(); }
      runTime = 0; trickPts = 0; coinsRun = 0; continued = false; goalsHtml = '';
      run = { ride: rideId, trial, flips: 0, snowmen: 0, near: 0, dodges: 0, powers: 0, zoneLevel: 0, zone: world.zoneAt(0),
        banked: { picked: 0, flips: 0, snowmen: 0, near: 0, dodges: 0, powers: 0 }, earned: 0, counted: false, doubled: false };
      boulders.reset();
      boulders.enabled = team ? false : race ? race.cfg.boulders : daily ? daily.lv.boulders : (!level || level.boulders);
      boulders.stopAt = race ? RACE.len - 160 : level ? level.len - 160 : daily ? daily.lv.len - 160 : Infinity;
      const track = level || race || daily || team;
      $('hudLvl').style.display = track ? 'block' : 'none';
      $('lvlTrack').style.display = track ? 'block' : 'none';
      $('goals').style.display = track ? 'flex' : 'none';
      $('hudScore').style.display = track ? 'none' : 'block';
      $('rivalDot').style.display = race ? 'block' : 'none';
      if (level) $('hudLvl').textContent = T('levelN', { n: level.id + 1 });
      if (race) $('hudLvl').textContent = T('raceLbl', { d: T(race.key) });
      if (daily) $('hudLvl').textContent = T('dailyOf', { d: fmtDay(daily.key) });
      if (team) $('hudLvl').textContent = `🪢 ${T('ropeTeam')}`;
      show(null);
      const dm = daily && MOUNTAINS.find((m) => m.zone === daily.lv.zone);
      sfx.music.play(race || team ? 'race' : level ? MOUNTAINS[level.m].id : dm ? dm.id : 'endless');
      // 5 секунд на бусты перед стартом (кроме самого первого заезда новичка).
      if ((save.runs > 0 || !level || level.id > 0) && !window.__noPrep) openPrep(); else goRun();   // __noPrep — для автотестов
      if (trial) popup(T('trying', { r: rideName(rideId) }), 'zone');
      else if (level) popup(T('levelN', { n: level.id + 1 }), 'zone');
      else if (daily) popup(ghostRun && !ghostRun.own ? `👻 ${ghostRun.run.nick}` : T('dailyRun'), 'zone');
    });
  }
  const fmtDay = (key) => new Date(key + 'T12:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const startDaily = (key = Daily.key(), ghost = null) => startRun(null, null, { daily: key, ghost });
  // Старт после выбора бустов: гонка — отсчёт 3-2-1, остальное — сразу.
  function goRun() {
    $('prep').classList.remove('on');
    applyBoosts();
    if (race || team) { state = 'countdown'; countT = 3; showCount('3'); sfx.count(false); }
    else { state = 'play'; runTime = 0; Platform.gameplayStart(); }
  }
  const startEndless = () => startRun(null);
  const startRace = (key) => startRun(null, key);

  function showCount(txt) {
    const el = $('count');
    el.textContent = txt; el.classList.toggle('go', txt === T('goGo'));
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  }

  // --- Гонка: выбор сложности ---
  const RIDE_ICON = { tube: '🛟', sled: '🛷', board: '🏂', tub: '🛁', skis: '🎿', cart: '🛒', sofa: '🛋️', rocket: '🚀' };
  function openRace() {
    sfx.unlock(); sfx.click();
    const list = $('raceList'); list.innerHTML = '';
    DIFF_KEYS.forEach((k, i) => {
      const c = RACE.diff[k], ride = c.rides.find((r) => r !== save.ride) || c.rides[0];
      const b = document.createElement('button');
      b.className = 'ropt'; b.style.animationDelay = `${i * 0.07}s`;
      b.innerHTML = `<i class="pm ${k}"></i><b></b><span class="rw"><span class="cbal"><i></i>+${c.reward}</span><small></small></span><small class="who"></small>`;
      b.querySelector('b').textContent = T(k);
      b.querySelector('.who').textContent = `${T('vs')} ${c.name} · ${RIDE_ICON[ride]} ${rideName(ride)}`;
      b.querySelector('.rw small').textContent = T('winsN', { n: save.race[k] || 0 });
      b.dataset.diff = k;
      b.onclick = () => startRace(k);
      list.appendChild(b);
    });
    $('onlineRow').style.display = crew.enabled ? '' : 'none';
    $('orBot').textContent = crew.enabled ? T('orBot') : '';
    toMenuThen(() => show('raceScr'));
  }
  $('btnRace').onclick = openRace;
  $('raceBack').onclick = () => { sfx.click(); show('modesScr'); };

  // Обгоны и финиш соперника — короткие подсказки.
  function raceEvents() {
    const ahead = player.s > rival.s, name = race.cfg.name;
    if (race.ahead !== undefined && ahead !== race.ahead && !rival.finished && Math.abs(player.s - rival.s) < 10) {
      if (ahead) { trickPts += 100; popup(`${T('overtake')} +100`, 'trick'); sfx.trick(); }
      else popup(T('overtaken', { name }), 'near');
    }
    race.ahead = ahead;
    if (rival.finished && !race.rivalDone) { race.rivalDone = true; popup(T('rivalFinished', { name }), 'near'); }
  }

  function finishRace() {
    state = 'finish'; finishT = 0;
    aval.stop(); boulders.enabled = false;
    $('powers').innerHTML = ''; powersKey = '';
    Platform.gameplayStop();
    if (race.online && online) online.sendFin(runTime);
    const win = race.online ? (!rival.finished || runTime <= rival.finishT) : !rival.finished;
    if (win) { sfx.trick(); sfx.coin(); for (let i = 0; i < 4; i++) emit(player.x + (i - 1.5) * 4, player.y + 5, -(player.s + 3), 20, 9, 6); }
    popup(T('finish'), 'zone');
    bankRun();
    const first = win && !save.race[race.key];
    const reward = win ? race.cfg.reward * (first ? 2 : 1) : 0;
    if (win) save.race[race.key] = (save.race[race.key] || 0) + 1;
    save.coins += reward;
    persist();
    race.result = { win, first, reward, time: runTime, rivalTime: rival.finished ? rival.finishT : null };
  }

  const fmtSec = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(1).padStart(4, '0')}`;
  function showRaceEnd() {
    state = 'won';
    const r = race.result, c = race.cfg;
    sfx.music.play(r.win ? 'win' : 'lose', 'menu');
    $('rePlace').textContent = r.win ? T('place1') : T('place2');
    $('rePlace').className = 'rplace' + (r.win ? '' : ' second');
    $('reTitle').textContent = r.win ? T('youWin') : T('youLose', { name: c.name });
    $('reSub').textContent = `${T('raceLbl', { d: T(race.key) })} · ${T('vs')} ${c.name}`;
    $('reYou').textContent = fmtSec(r.time);
    $('reRival').textContent = r.rivalTime !== null ? fmtSec(r.rivalTime) : '—';
    $('reRivalName').textContent = c.name;
    $('reCoins').textContent = `+${run.earned + r.reward}`;
    lastResult = { finished: r.win, time: r.time, dist: RACE.len, sub: `Race · ${T(race.key)} · vs ${c.name}`, race: r.win ? 'won' : 'lost' };
    $('reOnline').classList.toggle('on', !!race.online);
    $('reDiff').textContent = race.online ? T('leave') : T('difficulty');
    $('reAgain').disabled = false; $('reAgain').textContent = race.online && party ? T('toLobby') : T('rematch');
    $('reFriend').style.display = race.online && hub && !save.friends.some((f) => f.oid === race.oid) ? '' : 'none';
    $('reNote').textContent = r.first ? `🏆 ${T('firstWin')} +${c.reward}` : r.win ? `🏁 +${r.reward} ${T('winReward')}` : '';
    show('raceEnd');
  }
  $('reAgain').onclick = async () => {
    sfx.click();
    if (race && race.online && party && online === party) { party.backToLobby(); backToLobby(); return; }
    if (race && race.online) {
      if (!online || !online.opp) { toast(T('oppLeft', { name: race.cfg.name })); return; }
      online.rematch(); $('reAgain').disabled = true; $('reAgain').textContent = T('waitingRematch', { name: race.cfg.name }); return;
    }
    await Platform.showInterstitial(runTime); startRace(race.key);
  };
  $('reDiff').onclick = async () => { if (race && race.online && party) { backToLobby(); return; } if (race && race.online) { leaveOnline(); openRace(); return; } await Platform.showInterstitial(runTime); openRace(); };
  $('reMenu').onclick = async () => { if (race && race.online && party) { backToLobby(); return; } if (race && race.online) { leaveOnline(); toMenu(); return; } await Platform.showInterstitial(runTime); toMenu(); };


  // Уровень: перед первым уровнем горы — короткая история.
  function playLevel(id) {
    if (!Levels.unlocked(save, id)) return;
    const m = Math.floor(id / LEVELS_PER);
    if (!save.story.includes(m)) {
      showStory(m, () => { save.story.push(m); persist(); startRun(id); });
    } else startRun(id);
  }

  let storyNext = null;
  function showStory(m, next) {
    storyNext = next;
    if (m === 'end') {
      $('stIcon').textContent = '🎉'; $('stMtn').textContent = '';
      $('stTitle').textContent = T('story_end_t'); $('stText').textContent = T('story_end');
    } else if (m === 0) {
      $('stIcon').textContent = '🏔️'; $('stMtn').textContent = T('mtn_forest');
      $('stTitle').textContent = T('story_intro_t'); $('stText').textContent = T('story_intro');
    } else {
      $('stIcon').textContent = MTN_ICON[m]; $('stMtn').textContent = `${m + 1} / ${MOUNTAINS.length}`;
      $('stTitle').textContent = T('mtn_' + MOUNTAINS[m].id); $('stText').textContent = T('mtnd_' + MOUNTAINS[m].id);
    }
    $('story').querySelector('.card').style.setProperty('--band', m === 'end' ? 'var(--gold)' : MTN_COL[m]);
    show('story');
  }
  $('stGo').onclick = () => { sfx.unlock(); sfx.click(); const n = storyNext; storyNext = null; if (n) n(); else show('menu'); };

  // Финиш уровня: лавина замирает, игрок тормозит, через миг — экран победы.
  function finishLevel() {
    state = 'finish'; finishT = 0;
    aval.stop(); boulders.enabled = false;
    $('powers').innerHTML = ''; powersKey = '';
    Platform.gameplayStop();
    sfx.trick(); sfx.coin();
    popup(T('finish'), 'zone');
    for (let i = 0; i < 4; i++) emit(player.x + (i - 1.5) * 4, player.y + 5, -(player.s + 3), 20, 9, 6);
    bankRun();
    const res = { finished: true, coins: coinsRun, flips: run.flips, snowmen: run.snowmen, near: run.near, powers: run.powers, dodges: run.dodges };
    const rec = Levels.record(save, level, res);
    const firstEnd = level.id === LEVEL_COUNT - 1 && !save.ended;
    if (firstEnd) save.ended = true;
    persist();
    lastWin = { info: level, res, rec, firstEnd, time: runTime, ghostCmp: ghostCompare(true) };
    keepGhost('lv', level.id);
    lastResult = { finished: true, time: runTime, dist: level.len, sub: `Level ${level.id + 1} · ${T('mtn_' + MOUNTAINS[level.m].id)}`, ghost: null };
  }

  // Конфетти: цветные бумажки сыплются сверху карточки.
  function confetti(box, n) {
    const cols = ['#ff6a2b', '#ffc23a', '#3aa6ea', '#1f9d63', '#ff5fa2', '#ffffff'];
    let h = '';
    for (let i = 0; i < n; i++) {
      h += `<i style="left:${Math.random() * 100}%;background:${cols[i % cols.length]};--d:${(1.8 + Math.random() * 1.6).toFixed(2)}s;--dl:${(0.2 + Math.random() * 0.9).toFixed(2)}s;--dx:${Math.round(Math.random() * 120 - 60)}px;--r:${Math.round(Math.random() * 900 - 450)}deg;${i % 3 ? '' : 'border-radius:50%;width:9px;height:9px;'}"></i>`;
    }
    box.innerHTML = h;
  }
  // Награда «набегает» от нуля.
  function countUp(el, total) {
    const span = el.querySelector('.cbal span'), t0 = performance.now() + 700, dur = 900;
    const step = (now) => {
      if (screen !== 'win') { span.textContent = '+' + total; return; }
      const k = Math.max(0, Math.min(1, (now - t0) / dur));
      span.textContent = '+' + Math.round(total * (1 - (1 - k) ** 3));
      if (k < 1) requestAnimationFrame(step); else { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
    };
    requestAnimationFrame(step);
  }
  function showWin() {
    state = 'won';
    sfx.music.play('win', 'menu');
    const { info, res, rec } = lastWin;
    $('winLvl').innerHTML = '<b></b>';
    $('winLvl').append(`${T('levelN', { n: info.id + 1 })} · ${T('mtn_' + MOUNTAINS[info.m].id)}`);
    $('winLvl').style.setProperty('--mt', MTN_COL[info.m]);
    confetti($('winConf'), rec.mask === 7 ? 46 : 28);
    showGhostLine($('winGhost'), lastWin.ghostCmp);
    const stars = $('winStars').children;
    for (let i = 0; i < 3; i++) stars[i].className = '';
    const bits = [1, 2, 4];
    bits.forEach((b, i) => {
      if (!(rec.mask & b)) return;
      setTimeout(() => { if (screen === 'win') { stars[i].className = 'on'; i === 2 ? sfx.trick() : sfx.coin(); } }, 450 + i * 380);
    });
    const tv = res[info.task.type] || 0;
    const rows = [
      [true, T('goal_finish')],
      [res.coins >= info.coinGoal, `${T('goal_coins', { n: info.coinGoal })} (${Math.min(res.coins, info.coinGoal)}/${info.coinGoal})`],
      [tv >= info.task.target, `${T('task_' + info.task.type, { n: info.task.target })} (${Math.min(tv, info.task.target)}/${info.task.target})`],
    ];
    // Иконка, текст цели, счётчик и полоска прогресса за строкой.
    const prog = [[1, 1], [res.coins, info.coinGoal], [tv, info.task.target]];
    const icons = ['🏁', '🪙', TASK_ICON[info.task.type] || '🎯'];
    rows[1][1] = T('goal_coins', { n: info.coinGoal }); rows[2][1] = T('task_' + info.task.type, { n: info.task.target });
    $('winGoals').innerHTML = rows.map(([ok], i) => {
      const [v, g] = prog[i], pc = Math.min(100, Math.round(v / g * 100));
      return `<div class="${ok ? 'ok' : ''}" style="animation-delay:${0.25 + i * 0.12}s;--p:${pc}%"><b class="gi">${icons[i]}</b><span></span>${i ? `<em>${Math.min(v, g)}/${g}</em>` : ''}<i class="ck">✓</i></div>`;
    }).join('');
    [...$('winGoals').children].forEach((d, i) => { d.querySelector('span').textContent = rows[i][1]; });
    const total = run.earned + rec.reward;
    $('winReward').innerHTML = `<span class="cbal"><i></i><span>+0</span></span>`;
    countUp($('winReward'), total);
    const last = info.id === LEVEL_COUNT - 1;
    $('winNext').style.display = 'flex';
    $('winNext').textContent = last ? T('next') : `${T('next')} → ${info.id + 2}`;
    show('win');
  }

  async function winAction(kind) {
    sfx.click();
    await Platform.showInterstitial(runTime);
    const info = lastWin.info;
    if (kind === 'retry') return startRun(info.id);
    if (kind === 'map') return openMap();
    if (lastWin.firstEnd || info.id === LEVEL_COUNT - 1) { lastWin.firstEnd = false; return toMenuThen(() => showStory('end', () => show('menu'))); }
    const next = info.id + 1;
    if (Levels.unlocked(save, next)) return playLevel(next);
    openMap();
    toast(T('needStars', { n: MOUNTAINS[Math.floor(next / LEVELS_PER)].gate }));
  }
  $('winNext').onclick = () => winAction('next');
  $('winRetry').onclick = () => winAction('retry');
  $('winMap').onclick = () => winAction('map');

  // --- Карта гор ---
  // Узлы змейкой: верхний ряд слева направо, нижний — справа налево; лыжня через все.
  const TRAIL_PTS = [[11, 26], [37, 26], [63, 26], [89, 26], [89, 74], [63, 74], [37, 74], [11, 74]];
  const TRAIL_D = 'M11,26 L89,26 C104,26 104,74 89,74 L11,74';
  // Пейзаж за лыжнёй: небо, два хребта со снежными шапками, сугроб и детали горы.
  const SCENES = [
    { sky: ['#bfe3ff', '#f2faff'], far: '#a7c7e6', near: '#6f9fcf', ground: '#ffffff' },
    { sky: ['#d3dde8', '#f5f8fb'], far: '#b2bcc8', near: '#7e8b99', ground: '#f4f6f9' },
    { sky: ['#b8ecff', '#effbff'], far: '#93d3f3', near: '#4da7dd', ground: '#eefaff' },
    { sky: ['#ffd1ad', '#fff4e8'], far: '#e9b18f', near: '#bf8466', ground: '#fffaf4' },
    { sky: ['#1f2463', '#4b4a9c'], far: '#3d3f8c', near: '#2c2d6e', ground: '#e6e9ff' },
  ];
  const pine = (x, y, s, c = '#1f7a52') => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-1.2" y="-2" width="2.4" height="4" fill="#6b4a2f"/><polygon points="-7,-2 7,-2 0,-12" fill="${c}"/><polygon points="-5.5,-8 5.5,-8 0,-17" fill="${c}"/><polygon points="-4,-13 4,-13 0,-21" fill="#fff" opacity=".85"/></g>`;
  function mtnScene(m) {
    const S = SCENES[m], id = 'sk' + m;
    const range = (pts, col) => {
      const p = pts.map(([x, y]) => `${x},${y}`).join(' ');
      // снежные шапки на вершинах
      const caps = pts.slice(1, -1).filter(([, y], i, a) => y < 60).map(([x, y]) => `<polygon points="${x - 9},${y + 11} ${x},${y} ${x + 9},${y + 11} ${x + 4},${y + 8} ${x},${y + 12} ${x - 4},${y + 8}" fill="#fff"/>`).join('');
      return `<polygon points="${p}" fill="${col}"/>${caps}`;
    };
    let extra = '';
    if (m === 0) extra = pine(12, 132, 1.1) + pine(24, 136, .8) + pine(196, 133, 1.2) + pine(206, 138, .8) + pine(104, 139, .6);
    if (m === 1) extra = '<path d="M6,138 l8,-12 l10,4 l6,8z M184,139 l9,-15 l12,5 l6,10z" fill="#8d97a3" stroke="#12305a" stroke-width="1"/>' + pine(200, 120, .7, '#2f6b55');
    if (m === 2) extra = [[14, 128], [198, 124], [108, 136]].map(([x, y]) => `<g transform="translate(${x},${y})" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M-6,0h12M0,-6v12M-4,-4l8,8M4,-4l-8,8"/></g>`).join('');
    if (m === 3) extra = [[8, 138, '#d35400'], [196, 136, '#2f80ed']].map(([x, y, c]) => `<g transform="translate(${x},${y})"><rect x="0" y="-10" width="14" height="10" fill="#fff3e3" stroke="#12305a" stroke-width="1"/><polygon points="-2,-10 7,-18 16,-10" fill="${c}" stroke="#12305a" stroke-width="1"/><rect x="4" y="-7" width="4" height="4" fill="#ffc23a"/></g>`).join('') + pine(28, 138, .7);
    if (m === 4) extra = '<circle cx="186" cy="22" r="9" fill="#fff7d6"/><circle cx="190" cy="19" r="8" fill="#3a3c8a"/>' + Array.from({ length: 16 }, (_, i) => `<circle cx="${(i * 53) % 215}" cy="${6 + ((i * 29) % 50)}" r="${i % 3 ? .9 : 1.5}" fill="#fff"/>`).join('') + pine(14, 136, 1, '#1f7a52') + '<g fill="#ff5a36"><circle cx="9" cy="125" r="1.5"/><circle cx="17" cy="129" r="1.5" fill="#ffc23a"/><circle cx="12" cy="119" r="1.5" fill="#3aa6ea"/></g>' + pine(200, 137, .9, '#1f7a52');
    return `<svg class="scene" viewBox="0 0 215 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${S.sky[0]}"/><stop offset="1" stop-color="${S.sky[1]}"/></linearGradient></defs>
      <rect width="215" height="140" fill="url(#${id})"/>
      ${range([[0, 140], [0, 70], [22, 46], [40, 62], [64, 30], [88, 58], [110, 40], [134, 64], [158, 34], [182, 56], [200, 44], [215, 54], [215, 140]], S.far)}
      ${range([[0, 140], [0, 92], [30, 66], [52, 84], [80, 60], [104, 86], [128, 70], [152, 90], [176, 62], [215, 88], [215, 140]], S.near)}
      <path d="M0,140 L0,120 Q40,104 90,116 T215,112 L215,140z" fill="${S.ground}"/>
      ${extra}</svg>`;
  }
  function renderMap() {
    const list = $('mapList'); list.innerHTML = '';
    const cur = Levels.current(save);
    $('mapStars').textContent = `${Levels.totalStars(save)}/${LEVEL_COUNT * 3}`;
    let curEl = null;
    MOUNTAINS.forEach((M, m) => {
      const open = Levels.mountainOpen(save, m);
      const sec = document.createElement('section');
      sec.className = 'mtn' + (open ? '' : ' locked');
      sec.style.setProperty('--mt', MTN_COL[m]);
      sec.style.animationDelay = `${m * 0.06}s`;
      const lockTxt = !Levels.finished(save, m * LEVELS_PER - 1) ? `🔒 ${T('levelN', { n: m * LEVELS_PER })}` : `🔒 ${T('needStars', { n: M.gate })}`;
      const ms = Levels.mountainStars(save, m), full = ms === LEVELS_PER * 3;
      if (m === 4) sec.classList.add('night');
      sec.innerHTML = `<div class="mh"><b><i class="mnum">${m + 1}</i>${MTN_ICON[m]} </b><span class="${full ? 'full' : ''}">${full ? '👑' : '⭐'} ${ms}/${LEVELS_PER * 3}</span><i class="mprog" style="width:${ms / (LEVELS_PER * 3) * 100}%"></i></div>
        <div class="mbody">${mtnScene(m)}<p></p>
        <div class="trail"><svg class="path" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="${TRAIL_D}" fill="none" stroke="#12305a" stroke-width="20" stroke-linecap="round" vector-effect="non-scaling-stroke" opacity=".16"/>
        <path d="${TRAIL_D}" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <path d="${TRAIL_D}" fill="none" stroke="#e3f0fa" stroke-width="9" stroke-dasharray="1 7" vector-effect="non-scaling-stroke"/>
        <path class="done" d="${TRAIL_D}" fill="none" stroke="#ff6a2b" stroke-width="5" stroke-linecap="round" stroke-dasharray="0 1000" vector-effect="non-scaling-stroke"/></svg></div></div><div class="lockmsg"></div>`;
      sec.querySelector('.mh b').append(T('mtn_' + M.id));
      sec.querySelector('p').textContent = T('mtnd_' + M.id);
      sec.querySelector('.lockmsg').textContent = lockTxt;
      const nodes = sec.querySelector('.trail');
      for (let n = 0; n < LEVELS_PER; n++) {
        const id = m * LEVELS_PER + n, mask = save.levels[id] || 0;
        const b = document.createElement('button');
        const un = Levels.unlocked(save, id);
        // Знак трассы по сложности внутри горы: зелёный круг, синий квадрат, чёрный ромб, двойной ромб.
        const piste = n < 3 ? '' : n < 6 ? ' blue' : n === 6 ? ' black' : ' black2';
        b.className = 'node' + piste + (!un ? ' lock' : id === cur && !(mask & 1) ? ' cur' : mask & 1 ? ' done' : '');
        b.style.left = TRAIL_PTS[n][0] + '%'; b.style.top = TRAIL_PTS[n][1] + '%';
        if (id === cur) curEl = b;
        b.style.animationDelay = `${m * 0.06 + n * 0.035}s`;
        const st = [1, 2, 4].map((bit) => (mask & bit ? '<b>★</b>' : '★')).join('');
        b.innerHTML = un ? `<span class="n">${id + 1}</span><i class="st">${st}</i>` : '<span class="n">🔒</span>';
        b.onclick = () => { sfx.click(); playLevel(id); };
        nodes.appendChild(b);
      }
      list.appendChild(sec);
      // Оранжевая «пройденная» часть лыжни — до последнего открытого уровня горы.
      let reach = -1;
      for (let n = 0; n < LEVELS_PER; n++) if (Levels.unlocked(save, m * LEVELS_PER + n)) reach = n;
      const dp = sec.querySelector('path.done');
      if (reach > 0 && dp.getTotalLength) {
        const C = dp.getTotalLength() - 156;
        const L = reach < 4 ? reach * 26 : 78 + C + (reach - 4) * 26;
        dp.style.transition = 'stroke-dasharray 1s ease .3s';
        requestAnimationFrame(() => requestAnimationFrame(() => { dp.setAttribute('stroke-dasharray', `${L} 1000`); }));
      }
    });
    if (curEl) requestAnimationFrame(() => { list.scrollTop = Math.max(0, curEl.offsetTop - list.clientHeight / 2); });
  }
  // Из заезда — сначала вернуть фон меню.
  function toMenuThen(fn) {
    if (state === 'menu') { fn(); return; }
    fadeThrough(() => { if (online && !(screen === 'onlineScr')) leaveOnline(); if (state === 'prep') refundPrep(); $('prep').classList.remove('on'); state = 'menu'; level = null; race = null; team = null; daily = null; ghostRun = null; if (ropeMesh) { renderer.deleteMesh(ropeMesh); ropeMesh = null; } recorder = null; ghostRider.stop(); player.setRide(save.ride, Meta.upOf(save, save.ride)); newWorld(null, true); fn(); });
  }
  function openMap() { sfx.unlock(); toMenuThen(() => { show('mapScr'); renderMap(); }); }
  $('btnMap').onclick = () => { sfx.click(); openMap(); };
  $('mapBack').onclick = () => { sfx.click(); show('menu'); };

  function endRun(kind) {
    state = 'crash'; crashTimer = 0;
    $('powers').innerHTML = ''; powersKey = '';
    Platform.gameplayStop();
    $('avWarn').classList.remove('on');
    if (team && kind === 'avalanche') teamHurt('aval');
    const reasons = { rope: 'reasonRope', tree: 'reasonTree', rock: 'reasonRock', landing: 'reasonLanding', avalanche: 'reasonAvalanche', fence: 'reasonFence', skier: 'reasonSkier', boulder: 'reasonBoulder' };
    $('overReason').textContent = T(reasons[kind] || 'reasonTree');
  }

  // Зачислить монеты и прогресс заданий за пройденное с прошлого зачисления. Возвращает выполненные задания.
  function bankRun() {
    const dist = Math.floor(player.s);
    const total = Meta.runCoins(coinsRun, dist);
    save.coins += total - run.earned; run.earned = total;
    const b = run.banked;
    const fresh = Meta.applyRun(save, {
      dist, zone: run.zoneLevel,
      picked: coinsRun - b.picked, flips: run.flips - b.flips, snowmen: run.snowmen - b.snowmen, near: run.near - b.near,
      dodges: run.dodges - b.dodges, powers: run.powers - b.powers,
    }, !run.counted);
    run.counted = true;
    run.banked = { picked: coinsRun, flips: run.flips, snowmen: run.snowmen, near: run.near, dodges: run.dodges, powers: run.powers };
    const sc = score(), isBest = !level && !race && sc > save.best;
    if (isBest) save.best = sc;
    persist();
    return { fresh, isBest, sc, dist };
  }

  function showOver() {
    state = 'over';
    const r = bankRun();
    lastResult = race ? { finished: false, time: runTime, dist: player.s, sub: T('raceLbl', { d: T(race.key) }) }
      : level ? { finished: false, time: runTime, dist: player.s, sub: `Level ${level.id + 1} · ${T('mtn_' + MOUNTAINS[level.m].id)}` }
      : { finished: false, time: runTime, dist: player.s, sub: `Endless · score ${r.sc}` };
    if (!level && !race && save.crew && save.crew.grp) crew.submit(save.crew.grp, 'endless', save.crew.nick, save.best).catch(() => {});
    $('overDist').textContent = `${r.dist} ${T('m')}`;
    $('overScore').textContent = r.sc;
    $('overCoins').textContent = `+${run.earned * (run.doubled ? 2 : 1)}`;
    $('overBest').textContent = `${T('best')}: ${save.best}`;
    $('newBest').style.display = r.isBest ? 'block' : 'none';
    const notes = r.fresh.map((m) => `✔ ${T('missionDone')} ${missionText(m)}`);
    if (run.trial && !save.owned.includes(run.ride)) notes.push(`${rideName(run.ride)} — ${T('buy')}: ${RIDES[run.ride].price}`);
    $('overNotes').innerHTML = '';
    for (const n of notes) { const d = document.createElement('div'); d.textContent = n; $('overNotes').appendChild(d); }
    $('overProgWrap').style.display = level || race ? 'block' : 'none';
    if (race) {
      const pct = Math.floor(clamp(player.s / RACE.len, 0, 1) * 100);
      $('overProg').textContent = `${T('raceLbl', { d: T(race.key) })} · ${T('progress', { n: pct })}`;
      $('overPbar').style.width = pct + '%';
      $('newBest').style.display = 'none';
    }
    if (level) {
      const pct = Math.floor(clamp(player.s / level.len, 0, 1) * 100);
      $('overProg').textContent = `${T('levelN', { n: level.id + 1 })} · ${T('progress', { n: pct })}`;
      $('overPbar').style.width = pct + '%';
      $('newBest').style.display = 'none';
    }
    $('btnMenu').textContent = level ? T('map') : T('menu');
    sfx.music.play('lose', 'menu');
    $('btnCont').style.display = continued ? 'none' : 'flex';
    $('btnDouble').style.display = !run.doubled && run.earned > 0 ? 'flex' : 'none';
    show('over');
  }

  function toMenu() {
    sfx.click();
    toMenuThen(() => show('menu'));
  }

  // В онлайн-гонке паузы нет (соперник едет дальше); в любой гонке из паузы нельзя выйти в меню — только доехать.
  function pause() {
    if (state !== 'play' || (race && race.online) || (team && team.online)) return;
    prevState = state; state = 'pause'; sfx.pause(); show('pause');
    $('btnQuit').style.display = race || team ? 'none' : '';
    $('pauseNote').textContent = race || team ? T('raceNoQuit') : '';
  }
  function resume() {
    if (state !== 'pause') return;
    state = prevState; sfx.resume(); show(null); input.clearActions();
  }
  input.onPause = () => (state === 'pause' ? resume() : pause());
  Platform.onPause = () => sfx.pause();
  Platform.onResume = () => sfx.resume();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pause(); sfx.pause(); } else if (state !== 'pause') sfx.resume();
  });

  // --- Кнопки: заезд ---
  $('btnPlay').onclick = () => { sfx.unlock(); sfx.click(); openModes(); };
  $('btnEndless').onclick = () => startEndless();
  $('btnAgain').onclick = async () => { await Platform.showInterstitial(runTime); if (race) startRace(race.key); else startRun(level ? level.id : null); };
  $('btnMenu').onclick = async () => { await Platform.showInterstitial(runTime); if (level) openMap(); else toMenu(); };
  $('btnResume').onclick = resume;
  $('btnPause').onclick = pause;
  $('btnQuit').onclick = () => { if (run && player.s > 5) bankRun(); Platform.gameplayStop(); toMenu(); };
  $('btnSound').onclick = () => { save.muted = !save.muted; sfx.setMuted(save.muted); persist(); refreshMeta(); };
  $('btnMusic').onclick = () => { sfx.unlock(); save.musicOff = !save.musicOff; sfx.music.setOn(!save.musicOff); persist(); refreshMeta(); };
  $('btnCont').onclick = async () => {
    $('btnCont').disabled = true;
    const ok = await rewarded();
    $('btnCont').disabled = false;
    if (!ok) return;
    continued = true;
    player.revive(world);
    aval.pushBack(player, 70);
    state = 'play'; show(null);
    sfx.music.play(race || team ? 'race' : level ? MOUNTAINS[level.m].id : 'endless'); Platform.gameplayStart();
  };
  $('btnDouble').onclick = async () => {
    $('btnDouble').disabled = true;
    const ok = await rewarded();
    $('btnDouble').disabled = false;
    if (!ok || run.doubled) return;
    run.doubled = true; save.coins += run.earned; persist();
    $('overCoins').textContent = `+${run.earned * 2}`;
    $('btnDouble').style.display = 'none';
    popup(T('doubled'), 'gain'); sfx.coin();
  };

  // --- Гараж ---
  function openGarage() {
    sfx.unlock(); sfx.click();
    gIdx = RIDE_IDS.indexOf(save.ride);
    show('garage'); renderGarage();
  }
  function pips(n, total, extra = 0) {
    let h = '<div class="pips">';
    for (let i = 0; i < total; i++) h += `<i class="${i < n ? 'on' : i < n + extra ? 'up' : ''}"></i>`;
    return h + '</div>';
  }
  function renderGarage() {
    const id = RIDE_IDS[gIdx], r = RIDES[id], owned = save.owned.includes(id);
    player.setRide(id, Meta.upOf(save, id));
    $('gName').textContent = rideName(id);
    $('gDesc').textContent = T('desc_' + id);
    const up = Meta.upOf(save, id);
    const extra = { speed: Math.round(up.speed * 0.4), handling: Math.round(up.handling * 0.4), tricks: 0, armor: up.armor };
    $('gBars').innerHTML = ['speed', 'handling', 'tricks', 'armor']
      .map((k) => `<span>${T('st_' + k)}</span>${pips(r.bars[k], 7, extra[k])}`).join('');
    const main = $('gMain');
    main.className = 'btn'; main.disabled = false;
    if (owned) {
      const sel = save.ride === id;
      main.textContent = sel ? T('selected') : T('select');
      main.disabled = sel; if (!sel) main.classList.add('green');
    } else {
      main.innerHTML = `${T('buy')} · <span class="cbal"><i></i>${r.price}</span>`;
      if (save.coins < r.price) main.classList.add('ghost');
    }
    $('gTry').style.display = owned ? 'none' : 'flex';
    // Прокачка — только для купленного транспорта.
    $('gUps').classList.toggle('locked', !owned);
    if (!owned) { $('gUps').innerHTML = `<div class="uplock">🔒 ${T('buyToUpgrade')}</div>`; refreshMeta(); return; }
    $('gUps').innerHTML = Object.keys(UPGRADES).map((k) => {
      const lvl = up[k] || 0, max = UPGRADES[k].max;
      const btn = lvl >= max ? `<button class="btn small" disabled>${T('max')}</button>`
        : `<button class="btn small${save.coins >= upgradeCost(k, lvl) ? ' green' : ' ghost'}" data-up="${k}">+ <span class="cbal"><i></i>${upgradeCost(k, lvl)}</span></button>`;
      return `<div class="up"><div>${T('up_' + k)}<small>${T('upd_' + k)}</small></div>${pips(lvl, max)}${btn}</div>`;
    }).join('');
    $('gUps').querySelectorAll('[data-up]').forEach((b) => {
      b.onclick = () => {
        if (Meta.buyUpgrade(save, b.dataset.up, id)) { sfx.coin(); persist(); refreshMeta(); renderGarage(); }
        else toast(T('notEnough'));
      };
    });
    refreshMeta();
  }
  $('btnGarage').onclick = openGarage;
  $('gPrev').onclick = () => { sfx.click(); gIdx = (gIdx + RIDE_IDS.length - 1) % RIDE_IDS.length; renderGarage(); };
  $('gNext').onclick = () => { sfx.click(); gIdx = (gIdx + 1) % RIDE_IDS.length; renderGarage(); };
  $('gMain').onclick = () => {
    const id = RIDE_IDS[gIdx];
    if (save.owned.includes(id)) { save.ride = id; save.up = Meta.upOf(save, id); sfx.click(); }
    else if (Meta.buyRide(save, id)) { sfx.coin(); popup(rideName(id), 'gain'); }
    else { toast(T('notEnough')); return; }
    persist(); renderGarage();
  };
  $('gTry').onclick = async () => {
    const id = RIDE_IDS[gIdx];
    if (!(await rewarded())) return;
    tryRide = id; startRun(level ? level.id : null);
  };
  $('gBack').onclick = () => { sfx.click(); player.setRide(save.ride, Meta.upOf(save, save.ride)); show('menu'); };

  // --- Задания ---
  // Задания: яркие карточки по типу, полосы прогресса, «Забрать» с монетами, летящими в счётчик.
  function renderMissions() {
    const list = $('msList'); list.innerHTML = '';
    $('msCoins').textContent = save.coins.toLocaleString('en-US');
    const ready = save.missions.filter((m) => m.done).length;
    $('msReady').textContent = ready ? T('collectN', { n: ready }) : T('msHint');
    $('msHead').classList.toggle('ready', ready > 0);
    save.missions.forEach((m, i) => {
      const pct = Math.min(100, Math.round((m.prog / m.target) * 100));
      const d = document.createElement('div'); d.className = `mcardm t-${m.type}` + (m.done ? ' done' : '');
      d.style.setProperty('--i', i);
      d.innerHTML = `<div class="mic"><span>${MIS_ICON[m.type] || '🎯'}</span></div><div class="mbody2"><div class="mt"></div>
        <div class="mbar"><div class="fill" style="width:${pct}%"></div><span class="mnum"></span></div></div><div class="mrw"></div>`;
      d.querySelector('.mt').textContent = missionText(m);
      d.querySelector('.mnum').textContent = m.done ? '✓' : m.type === 'zone' ? `${pct}%` : `${Math.min(m.prog, m.target)} / ${m.target}`;
      const r = d.querySelector('.mrw');
      if (m.done) {
        const b = document.createElement('button'); b.className = 'pbtn claim';
        b.innerHTML = `<b>${T('claim')}</b><span><i class="cn"></i>${m.reward}</span>`;
        b.onclick = () => {
          const got = Meta.claimMission(save, m.id); if (!got) return;
          sfx.coin(); sfx.trick(); persist(); flyCoins(b, $('msCoins'), 10); d.classList.add('claimed');
          setTimeout(() => { renderMissions(); refreshMeta(); }, 650);
        };
        r.appendChild(b);
      } else r.innerHTML = `<div class="mreward"><i class="cn"></i><b>${m.reward}</b></div>`;
      list.appendChild(d);
    });
  }
  $('btnMissions').onclick = () => { sfx.unlock(); sfx.click(); show('missionsScr'); renderMissions(); };
  $('msPlay').onclick = () => { sfx.click(); openModes(); };
  $('msBack').onclick = () => { sfx.click(); show('menu'); };

  // --- Сундук ---
  $('btnChest').onclick = async () => {
    sfx.unlock();
    const left = Meta.chestLeft(save, Date.now());
    if (left > 0) { toast(`${T('chest')}: ${fmtTime(left)}`); return; }
    if (Platform.rewardedAvailable && !(await rewarded())) return;   // без рекламы сундук просто открывается по таймеру
    const got = Meta.openChest(save, Date.now());
    if (got) { sfx.coin(); popup(T('chestOpened', { n: got }), 'gain'); persist(); refreshMeta(); }
  };
  setInterval(() => { if (screen === 'menu') updateChestTile(); }, 1000);

  // --- Подарок дня ---
  function maybeDaily() {

      else if (e.type === 'hop') { sfx.jump(); emit(player.x, player.y, -player.s, 8, 4, 2); }
      else if (e.type === 'djump') { sfx.pop(); sfx.jump(); popup(T('doubleJump'), 'near'); emit(player.x, player.y, -player.s, 14, 5, 1); }
      else if (e.type === 'power') {
        run.powers++; e.kind === 'boost' ? sfx.boost() : sfx.trick();
        popup(`${T('pw_' + e.kind)} ${T('pwd_' + e.kind)}`, 'gain');
        emit(player.x, player.y + 1.2, -player.s, 24, 7, 4);

      else if (e.type === 'rockWarn') {
        sfx.warn();

      } else if (e.type === 'rockDodge') { run.dodges++; trickPts += 100; popup(`${T('dodged')} +100`, 'trick'); sfx.trick(); }
      else if (e.type === 'land') {
        sfx.land(); cam.shake = Math.max(cam.shake, 0.25);
        emit(player.x, player.y, -player.s, 18, 6, 4);
        run.flips += e.flips || 0;
        if (e.tricks.length) { sfx.trick(); popup(`${e.tricks.join(' + ')}  +${e.pts}`, 'trick'); }
        else if (e.pts > 0) popup(`${T('air')} +${e.pts}`);

      } else if (e.type === 'near') { run.near++; trickPts += 50; popup(`${T('nearMiss')} +50`, 'near'); }
      else if (e.type === 'snowman') {
        run.snowmen++; trickPts += 150; sfx.smash(); popup(`${T('snowman')} +150`, 'near');
        emit(e.x, world.height(e.x, e.s) + 1.2, -e.s, 30, 8, 5);

        trickPts += 100; sfx.smash(); popup(`${T('smash')} +100`, 'near'); cam.shake = Math.max(cam.shake, 0.4);
        emit(e.x, world.height(e.x, e.s) + 0.8, -e.s, 26, 8, 4);

      } else if (e.type === 'ice') { popup(T('ice'), 'near'); }

        sfx.warn(); cam.shake = Math.max(cam.shake, 0.3);

  function keepGhost(kind, id) {

    const g = { kind: kind === 'daily' ? 'daily' : 'level', key: id, id, ride: run.ride, time: runTime, nick: save.nick || 'Rider', samples: recorder.samples };
    recorder = null;

    if (slot && slot.raw && (kind !== 'daily' || slot.key === id) && slot.time <= g.time) return;
    // raw — упакованный заезд (читается сразу), code — сжатая строка для ссылки.
    const entry = { key: id, time: g.time, raw: 'r' + b64.enc(Ghost.pack(g)) };

  let shareFrom = null, shareData = null;
  const grabFrame = () => new Promise((res) => { snapCb = res; });
  function wrapText(ctx, text, maxW) {
    const words = text.split(' '), lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    if (cur) lines.push(cur); return lines;
  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  async function makeCard(r, link) {
    const W = 1080, H = 1350, c = document.createElement('canvas'); c.width = W; c.height = H;
    const ctx = c.getContext('2d'), shot = await grabFrame(), PH = 820;
    // Кадр игры (обрезка «cover») сверху.
    const k = Math.max(W / shot.width, PH / shot.height), sw = W / k, sh = PH / k;
    ctx.fillStyle = '#bfe3ff'; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(shot, (shot.width - sw) / 2, (shot.height - sh) / 2, sw, sh, 0, 0, W, PH);
    const gr = ctx.createLinearGradient(0, PH - 260, 0, PH); gr.addColorStop(0, 'rgba(18,48,90,0)'); gr.addColorStop(1, 'rgba(18,48,90,.55)');
    ctx.fillStyle = gr; ctx.fillRect(0, PH - 260, W, 260);
    // Плашка с названием.
    ctx.save(); ctx.translate(60, 60); ctx.rotate(-0.03);
    ctx.font = 'italic 900 64px system-ui, -apple-system, Segoe UI, Roboto, sans-serif'; ctx.textBaseline = 'middle';
    const bw = ctx.measureText('SNOW PANIC').width + 64;
    ctx.fillStyle = '#12305a'; roundRect(ctx, 6, 10, bw, 104, 20); ctx.fill();
    ctx.fillStyle = '#ff6a2b'; roundRect(ctx, 0, 0, bw, 104, 20); ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = '#12305a'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillText('SNOW PANIC', 30, 56); ctx.restore();
    // Нижняя карточка.
    ctx.fillStyle = '#f6faff'; ctx.fillRect(0, PH, W, H - PH);
    ctx.fillStyle = '#ffc23a'; ctx.fillRect(0, PH, W, 16);
    ctx.fillStyle = '#12305a'; ctx.textBaseline = 'alphabetic';
    ctx.font = '900 70px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    const head = r.race === 'won' ? `I won the race in ${Share.fmt(r.time)}` : r.race === 'lost' ? 'I lost the race. Can you win it?' : Share.headline(r);
    let y = PH + 112;
    for (const line of wrapText(ctx, head, W - 120)) { ctx.fillText(line, 60, y); y += 82; }
    ctx.fillStyle = '#ff6a2b'; ctx.font = 'italic 900 64px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    ctx.fillText(`— ${link && r.daily ? 'race my ghost 👻' : 'beat me'}`, 60, y + 4); y += 84;
    ctx.fillStyle = '#4a6a90'; ctx.font = '800 38px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    const stk = r.daily ? Daily.shownStreak(save.dstreak, Daily.key()) : 0;
    ctx.fillText(`${r.sub}${stk > 1 ? `  ·  🔥 ${stk} days` : ''}`, 60, y + 6);
    if (link || Platform.homeUrl) {
      const host = (link || Platform.homeUrl).replace(/^https?:\/\//, '').split(/[?#]/)[0].replace(/\/$/, '');
      ctx.fillStyle = '#12305a'; ctx.font = '800 34px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
      ctx.fillText(`▶ ${host}`, 60, H - 50);
    }
    return new Promise((res) => c.toBlob(res, 'image/png'));
  }

  // ===================== Режим «Связка» =====================
  // До 4 райдеров на резинках. С ботами — всё считается тут; онлайн — каждый считает свою физику,
  // а соседей видит по сети (позиции 10 раз в секунду). Сердечки общие: «рогатка» или лавина — минус одно.
  let team = null;

  const teamRemotes = teamBodies.map((b) => new RemoteRider(b));
  const BOT_NAMES = ['Frosty Fran', 'Rookie Rudy', 'Snowy Sam'], BOT_RIDES = ['sled', 'board', 'tub'];
  let ropeMesh = null;
  const startTeamBots = (n = 4) => startRun(null, null, { team: { bots: n - 1 } });
  function teamSetup(o, rideId) {
    const on = o.online || null;
    const seed = on ? on.seed : (Math.random() * 1e9) | 0, zone = on ? on.zone : RACE_ZONES[Math.floor(Math.random() * RACE_ZONES.length)];
    aval.rnd = makeRng(seed ^ 0x5bd1e995);
    newWorld({ seed, zone, diff: ROPE.worldDiff, len: ROPE.len, vBonus: 0, intensity: 0.1 });
    const order = on ? on.order : [{ oid: 'me', nick: save.nick || 'You', ride: rideId }].concat(BOT_NAMES.slice(0, o.bots).map((n, i) => ({ oid: 'bot' + i, nick: n, ride: BOT_RIDES[i] })));
    const meIdx = on ? on.me : 0, n = order.length, slots = Rope.slotsFor(n), c = world.center(2);
    let k = 0;
    const members = order.map((m, i) => {
      const x = c + slots[i];
      if (i === meIdx) { player.x = x; player.y = world.height(x, player.s); cam.x = x; return { ...m, local: true, body: player, dead: 0 }; }
      const body = teamBodies[k], rem = teamRemotes[k]; k++;
      body.setRide(RIDES[m.ride] ? m.ride : 'sled', {}); body.reset(x); body.y = world.height(x, body.s); body.pull = null;
      if (on) { rem.ride = body.rideId; rem.reset(world, 1); rem.x = x; rem.buf = []; return { ...m, remote: rem, body, dead: 0 }; }

    aval.surges = true; aval.setIntensity(0.3); aval.reset();
  }
  // Точка резинки для тела участника (бот/локальный — Player, онлайн — RemoteRider).
  function teamEnd_(m) { const b = m.remote || m.body; return { x: b.x, s: b.s, y: b.y, alive: m.remote ? !m.remote.crashed : m.body.alive }; }
  function teamPre(dt) {
    for (const m of team.members) m.body.pull = m.remote ? null : { x: 0, s: 0 };
    team.links.forEach((L, i) => {
      const ma = team.members[i], mb = team.members[i + 1];
      if (team.gone.has(ma.oid) || team.gone.has(mb.oid)) return;
      const fr = Rope.step(L, teamEnd_(ma), teamEnd_(mb), world.obstacles, dt);
      if (ma.body.pull) { ma.body.pull.x += fr.a.x; ma.body.pull.s += fr.a.s; }
      if (mb.body.pull) { mb.body.pull.x += fr.b.x; mb.body.pull.s += fr.b.s; }
      if (!fr.ev) return;
      const mine = ma.local || mb.local || ma.bot || mb.bot;
      if (fr.ev.type === 'snag' && (ma.local || mb.local)) { popup(T('ropeSnag'), 'near'); sfx.near && sfx.near(); }
      if (fr.ev.type === 'unsnag' && (ma.local || mb.local)) popup(T('ropeFree'), 'gain');
      if (fr.ev.type === 'fling' && mine) {
        if (!ma.remote) ma.body.fling(fr.ev.a.x, fr.ev.a.up);
        if (!mb.remote) mb.body.fling(fr.ev.b.x, fr.ev.b.up);

        teamHurt('fling');

    });
  }
  function teamPost(dt) {
    team.members.forEach((m, i) => {
      if (m.local) return;
      if (m.remote) { m.remote.update(dt, world, player, true); m.remote.syncBody(dt); return; }
      const mates = [team.members[i - 1], team.members[i + 1]].filter(Boolean).map(teamEnd_);
      const b = m.body;
      b.update(dt, m.bot.think(b, mates, world), world, []);
      if (b.alive && b.s - aval.s < AVAL.killGap + 1) { b.crash('avalanche', []); popup(T('avTeam', { name: m.nick }), 'near'); teamHurt('aval'); }

  // Пока отсчёт/бусты: напарники стоят на старте (онлайн — подтягиваем их позиции).

    let k = 0;

  // Минус сердечко. Онлайн решает хозяин лобби (чтобы два одновременных сигнала не сняли два сердца).
  function teamHurt(why) {

  // Резинки: трубочки по точкам; натянутая краснеет.
  function drawRopes() {
    if (ropeMesh) { renderer.deleteMesh(ropeMesh); ropeMesh = null; }
    if (!team) return;
    const mb = new MeshBuilder(), w = 0.07;
    const yAt = (x, s) => world.height(x, s);
    team.links.forEach((L, i) => {
      const ma = team.members[i], mbm = team.members[i + 1];
      if (team.gone.has(ma.oid) || team.gone.has(mbm.oid)) return;
      const pts = Rope.points(L, teamEnd_(ma), teamEnd_(mbm), yAt);
      const k = clamp(L.T / 22, 0, 1), col = [1, 0.82 - k * 0.6, 0.2 - k * 0.15];
      for (let j = 0; j + 1 < pts.length; j++) {
        const a = pts[j], b = pts[j + 1];
        const dx = b[0] - a[0], dz = b[2] - a[2], L2 = Math.hypot(dx, dz) || 1;
        const px = -dz / L2 * w, pz = dx / L2 * w;
        const A1 = [a[0] + px, a[1] + w, a[2] + pz], A2 = [a[0] - px, a[1] + w, a[2] - pz], A3 = [a[0] - px, a[1] - w, a[2] - pz], A4 = [a[0] + px, a[1] - w, a[2] + pz];
        const B1 = [b[0] + px, b[1] + w, b[2] + pz], B2 = [b[0] - px, b[1] + w, b[2] - pz], B3 = [b[0] - px, b[1] - w, b[2] - pz], B4 = [b[0] + px, b[1] - w, b[2] + pz];
        mb.quad(A1, B1, B2, A2, col); mb.quad(A4, A3, B3, B4, col); mb.quad(A1, A4, B4, B1, col); mb.quad(A2, B2, B3, A3, col);

      },
      mode: () => renderParty(),
      start: (p) => partyStart(p),

        else if (race && race.online) remote.push(p, performance.now());

      fin: (id, t) => { if (race && race.online && !remote.finished) { remote.finished = true; remote.finishT = t; } },

  function focusCard() {

    const mid = box.scrollLeft + box.clientWidth / 2;
    let best = 0, bd = 1e9;
    cards.forEach((c, i) => { const d = Math.abs(c.offsetLeft + c.offsetWidth / 2 - mid); if (d < bd) { bd = d; best = i; } });
    const wide = box.scrollWidth <= box.clientWidth + 4;
    cards.forEach((c, i) => c.classList.toggle('focus', !wide && i === best));
    [...$('mdots').children].forEach((d, i) => d.classList.toggle('on', i === best));
  }

  function unpick(k) {
    if (prepSel[k] === 'inv') save.inv[k] = (save.inv[k] || 0) + 1; else if (prepSel[k]) save.coins += BOOSTS[k].price;

  async function togglePrep(k, viaVideo) {
    const b = BOOSTS[k];
    if (prepFree === k) return;
    if (prepSel[k]) { unpick(k); persist(); sfx.click(); renderPrep(); refreshMeta(); return; }
    if (save.inv[k] > 0) { save.inv[k]--; prepSel[k] = 'inv'; persist(); sfx.coin(); renderPrep(); return; }

  function clipSlowmo(dt) {

    slowCool -= dt;
    if (state === 'play' && slowT <= 0 && slowCool <= 0 && player.s - aval.s < 16) { slowT = 1.6; slowCool = 7; }

  // Запись видео прямо из игры (кадр игры + звук, без интерфейса).

    const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
    const type = types.find((t) => MR.isTypeSupported && MR.isTypeSupported(t)) || '';
    const stream = canvas.captureStream(30);
    try {
      sfx.unlock();
      if (sfx.ctx && sfx.master) { const dest = sfx.ctx.createMediaStreamDestination(); sfx.master.connect(dest); dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t)); rec = { dest }; } else rec = {};
      const chunks = [];
      const mr = new MR(stream, type ? { mimeType: type, videoBitsPerSecond: 6e6 } : undefined);
      Object.assign(rec, { mr, chunks, t0: performance.now(), type: mr.mimeType || type || 'video/webm' });
      mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      const r = rec;
      mr.onstop = () => saveRec(new Blob(chunks, { type: r.type }), r.type);
      mr.start(1000);
      $('clipBar').classList.add('rec');
      rec.timer = setInterval(() => {
        const s = (performance.now() - rec.t0) / 1000;
        $('clipTime').textContent = Share.fmt(s);
        if (s > 60) stopRec();
      }, 250);
    } catch (e) { rec = null; toast(T('recFail')); }
  }
  function stopRec() {
    if (!rec) return;
    const r = rec; rec = null;
    clearInterval(r.timer); $('clipTime').textContent = ''; $('clipBar').classList.remove('rec');
    try { r.mr.stop(); } catch (e) { /* ignore */ }
    try { r.dest && sfx.master.disconnect(r.dest); } catch (e) { /* ignore */ }
  }
  function saveRec(blob, type) {
    const ext = type.includes('mp4') ? 'mp4' : 'webm', file = new File([blob], `snow-panic-clip.${ext}`, { type });
    // Файл всегда сохраняем (в «Загрузки»/галерею): окно «поделиться» после остановки записи браузер может не открыть без нажатия.
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    toast(T('recSaved'));
  }
  $('clipRec').onclick = () => { if (rec) stopRec(); else startRec(); };

  // --- Цикл ---
  let last = performance.now(), perfFrames = 0, perfSum = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    let dt = (t - last) / 1000; last = t;
    const rawDt = Math.min(dt, 0.5);   // настоящее время (таймер бустов — ровно 5 с даже на медленном телефоне)
    if (dt > 0.05) dt = 0.05;
    dt = clipSlowmo(dt);
    now += dt;
    renderer.resize();
    input.update(dt);

    if (state === 'play') {
      runTime += dt;
      const events = [];
      player.avalancheGap = player.s - aval.s;
      if (team) teamPre(dt);
      player.update(dt, input, world, events);
      if (team) teamPost(dt);
      if (recorder) recorder.update(dt, world, player);
      if (ghostRun) ghostRider.update(dt, world);
      boulders.update(dt, player, world, events);
      if (boulders.b && !boulders.b.hit && Math.random() < 0.4) emit(boulders.b.x, boulders.b.y - BOULDER.r, -boulders.b.s, 1, 3, 2);
      world.update(player.s);
      if (!level && !daily) aval.setIntensity((race ? raceAvBase : 0.15) + player.s / 4500);   // лавина злее с дистанцией
      // Бот, которого догнала лавина, падает и теряет время (как игрок после возрождения).
      if (race && !race.online && !rival.finished && rival.s - aval.s < AVAL.killGap + 1) {
        rival.stumble = 2.2; rival.v *= 0.25; rival.bump = 1; rival.s = Math.max(rival.s, aval.s + 22);
        popup(T('rivalCaught', { name: race.cfg.name }), 'gain');
      }
      aval.update(dt, player, events);
      if (player.power.boost > 0) emit(player.x, player.y + 0.6, -(player.s - 1.3), 3, 3, 1.5);
      handle(events);
      if (level && player.alive && state === 'play' && player.s >= level.len) finishLevel();
      if (daily && player.alive && state === 'play' && player.s >= daily.lv.len) finishDaily();
      if (race) {
        rival.update(dt, world, player, true); rival.syncBody(dt);
        if (race.online) netTick(dt);
        raceEvents();
        if (player.alive && state === 'play' && player.s >= RACE.len) finishRace();
      }
      if (team && team.online) netTick(dt);
      // смена зоны
      const z = world.zoneAt(player.s);
      if (z !== run.zone) { run.zone = z; run.zoneLevel++; popup(T('zone_' + ZONES[z].id), 'zone'); }
      if (!player.alive && state === 'play') endRun(player.crashKind);
      if (player.grounded && Math.abs(player.vx) > 4) emit(player.x, player.y, -player.s + 0.5, 1, 3, 2);
      updateHud();
      updatePowers();
      // авто-качество
      if (perfFrames < 150) { perfFrames++; perfSum += dt; if (perfFrames === 150 && perfSum / 150 > 0.024 && renderer.pixelRatio > 0.6) { renderer.pixelRatio -= 0.25; perfFrames = 0; perfSum = 0; } }
    } else if (state === 'crash') {
      crashTimer += dt;
      player.update(dt, input, world, []);
      boulders.update(dt, player, world, []);
      aval.s += aval.v * dt;
      if (race) { rival.update(dt, world, player, true); rival.syncBody(dt); if (race.online) netTick(dt); }
      if (team) { teamPre(dt); teamPost(dt); if (team.online) netTick(dt); }
      if (ghostRun) ghostRider.update(dt, world);
      updateHud();
      if (state === 'crash' && crashTimer > (race || team ? 1.0 : 1.3)) { if (race || team) respawnOnline(); else if (daily) showDailyEnd(false); else showOver(); }
    } else if (state === 'prep') {
      if (!prepPaused) { prepT -= rawDt; updatePrepRing(); if (prepT <= 0) goRun(); }
      player._animate(dt, 0);
      if (race && race.online) { rival.update(dt, world, player, true); netTick(dt); }
      if (race) rival.syncBody(dt);
      if (team) teamIdle(dt);
      updateHud();
    } else if (state === 'countdown') {
      const prev = Math.ceil(countT);
      countT -= dt;
      const cur = Math.ceil(countT);
      if (cur !== prev && cur > 0) { showCount(String(cur)); sfx.count(false); }
      if (countT <= 0) { showCount(T('goGo')); sfx.count(true); state = 'play'; runTime = 0; input.clearActions(); Platform.gameplayStart(); }
      player._animate(dt, 0);
      if (race && race.online) { rival.update(dt, world, player, true); netTick(dt); }
      if (race) rival.syncBody(dt);
      if (team) teamIdle(dt);
      updateHud();
    } else if (state === 'finish') {
      finishT += dt;
      player.update(dt, FIN_INPUT, world, []);
      world.update(player.s);
      aval.update(dt, player, []);
      if (race) { rival.update(dt, world, player, true); rival.syncBody(dt); if (race.online) netTick(dt); }
      if (team) { teamPre(dt); teamPost(dt); if (team.online) netTick(dt); }
      if (ghostRun) ghostRider.update(dt, world);
      updateHud();
      if (finishT > 1.7) { if (team) showTeamEnd(); else if (race) showRaceEnd(); else if (daily) showDailyEnd(true); else showWin(); }
    } else if (state === 'menu') {
      player.s = 2; player.y = world.height(player.x, player.s);
      if (party && screen === 'menu') player.yaw = Math.PI + Math.sin(now * 0.6) * 0.25; else player.yaw += dt * 0.6;
      player._animate(dt, 0);
      if (party) partyIdle(dt);
    }

    world.target.x = player.x; world.target.y = player.y; world.target.s = player.s;
    $('warn').classList.toggle('on', state === 'play' && boulders.warning);
    const surge = state === 'play' && aval.surging;
    sfx.music.setIntensity(surge ? 1 : 0);
    $('avWarn').classList.toggle('on', surge);
    document.querySelector('.av').classList.toggle('surge', surge);
    $('speedfx').classList.toggle('on', state === 'play' && player.power.boost > 0);

    // Небо и туман плавно меняются по зонам.
    const zc = zoneCol[world.zoneAt(player.s)], env = renderer.env, k = 1 - Math.exp(-dt * 0.8);
    for (let i = 0; i < 3; i++) { env.fog[i] += (zc.fog[i] - env.fog[i]) * k; env.skyTop[i] += (zc.skyTop[i] - env.skyTop[i]) * k; }

    const gap = player.s - aval.s;
    sfx.setWind(state === 'play' ? clamp(player.v / 38, 0, 1) : 0.1, !player.grounded);
    sfx.setRumble(state === 'play' || state === 'crash' ? clamp((70 - gap) / 70, 0, 1) : 0);
    if (state === 'play' && gap < 25) cam.shake = Math.max(cam.shake, (25 - gap) / 25 * 0.35);

    // частицы
    for (const p of spray.p) {
      if (p.life <= 0) { p.y = -9999; continue; }
      p.life -= dt; p.vy -= 9 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
    for (let i = 0; i < SPRAY; i++) { const p = spray.p[i]; spray.pts.data.set([p.x, p.y, p.z], i * 3); }

    render(dt);
    if (snapCb) { const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height; c.getContext('2d').drawImage(canvas, 0, 0); const cb = snapCb; snapCb = null; cb(c); }
  }

  function render(dt) {
    const ps = player.s;
    let eye, target, fov;
    if (state === 'menu') {
      const portrait = renderer.aspect < 1;
      if (screen === 'garage') {
        // Витрина: камера неподвижна, транспорт крутится. На ПК он слева от карточки, на телефоне — над ней.
        if (portrait) { eye = [player.x, player.y + 2.6, -(ps - 6.2)]; target = [player.x, player.y - 1.7, -ps]; fov = 64; }
        else { eye = [player.x - 1.0, player.y + 2.4, -(ps - 5.6)]; target = [player.x + 1.9, player.y + 0.6, -ps]; fov = 50; }
      } else if (party && screen === 'menu') {
        // Лобби: камера спереди на всю компанию — все стоят рядом и смотрят на тебя.
        const n = Math.min(4, party.members.length), cx = player.x + [0, 0, 1.4, 0, 1.4][n];
        eye = [cx, player.y + (portrait ? 1.9 : 1.6), -(ps + (portrait ? 10.5 : 9))];
        target = [cx + (portrait ? 0 : -2.5), player.y + (portrait ? 4.6 : 1.7), -ps];
        fov = portrait ? 66 : 50;
      } else {
        const a = now * 0.15;
        if (wideMenu() && screen === 'menu') {
          // ПК: камера спереди, видна витрина транспорта по бокам
          eye = [player.x + Math.sin(a * 1.3) * 2.5, player.y + 4.2, -(ps + 14)];
          target = [player.x, player.y + 3.4, -ps];
          fov = 52;
        } else {
          eye = [player.x + Math.sin(a) * 7, player.y + 3.2, -(ps - 7 * Math.cos(a))];
          target = [player.x, player.y + 2.6, -ps];
          fov = 55;
        }
      }
    } else {
      cam.x = damp(cam.x, player.x, 5, dt);
      cam.y = damp(cam.y, Math.max(player.y, world.height(player.x, ps)) + 4.3, player.grounded ? 8 : 3, dt);
      cam.shake = Math.max(0, cam.shake - dt * 1.5);
      const sh = cam.shake * 0.35;
      // Портрет: игрок в нижней трети кадра, больше трассы впереди, шире угол обзора.
      const portrait = renderer.aspect < 1;
      const back = portrait ? 8.5 : 9.5, ahead = portrait ? 34 : 22;
      eye = [cam.x + (Math.random() - 0.5) * sh, cam.y + (portrait ? 2.2 : 0.8) + (Math.random() - 0.5) * sh, -(ps - back)];
      target = [player.x * 0.6 + cam.x * 0.4, world.height(player.x, ps + ahead) + (portrait ? 1.0 : 0.2), -(ps + ahead)];
      fov = (portrait ? 74 : 60) + clamp(player.v / player.vmax(), 0, 1.1) * 14 - (1 - timeScale) * 16;
    }
    renderer.setCamera(fov, eye, target);
    renderer.begin();
    world.draw(ps - 9, eye[1], now);
    player.draw(renderer, world, now);
    const tag = $('rivalTag'), inRun = ['prep', 'countdown', 'play', 'finish', 'crash', 'pause', 'over', 'won'].includes(state);
    // Табличка с именем над соперником/призраком: проекция точки над головой на экран.
    const placeTag = (X, Y, S, name, cls) => {
      const v = renderer.vp, Z = -S;
      const cx = v[0] * X + v[4] * Y + v[8] * Z + v[12], cy = v[1] * X + v[5] * Y + v[9] * Z + v[13], cw = v[3] * X + v[7] * Y + v[11] * Z + v[15];
      if (screen === null && cw > 0.5 && S - ps < 160 && S - ps > -6) {
        const sx = (cx / cw * 0.5 + 0.5) * innerWidth, sy = (1 - (cy / cw * 0.5 + 0.5)) * innerHeight;
        tag.style.display = 'block'; tag.textContent = name; tag.className = cls;
        tag.style.transform = `translate(${Math.round(sx)}px, ${Math.round(sy)}px) translate(-50%, -100%)`;
      } else tag.style.display = 'none';
    };
    const tagList = [];
    if (team && inRun) {
      for (const m of team.members) if (!m.local && !team.gone.has(m.oid)) { m.body.draw(renderer, world, now); tagList.push({ x: m.body.x, y: m.body.y + 2.6, s: m.body.s, name: m.nick, cls: (m.bot ? 'bot' : '') + (m.body.alive ? '' : ' down') }); }
      drawRopes();
    } else if (state === 'menu' && party && screen === 'menu') {
      let k = 0;
      for (const m of party.members) { if (m.oid === meOid() || k > 2) continue; const b = teamBodies[k++]; b.draw(renderer, world, now); tagList.push({ x: b.x, y: b.y - 0.1, s: b.s, name: Nick.clean(m.nick) + (m.ready ? ' ✓' : ''), cls: '' }); }
      tagList.push({ x: player.x, y: player.y - 0.1, s: player.s, name: (save.nick || 'You') + (party.ready ? ' ✓' : ''), cls: 'bot' });
    }
    if (state === 'menu') drawShowroom(tagList);
    placeTags(tagList);
    if (team && inRun) tag.style.display = 'none';
    else if (race && inRun) { rivalBody.draw(renderer, world, now); placeTag(rival.x, rival.y + 2.6, rival.s, race.cfg.name, ''); }
    else if (ghostRun && inRun) {
      ghostBody.draw(renderer, world, now);
      placeTag(ghostRider.x, ghostRider.y + 2.6, ghostRider.s, ghostRun.own ? T('ghostYou') : ghostRun.run.nick, 'ghost');
    } else tag.style.display = 'none';
    // лавина
    const gap = ps - aval.s;
    if (gap < 80) {
      const wob = 1 + Math.sin(now * 6) * 0.03;
      M4.compose(tmp, world.center(aval.s), world.height(world.center(aval.s), aval.s) - 2 + Math.sin(now * 4) * 0.3, -aval.s - 6, 0, 0, 0, wob);
      renderer.draw(aval.mesh, tmp);
      if (state === 'play') emit(world.center(aval.s) + (Math.random() - 0.5) * 30, world.height(world.center(aval.s), aval.s) + 8, -aval.s, 2, 6, 3);
    }
    if (boulders.b) {
      const b = boulders.b;
      M4.compose(tmp, b.x, b.y, -b.s, 0, -b.rollS, -b.rollX, BOULDER.r);
      world.drawShadowOf(boulderMesh, tmp, b.x, b.s);
      renderer.draw(boulderMesh, tmp);
    }
    renderer.drawPoints(spray.pts, 26, 0.9);
    // снегопад вокруг камеры
    for (let i = 0; i < FALL; i++) {
      const f = fallP[i];
      f[1] -= f[3] * dt * 3; f[0] += Math.sin(now + i) * dt * 0.3;
      if (f[1] < -6) f[1] += 30;
      fall.data[i * 3] = eye[0] + f[0];
      fall.data[i * 3 + 1] = eye[1] + f[1] - 8;
      fall.data[i * 3 + 2] = eye[2] - ((f[2] - ps) % 90 + 90) % 90 + 20;
    }
    renderer.drawPoints(fall, 14, 0.75);
  }

  // --- Старт ---
  Platform.init().then((env) => {
    save = Meta.normalize(Platform.load());   // облачное сохранение могло прийти при init
    sfx.setMuted(!!save.muted);
    sfx.music.setOn(!save.musicOff);
    player.setRide(save.ride, Meta.upOf(save, save.ride));
    setLang(env.lang);
    applyTexts();
    document.body.classList.toggle('noads', !Platform.rewardedAvailable);
    newWorld(null, true);
    // Вход: заставка (живая сцена + логотип) → главная страница. Подарок дня — со следующего захода.
    const newPlayer = !save.runs && !Object.keys(save.levels).length;
    show('menu');
    Platform.restorePurchases(creditPack);
    friendsBadge(); hubOn();
    const afterSplash = () => {
      const roomLink = Platform.challengeParam('room');
      if (roomLink && crew.enabled) openOnline('friend', Match.cleanCode(roomLink));
      else checkChallenge().then((ch) => { if (!ch && !newPlayer) maybeDaily(); });
    };
    $('loading').style.display = 'none';
    Platform.gameReady();
    requestAnimationFrame((t) => { last = t; frame(t); });
    runSplash(afterSplash);
  });

  // Заставка: полный экран — живая сцена игры, логотип, полоса загрузки, «нажми, чтобы начать».
  // В автотестах (navigator.webdriver) пропускается, если в адресе нет ?splash.
  function runSplash(done) {
    const el = $('splash');
    if (navigator.webdriver && !/[?&]splash/.test(location.search)) { el.remove(); done(); return; }
    el.classList.add('on');
    setTimeout(() => el.classList.add('ready'), 1700);
    let closed = false;
    const go = (e) => {
      if (closed || !el.classList.contains('ready')) return;
      closed = true; if (e) e.preventDefault();
      sfx.unlock(); sfx.click(); sfx.music.play('menu');
      el.classList.add('out');
      setTimeout(() => { el.remove(); done(); }, 450);
    };
    el.addEventListener('pointerdown', go);
    window.addEventListener('keydown', function k(e) { if (!closed && el.classList.contains('ready')) { window.removeEventListener('keydown', k); go(e); } });
  }

  // Для автотестов.
  window.__game = {
    get state() { return state; }, get screen() { return screen; }, player, input, get world() { return world; }, aval, startRun, startEndless, playLevel, openMap,
    get level() { return level; }, get fading() { return fading; }, get race() { return race; }, get rival() { return rival; }, remote, get online() { return online; }, openOnline, startRace, openRace,
    get score() { return score(); }, get save() { return save; }, get run() { return run; }, boulders,
    get daily() { return daily; }, startDaily, ghostRider, get ghostRun() { return ghostRun; }, get ghosts() { return ghosts; }, setClip, get clip() { return clip; },
    get timeScale() { return timeScale; }, openShop, openModes, get prepT() { return prepT; }, openShare, openCrew, crew, get lastResult() { return lastResult; },
    sfx, get team() { return team; }, startTeamBots, openParty, leaveParty, get party() { return party; }, get hub() { return hub; }, openFriends, addFriend,
  };
})();

</script>
</body>
