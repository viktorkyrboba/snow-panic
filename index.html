const MOUNTAINS = [
  { id: 'forest', zone: 0, gate: 0, tasks: ['flips', 'snowmen', 'near', 'powers'] },
  { id: 'pass', zone: 1, gate: 10, tasks: ['dodges', 'flips', 'near', 'powers'] },
  { id: 'gorge', zone: 3, gate: 24, tasks: ['dodges', 'flips', 'powers', 'near'] },
  { id: 'village', zone: 2, gate: 40, tasks: ['snowmen', 'near', 'flips', 'dodges'] },
  { id: 'eve', zone: 4, gate: 58, tasks: ['flips', 'snowmen', 'dodges', 'near'] },
];
const LEVELS_PER = 8;
const LEVEL_COUNT = MOUNTAINS.length * LEVELS_PER;

const Levels = {
  info(id) {
    const m = Math.floor(id / LEVELS_PER), n = id % LEVELS_PER, M = MOUNTAINS[m];
    const t = id / (LEVEL_COUNT - 1);                       // 0..1 по всей игре
    const len = Math.round((650 + n * 110 + m * 180) / 50) * 50;
    const diff = clamp(0.08 + t * 0.85 + (n === LEVELS_PER - 1 ? 0.05 : 0), 0, 1);
    const type = M.tasks[n % M.tasks.length];
    const coinGoal = Math.max(10, Math.round(len * 0.23 * (0.32 + t * 0.2) / 5) * 5);
    return {
      id, m, n, len, diff, zone: M.zone, seed: 7001 + id * 131,
      intensity: clamp(0.1 + t * 0.9, 0, 1),
      boulders: !(m === 0 && n < 3),                        // первые уровни — без валунов
      vBonus: t * 7,
      coinGoal, task: { type, target: this.taskTarget(type, len, t) },
    };
  },

  taskTarget(type, len, t) {
    const k = 1 + t * 0.6;
    switch (type) {
      case 'flips': return Math.max(1, Math.round(len / 420 * k));
      case 'snowmen': return Math.max(2, Math.round(len / 260 * k));
      case 'near': return Math.max(2, Math.round(len / 190 * k));
      case 'powers': return Math.max(1, Math.round(len / 520));
      case 'dodges': return Math.max(1, Math.floor((len - 250) / 520));
      default: return 1;
    }
  },

  // Звёзды за заезд: биты 1 — финиш, 2 — монеты, 4 — задание.
  starsFor(info, res) {
    let mask = 0;
    if (res.finished) mask |= 1;
    if (res.finished && res.coins >= info.coinGoal) mask |= 2;
    if (res.finished && (res[info.task.type] || 0) >= info.task.target) mask |= 4;
    return mask;
  },
  count(mask) { return (mask & 1) + ((mask >> 1) & 1) + ((mask >> 2) & 1); },

  totalStars(save) { let s = 0; for (const k in save.levels) s += this.count(save.levels[k]); return s; },
  mountainStars(save, m) { let s = 0; for (let n = 0; n < LEVELS_PER; n++) s += this.count(save.levels[m * LEVELS_PER + n] || 0); return s; },
  finished(save, id) { return !!((save.levels[id] || 0) & 1); },
  mountainOpen(save, m) {
    if (m === 0) return true;
    return this.finished(save, m * LEVELS_PER - 1) && this.totalStars(save) >= MOUNTAINS[m].gate;
  },
  unlocked(save, id) {
    if (id === 0) return true;
    if (id >= LEVEL_COUNT) return false;
    const m = Math.floor(id / LEVELS_PER);
    if (!this.mountainOpen(save, m)) return false;
    return this.finished(save, id - 1);
  },
  // Уровень для кнопки «Играть»: первый открытый и не пройденный, иначе последний открытый.
  current(save) {
    let last = 0;
    for (let i = 0; i < LEVEL_COUNT; i++) {
      if (!this.unlocked(save, i)) break;
      last = i;
      if (!this.finished(save, i)) return i;
    }
    return last;
  },

  // Записать результат. Возвращает {mask, newStars, reward}.
  record(save, info, res) {
    const old = save.levels[info.id] || 0, mask = this.starsFor(info, res);
    const merged = old | mask, newStars = this.count(merged) - this.count(old);
    if (merged !== old) save.levels[info.id] = merged;
    const reward = newStars * (20 + info.m * 10) + (mask & 1 && !(old & 1) ? 30 : 0);
    save.coins += reward;
    return { mask, merged, newStars, reward };
  },
};

// --- social.js ---
// Social: Daily Run, ghost runs (record / encode / play back), share links and cards, crew boards.
// Pure logic lives here so it can be unit-tested in node; main.js wires it to the game.

// ---------- Daily Run: one track per UTC day, the same for everyone ----------
const DAILY = { len: 1500, zones: [0, 1, 2, 3, 4], epoch: Date.UTC(2026, 0, 1) };

const Daily = {
  key(t = Date.now()) { const d = new Date(t); return d.toISOString().slice(0, 10); },   // 'YYYY-MM-DD' (UTC)
  dayNum(key) { return Math.round((Date.parse(key + 'T00:00:00Z') - DAILY.epoch) / 864e5); },
  keyOf(n) { return new Date(DAILY.epoch + n * 864e5).toISOString().slice(0, 10); },
  hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; },
  // Track parameters (World options) for a given day.
  level(key) {
    const h = Daily.hash('snow-panic/' + key), zone = DAILY.zones[h % DAILY.zones.length];
    return { daily: key, seed: h % 1e9, zone, diff: 0.4 + ((h >>> 8) % 25) / 100, len: DAILY.len, vBonus: 0, intensity: 0.32, boulders: zone !== 0 };
  },
  // Streak: playing at least one Daily Run per day. Returns the updated streak record.
  play(rec, key) {
    rec = Object.assign({ last: '', streak: 0, bestStreak: 0 }, rec || {});
    if (rec.last === key) return rec;
    const yesterday = Daily.keyOf(Daily.dayNum(key) - 1);
    rec.streak = rec.last === yesterday ? rec.streak + 1 : 1;
    rec.bestStreak = Math.max(rec.bestStreak, rec.streak);
    rec.last = key;
    return rec;
  },
  // Streak shown in the menu: still alive if played today or yesterday.
  shownStreak(rec, key) {
    if (!rec || !rec.last) return 0;
    return rec.last === key || rec.last === Daily.keyOf(Daily.dayNum(key) - 1) ? rec.streak : 0;
  },
  // Result value: finished runs always beat unfinished ones; faster is better, otherwise farther.
  value(r) { return r.finished ? 1e7 - Math.round(r.time * 100) : Math.floor(r.dist); },
  better(a, b) { return !b || Daily.value(a) > Daily.value(b); },
};

// ---------- Ghost: 4 samples per second of (distance, lateral offset from track center, height above ground) ----------
const GHOST = { hz: 4, ver: 1, maxSamples: 4 * 60 * 6 };
const RIDE_CODES = ['tube', 'sled', 'board', 'tub'];

class GhostRecorder {
  constructor() { this.samples = []; this.t = 0; this.next = 0; }
  update(dt, world, p) {
    this.t += dt;
    while (this.t >= this.next && this.samples.length < GHOST.maxSamples) {
      const g = world.height(p.x, p.s);
      this.samples.push([p.s, p.x - world.center(p.s), Math.max(0, p.y - g)]);
      this.next += 1 / GHOST.hz;
    }
  }
}

const b64 = {
  enc(bytes) { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec(str) { const s = atob(str.replace(/-/g, '+').replace(/_/g, '/')); const out = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i); return out; },
};
async function streamBytes(bytes, Ctor, fmt) {
  const st = new Blob([bytes]).stream().pipeThrough(new Ctor(fmt));
  return new Uint8Array(await new Response(st).arrayBuffer());
}

const Ghost = {
  // run: { kind:'daily'|'level', key (date) | id (level), ride, time (s), nick, samples }
  pack(run) {
    const nick = new TextEncoder().encode(Nick.clean(run.nick || '') || 'Rider').slice(0, 24);
    const n = run.samples.length, out = new Uint8Array(12 + nick.length + n * 3);
    let o = 0;
    out[o++] = GHOST.ver;
    out[o++] = run.kind === 'daily' ? 1 : 2;
    const ref = run.kind === 'daily' ? Daily.dayNum(run.key) : run.id;
    out[o++] = ref & 255; out[o++] = (ref >> 8) & 255;
    out[o++] = Math.max(0, RIDE_CODES.indexOf(run.ride));
    const cs = Math.min(0xffffff, Math.round(run.time * 100));
    out[o++] = cs & 255; out[o++] = (cs >> 8) & 255; out[o++] = (cs >> 16) & 255;
    out[o++] = nick.length; out.set(nick, o); o += nick.length;
    out[o++] = n & 255; out[o++] = (n >> 8) & 255;
    let ps = 0;
    for (const [s, u, h] of run.samples) {
      const ds = Math.round((s - ps) * 4); ps += Math.min(255, Math.max(0, ds)) / 4;
      out[o++] = Math.min(255, Math.max(0, ds));
      out[o++] = Math.min(127, Math.max(-128, Math.round(u * 4))) & 255;
      out[o++] = Math.min(255, Math.round(h * 10));
    }
    return out.slice(0, o);
  },
  unpack(bytes) {
    let o = 0;
    const ver = bytes[o++]; if (ver !== GHOST.ver) throw new Error('ghost version');
    const kind = bytes[o++] === 1 ? 'daily' : 'level';
    const ref = bytes[o] | (bytes[o + 1] << 8); o += 2;
    const ride = RIDE_CODES[bytes[o++]] || 'tube';
    const time = (bytes[o] | (bytes[o + 1] << 8) | (bytes[o + 2] << 16)) / 100; o += 3;
    const nl = bytes[o++], nick = Nick.clean(new TextDecoder().decode(bytes.slice(o, o + nl))) || 'Rider'; o += nl;
    const n = bytes[o] | (bytes[o + 1] << 8); o += 2;
    if (n > GHOST.maxSamples || o + n * 3 > bytes.length) throw new Error('ghost data');
    const samples = []; let s = 0;
    for (let i = 0; i < n; i++) {
      s += bytes[o++] / 4;
      const u = ((bytes[o++] << 24) >> 24) / 4, h = bytes[o++] / 10;
      samples.push([s, u, h]);
    }
    const r = { kind, ride, time, nick, samples };
    if (kind === 'daily') r.key = Daily.keyOf(ref); else r.id = ref;
    return r;
  },
  // Text form for links: 'z' + deflated base64url when compression is available, 'r' + raw otherwise.
  async encode(run) {
    const raw = Ghost.pack(run);
    if (typeof CompressionStream !== 'undefined') {
      try { return 'z' + b64.enc(await streamBytes(raw, CompressionStream, 'deflate-raw')); } catch (e) { /* fall through */ }
    }
    return 'r' + b64.enc(raw);
  },
  async decode(str) {
    if (!str || str.length > 12000) throw new Error('ghost size');
    const tag = str[0], body = b64.dec(str.slice(1));
    if (tag === 'z') return Ghost.unpack(await streamBytes(body, DecompressionStream, 'deflate-raw'));
    if (tag === 'r') return Ghost.unpack(body);
    throw new Error('ghost tag');
  },
  // Position of the ghost at time t (seconds): interpolated sample + speed / steering for animation.
  at(run, t) {
    const S = run.samples, f = t * GHOST.hz, i = Math.floor(f);
    if (i >= S.length - 1) { const l = S[S.length - 1] || [0, 0, 0]; return { s: l[0], u: l[1], h: l[2], v: 0, du: 0, done: true }; }
    const a = S[Math.max(0, i)], b = S[i + 1], k = f - i;
    return { s: a[0] + (b[0] - a[0]) * k, u: a[1] + (b[1] - a[1]) * k, h: a[2] + (b[2] - a[2]) * k,
      v: (b[0] - a[0]) * GHOST.hz, du: (b[1] - a[1]) * GHOST.hz, done: false };
  },
};

// Plays a ghost run with its own Player body (drawn semi-transparent).
class GhostRider {
  constructor(body) { this.body = body; this.run = null; this.t = 0; this.s = 0; this.x = 0; this.y = 0; this.finished = false; }
  start(run) { this.run = run; this.t = 0; this.finished = false; this.body.setRide(run.ride, {}); this.body.ghostA = 0.42; }
  stop() { this.run = null; }
  update(dt, world) {
    if (!this.run) return;
    this.t += dt;
    const g = Ghost.at(this.run, Math.min(this.t, this.run.time + 0.0001));
    if (this.t >= this.run.time) this.finished = true;
    const p = this.body, ground = world.height(world.center(g.s) + g.u, g.s);
    this.s = g.s; this.x = world.center(g.s) + g.u; this.y = ground + g.h;
    p.x = this.x; p.s = this.s; p.y = this.y; p.v = g.v; p.vx = g.du; p.grounded = g.h < 0.08;
    p.pitch = p.grounded ? 0 : -Math.min(0.4, g.h * 0.08); p.airPitch = 0; p.roll = 0;
    p.bank = damp(p.bank || 0, -g.du * 0.03, 6, dt);
    p.alive = true; p.invuln = 0; p.avalancheGap = 99; p.power.boost = 0;
    p._animate(dt, clamp(g.du / 6, -1, 1));
  }
}

// ---------- Nicknames: short, plain characters, no profanity ----------
const NICK_BAD = ['fuck', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'nigg', 'fag', 'whore', 'slut', 'rape', 'nazi', 'hitler', 'porn', 'sex',
  'хуй', 'хуе', 'хуё', 'пизд', 'бля', 'ебал', 'ебан', 'еба', 'ёба', 'сука', 'пидор', 'пидар', 'шлюх', 'мудак', 'гандон', 'залуп',
  'pizda', 'muie', 'curva'];
const Nick = {
  clean(s) { return String(s || '').replace(/[^\p{L}\p{N} _.-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 14); },
  // Normalised form for the profanity check: lower case, leetspeak and separators removed.
  _norm(s) {
    const map = { 0: 'o', 1: 'i', 3: 'e', 4: 'a', 5: 's', 7: 't', '@': 'a', $: 's' };
    return String(s).toLowerCase().replace(/[0-9@$]/g, (c) => map[c] || c).replace(/[^\p{L}]/gu, '').replace(/(.)\1+/g, '$1');
  },
  ok(s) {
    const c = Nick.clean(s);
    if (c.length < 2 || c !== String(s).trim()) return false;
    const n = Nick._norm(c);
    return !NICK_BAD.some((w) => n.includes(w.replace(/(.)\1+/g, '$1')));
  },
};
const GroupCode = {
  clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); },
  ok(s) { return /^[A-Z0-9]{2,8}$/.test(s); },
};

// ---------- Crew boards: tiny client for the Supabase RPC functions in server/crew.sql ----------
class CrewClient {
  constructor(cfg, deviceId, fetchFn) { this.cfg = cfg || {}; this.device = deviceId; this.fetch = fetchFn || ((...a) => fetch(...a)); }
  get enabled() { return !!(this.cfg.url && this.cfg.key); }
  async _rpc(fn, args) {
    const r = await this.fetch(`${this.cfg.url.replace(/\/$/, '')}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      // Старый anon key — это JWT (eyJ…), его же кладём в Authorization; новый publishable key (sb_publishable_…) — только в apikey.
      headers: Object.assign({ 'Content-Type': 'application/json', apikey: this.cfg.key }, /^eyJ/.test(this.cfg.key) ? { Authorization: `Bearer ${this.cfg.key}` } : {}),
      body: JSON.stringify(args),
    });
    if (!r.ok) throw new Error(`crew ${fn} ${r.status}`);
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  }
  submit(grp, board, nick, val) { return this._rpc('submit_score', { p_device: this.device, p_grp: grp, p_board: board, p_nick: nick, p_val: Math.round(val) }); }
  board(grp, board) { return this._rpc('get_board', { p_grp: grp, p_board: board, p_device: this.device }); }
  report(grp, pid, reason) { return this._rpc('report_player', { p_device: this.device, p_grp: grp, p_pid: pid, p_reason: reason }); }
  forgetMe() { return this._rpc('delete_my_data', { p_device: this.device }); }
}

// ---------- Share links ----------
const Share = {
  // Ghost challenge parameter from the address (web, itch, Play app links) — platforms pass it via SDKs instead.
  fromUrl(loc = location, key = 'g') {
    try {
      const q = new URLSearchParams(loc.search).get(key);
      if (q) return q;
      const m = new RegExp(`[#&]${key}=([A-Za-z0-9_-]+)`).exec(loc.hash || ''); return m ? m[1] : null;
    } catch (e) { return null; }
  },
  withParam(base, g, key = 'g') { if (!base) return ''; const u = base.split('#')[0]; return u + (u.includes('?') ? '&' : '?') + key + '=' + g; },
  fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; },
  // Text on the card / in the message.
  headline(r) { return r.finished ? `I escaped the avalanche in ${Share.fmt(r.time)}` : `The avalanche caught me at ${Math.floor(r.dist)} m`; },
};

// --- net.js ---
// Online races over Supabase Realtime (Phoenix channels over a WebSocket): friend rooms by code / link and quick match.
// Players only exchange their own positions; the track is built from a shared seed, so the world is the same for both.
// No DOM here — the WebSocket class is injected, so this runs in node tests with a fake socket.

const NET = { hz: 10, heartbeat: 25000, lobby: 'snowpanic-lobby-v1', quickWait: 20, codeChars: 'ABCDEFGHJKMNPQRSTUVWXYZ23456789' };

class RealtimeClient {
  constructor(url, key, WS = (typeof WebSocket !== 'undefined' ? WebSocket : null)) {
    this.url = url.replace(/^http/, 'ws').replace(/\/$/, '') + `/realtime/v1/websocket?apikey=${encodeURIComponent(key)}&vsn=1.0.0`;
    this.WS = WS; this.ws = null; this.ref = 0; this.queue = []; this.channels = new Map(); this.hb = null; this.open = false;
  }
  connect() {
    if (this.ws) return;
    const ws = (this.ws = new this.WS(this.url));
    ws.onopen = () => { this.open = true; for (const m of this.queue.splice(0)) ws.send(m); };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } const ch = this.channels.get(m.topic); if (ch) ch._msg(m); };
    ws.onclose = () => { this.open = false; this.ws = null; clearInterval(this.hb); this.hb = null; for (const ch of this.channels.values()) ch._closed(); };
    ws.onerror = () => {};
    this.hb = setInterval(() => this._send({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(++this.ref) }), NET.heartbeat);
  }
  _send(obj) { const s = JSON.stringify(obj); if (this.open && this.ws) this.ws.send(s); else this.queue.push(s); }
  channel(name, key) { this.connect(); const ch = new RtChannel(this, 'realtime:' + name, key); this.channels.set(ch.topic, ch); return ch; }
  close() { for (const ch of [...this.channels.values()]) ch.leave(); if (this.ws) try { this.ws.close(); } catch (e) { /* ignore */ } }
}

class RtChannel {
  constructor(rt, topic, key) { this.rt = rt; this.topic = topic; this.key = key; this.handlers = {}; this.presence = {}; this.joinRef = null; this.onPresence = null; this.onClose = null; }
  join() {
    this.joinRef = String(++this.rt.ref);
    return new Promise((res, rej) => {
      this._joinWait = { res, rej };
      this.rt._send({ topic: this.topic, event: 'phx_join', ref: this.joinRef, join_ref: this.joinRef,
        payload: { config: { broadcast: { self: false, ack: false }, presence: { key: this.key }, private: false } } });
      setTimeout(() => { if (this._joinWait) { this._joinWait = null; rej(new Error('join timeout')); } }, 8000);
    });
  }
  on(event, cb) { this.handlers[event] = cb; return this; }
  send(event, payload) { this.rt._send({ topic: this.topic, event: 'broadcast', ref: String(++this.rt.ref), join_ref: this.joinRef, payload: { type: 'broadcast', event, payload } }); }
  track(meta) { this.rt._send({ topic: this.topic, event: 'presence', ref: String(++this.rt.ref), join_ref: this.joinRef, payload: { type: 'presence', event: 'track', payload: meta } }); }
  leave() { this.rt._send({ topic: this.topic, event: 'phx_leave', ref: String(++this.rt.ref), join_ref: this.joinRef, payload: {} }); this.rt.channels.delete(this.topic); this.handlers = {}; this.onPresence = null; }
  // Players in the channel: { key: meta } (the newest meta of each key).
  get members() { const out = {}; for (const k in this.presence) { const m = this.presence[k]; if (m.length) out[k] = m[m.length - 1]; } return out; }
  _msg(m) {
    if (m.event === 'phx_reply' && m.ref === this.joinRef && this._joinWait) {
      const w = this._joinWait; this._joinWait = null;
      if (m.payload && m.payload.status === 'ok') w.res(); else w.rej(new Error('join refused'));
    } else if (m.event === 'broadcast') {
      const p = m.payload || {}, h = this.handlers[p.event]; if (h) h(p.payload || {});
    } else if (m.event === 'presence_state') {
      this.presence = {}; for (const k in m.payload) this.presence[k] = (m.payload[k].metas || []).slice();
      this.onPresence && this.onPresence(this.members);
    } else if (m.event === 'presence_diff') {
      const { joins = {}, leaves = {} } = m.payload || {};
      for (const k in leaves) {
        const gone = new Set((leaves[k].metas || []).map((x) => x.phx_ref));
        this.presence[k] = (this.presence[k] || []).filter((x) => !gone.has(x.phx_ref));
        if (!this.presence[k].length) delete this.presence[k];
      }
      for (const k in joins) this.presence[k] = (this.presence[k] || []).concat(joins[k].metas || []);
      this.onPresence && this.onPresence(this.members);
    } else if (m.event === 'phx_close' || m.event === 'phx_error') this._closed();
  }
  _closed() { this.onClose && this.onClose(); }
}

// Pure helpers (tested in node).
const Match = {
  code(rnd = Math.random) { let s = ''; for (let i = 0; i < 4; i++) s += NET.codeChars[Math.floor(rnd() * NET.codeChars.length)]; return s; },
  cleanCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/[OIL01]/g, '').slice(0, 4); },
  // Two players in a room: the earlier arrival hosts (ties by id). Extra players are told the room is full.
  roles(members, me) {
    const list = Object.entries(members).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.t - b.t) || (a.id < b.id ? -1 : 1));
    const i = list.findIndex((x) => x.id === me);
    return { list, full: i >= 2, host: i === 0, opp: i === 0 ? list[1] : i === 1 ? list[0] : null };
  },
  // Lobby: everyone sorts the waiting players the same way and pairs neighbours, so both sides pick the same room.
  pairs(members, blocked = []) {
    const list = Object.entries(members).map(([id, m]) => ({ id, ...m })).sort((a, b) => (a.t - b.t) || (a.id < b.id ? -1 : 1));
    const out = [];
    for (let i = 0; i + 1 < list.length; i += 2) out.push([list[i], list[i + 1]]);
    return out.filter(([a, b]) => !blocked.includes(a.oid) && !blocked.includes(b.oid));
  },
  roomFor(a, b) { return 'q' + [a, b].sort().join('').replace(/[^a-z0-9]/gi, '').slice(0, 24); },
};

// The other player on the track: same interface as Rival (x, y, s, finished, finishT, update, syncBody).
class RemoteRider {
  constructor(body) { this.body = body; this.buf = []; this.reset(); }
  reset(world, side = 1) {
    this.buf = []; this.finished = false; this.finishT = 0; this.left = false; this.crashed = false; this.t = 0;
    this.s = 2; this.x = world ? world.center(2) + side * RACE.laneOffset : 0; this.y = world ? world.height(this.x, 2) : 0;
    this.v = 0; this.vx = 0; this.air = 0; this.ride = this.ride || 'sled';
  }
  // Snapshot from the network: { s, x (offset from track centre), h (height above ground), v, vx, cr (crashed) }.
  push(p, now) { this.buf.push({ ...p, at: now }); if (this.buf.length > 30) this.buf.shift(); }
  // Draw ~120 ms in the past so there are two snapshots to interpolate between.
  update(dt, world, player, running, now = performance.now()) {
    this.t += dt;
    if (!world || !this.buf.length) return;
    const tt = now - 120, b = this.buf;
    let a = b[0], c = b[b.length - 1];
    for (let i = b.length - 1; i > 0; i--) if (b[i - 1].at <= tt) { a = b[i - 1]; c = b[i]; break; }
    const k = c.at > a.at ? clamp((tt - a.at) / (c.at - a.at), 0, 1.5) : 1;
    const s = a.s + (c.s - a.s) * k, u = a.x + (c.x - a.x) * k, h = Math.max(0, a.h + (c.h - a.h) * k);
    this.s = s; this.x = world.center(s) + u; this.y = world.height(this.x, s) + h;
    this.v = c.v || 0; this.vx = c.vx || 0; this.air = h; this.crashed = !!c.cr;
  }
  syncBody(dt) {
    const p = this.body; if (!p) return;
    p.x = this.x; p.s = this.s; p.y = this.y; p.v = this.v; p.vx = this.vx; p.grounded = this.air < 0.08;
    p.pitch = p.grounded ? 0 : -Math.min(0.4, this.air * 0.08); p.airPitch = 0;
    p.bank = damp(p.bank || 0, -this.vx * 0.03, 6, dt);
    p.roll = this.crashed ? Math.sin(this.t * 20) * 0.3 : 0;
    p.alive = true; p.invuln = this.crashed ? 1 : 0; p.avalancheGap = 99; p.power.boost = 0;
    p._animate(dt, clamp(this.vx / 6, -1, 1));
  }
}

// One online session: a friend room or quick match. Hooks: status(text key, vars), start({seed, zone, side, opp}),
// pos(p), fin(t), left(), rematch(), full().
class OnlineSession {
  constructor(rt, me, hooks) { this.rt = rt; this.me = me; this.h = hooks; this.room = null; this.lobby = null; this.code = null; this.started = false; this.ready = {}; this.blocked = me.blocked || []; }
  async joinRoom(code) {
    this.code = code;
    const ch = (this.room = this.rt.channel('snowpanic-room-' + code, this.me.id));
    ch.on('start', (p) => this._start(p, false));
    ch.on('pos', (p) => this.h.pos && this.h.pos(p));
    ch.on('fin', (p) => this.h.fin && this.h.fin(p.t));
    ch.on('rematch', () => { this.ready.opp = true; this._maybeRematch(); this.h.rematch && this.h.rematch(); });
    ch.onPresence = (mem) => this._roomPresence(mem);
    ch.onClose = () => this.h.left && this.h.left();
    await ch.join();
    ch.track({ nick: this.me.nick, ride: this.me.ride, oid: this.me.oid, t: Date.now() });
  }
  _roomPresence(mem) {
    const r = Match.roles(mem, this.me.id);
    if (r.full) { this.h.full && this.h.full(); this.leave(); return; }
    if (r.opp && this.blocked.includes(r.opp.oid)) { this.leave(); this.h.blockedMatch && this.h.blockedMatch(); return; }
    if (this.opp && !r.opp) { this.opp = null; this.h.left && this.h.left(); return; }
    if (!r.opp) return;
    this.opp = r.opp; this.host = r.host;
    if (!this.started && this.host) this._hostStart();
  }
  _hostStart() {
    const p = { seed: (Math.random() * 1e9) | 0, zone: [0, 1, 3, 2, 4][Math.floor(Math.random() * 5)], host: this.me.id };
    this.room.send('start', p); this._start(p, true);
  }
  _start(p, mine) {
    this.started = true; this.ready = {};
    const side = p.host === this.me.id ? -1 : 1;
    this.h.start && this.h.start({ seed: p.seed, zone: p.zone, side, opp: this.opp || { nick: 'Rider', ride: 'sled' }, mine });
  }
  sendPos(p) { if (this.room) this.room.send('pos', p); }
  sendFin(t) { if (this.room) this.room.send('fin', { t }); }
  rematch() { this.ready.me = true; if (this.room) this.room.send('rematch', {}); this._maybeRematch(); }
  _maybeRematch() { if (this.ready.me && this.ready.opp && this.host) this._hostStart(); }
  // Quick match: wait in the lobby until paired, then both join the same room.
  async quick() {
    const ch = (this.lobby = this.rt.channel(NET.lobby, this.me.id));
    ch.onPresence = (mem) => {
      const pair = Match.pairs(mem, this.blocked).find(([a, b]) => a.id === this.me.id || b.id === this.me.id);
      if (!pair || this.code) return;
      const code = Match.roomFor(pair[0].id, pair[1].id);
      // Stay visible in the lobby a few seconds more: the partner must still see us there to pick the same pair.
      const lob = this.lobby; lob.onPresence = null; this.lobby = null;
      setTimeout(() => lob.leave(), 4000);
      this.joinRoom(code).catch(() => this.h.error && this.h.error());
    };
    await ch.join();
    ch.track({ nick: this.me.nick, oid: this.me.oid, t: Date.now() });
  }
  leave() { if (this.lobby) this.lobby.leave(); if (this.room) this.room.leave(); this.lobby = null; this.room = null; }
}

// ===================== Друзья и лобби =====================
// Кто в сети: общий канал присутствия. Каждый трекает {oid, nick, ride, st, code}. Сообщения адресные (to = oid):
// freq — заявка в друзья, facc — заявка принята, invite — приглашение в лобби. Друзья хранятся у каждого локально.
const PARTY = { online: 'snowpanic-online-v1', modes: { race: 2, rope: 4 }, codeLen: 6 };
const Friends = {
  code(oid) { return String(oid || '').slice(0, PARTY.codeLen).toUpperCase(); },
  clean(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, PARTY.codeLen); },
  // Список для экрана: сначала в сети, потом по нику.
  list(friends, online) {
    return friends.map((f) => ({ ...f, on: online[f.oid] || null }))
      .sort((a, b) => (!!b.on - !!a.on) || String(a.nick).localeCompare(String(b.nick)));
  },
};

class SocialHub {
  constructor(rt, me, hooks) { this.rt = rt; this.me = me; this.h = hooks; this.ch = null; this.online = {}; this.status = { st: 'menu', code: '' }; }
  async connect() {
    const ch = (this.ch = this.rt.channel(PARTY.online, this.me.oid));
    const mine = (p) => p && p.to === this.me.oid;
    ch.on('freq', (p) => { if (mine(p)) this.h.freq && this.h.freq(p); });
    ch.on('facc', (p) => { if (mine(p)) this.h.facc && this.h.facc(p); });
    ch.on('invite', (p) => { if (mine(p)) this.h.invite && this.h.invite(p); });
    ch.on('idecline', (p) => { if (mine(p)) this.h.idecline && this.h.idecline(p); });
    ch.onPresence = (mem) => {
      const on = {};
      for (const id in mem) { const m = mem[id]; if (m && m.oid && m.oid !== this.me.oid) on[m.oid] = m; }
      this.online = on; this.h.presence && this.h.presence(on);
    };
    await ch.join();
    this._track();
  }
  _track() { if (this.ch) this.ch.track({ oid: this.me.oid, nick: this.me.nick, ride: this.me.ride, st: this.status.st, code: this.status.code, t: Date.now() }); }
  setStatus(st, code = '') { if (this.status.st === st && this.status.code === code) return; this.status = { st, code }; this._track(); }
  updateMe(me) { this.me = { ...this.me, ...me }; this._track(); }
  byCode(code) { const c = Friends.clean(code); return Object.values(this.online).find((m) => Friends.code(m.oid) === c) || null; }
  send(event, to, extra = {}) { if (this.ch) this.ch.send(event, { to, from: this.me.oid, nick: this.me.nick, ride: this.me.ride, ...extra }); }
  leave() { if (this.ch) this.ch.leave(); this.ch = null; this.online = {}; }
}

// Лобби (пати): до 4 человек в канале с кодом. Хозяин — кто пришёл раньше; он выбирает режим.
// Все жмут «Готов»; когда готовы все (и людей хватает режиму) — хозяин запускает заезд.
// Во время игры тот же канал несёт позиции и события. Хуки: members(list, info), mode(m), start(p),
// pos(p), fin(id, t), hurt(p), hearts(n), tover(p), back(), full(), left(id).
class PartySession {
  constructor(rt, me, hooks) { this.rt = rt; this.me = me; this.h = hooks; this.ch = null; this.code = null; this.mode = 'race'; this.members = []; this.ready = false; this.started = false; this.host = false; this.blocked = me.blocked || []; }
  async join(code) {
    this.code = code;
    const ch = (this.ch = this.rt.channel('snowpanic-party-' + code, this.me.oid));
    ch.on('mode', (p) => { if (!this.host) { this.mode = p.mode; this.h.mode && this.h.mode(p.mode); } });
    ch.on('start', (p) => this._start(p));
    ch.on('pos', (p) => this.h.pos && this.h.pos(p));
    ch.on('fin', (p) => this.h.fin && this.h.fin(p.id, p.t));
    ch.on('hurt', (p) => this.h.hurt && this.h.hurt(p));
    ch.on('hearts', (p) => this.h.hearts && this.h.hearts(p.n));
    ch.on('tover', (p) => this.h.tover && this.h.tover(p));
    ch.on('back', () => { this.started = false; this.h.back && this.h.back(); });
    ch.onPresence = (mem) => this._presence(mem);
    ch.onClose = () => this.h.closed && this.h.closed();
    await ch.join();
    this.joinedAt = Date.now();
    this._track();
  }
  _track() { if (this.ch) this.ch.track({ oid: this.me.oid, nick: this.me.nick, ride: this.me.ride, ready: this.ready, t: this.joinedAt || Date.now() }); }
  get cap() { return PARTY.modes[this.mode] || 2; }
  _presence(mem) {
    const list = Object.values(mem).filter((m) => m && m.oid).sort((a, b) => (a.t - b.t) || (a.oid < b.oid ? -1 : 1));
    const prev = this.members.map((m) => m.oid);
    const i = list.findIndex((m) => m.oid === this.me.oid);
    if (i >= 4) { this.h.full && this.h.full(); this.leave(); return; }
    this.members = list.slice(0, 4);
    this.host = i === 0;
    for (const id of prev) if (!this.members.some((m) => m.oid === id)) this.h.left && this.h.left(id);
    if (this.host) this.ch.send('mode', { mode: this.mode });   // новичку — текущий режим
    this.h.members && this.h.members(this.members, { host: this.host });
    this._maybeStart();
  }
  setMode(m) {
    if (!this.host || !PARTY.modes[m]) return false;
    this.mode = m; this.ch.send('mode', { mode: m }); this.h.mode && this.h.mode(m);
    this._maybeStart(); return true;
  }
  setReady(r) { this.ready = !!r; this._track(); }
  // Хозяин стартует, когда все готовы, людей ≥ 2 и не больше, чем позволяет режим.
  _maybeStart() {
    if (!this.host || this.started || !this.ch) return;
    const n = this.members.length;
    if (n < 2 || n > this.cap || !this.members.every((m) => m.ready)) return;
    const p = { mode: this.mode, seed: (Math.random() * 1e9) | 0, zone: [0, 1, 3, 2, 4][Math.floor(Math.random() * 5)], order: this.members.map((m) => ({ oid: m.oid, nick: m.nick, ride: m.ride })), host: this.me.oid };
    this.ch.send('start', p); this._start(p);
  }
  _start(p) {
    if (this.started) return;
    this.started = true; this.ready = false; this._track();
    const me = p.order.findIndex((m) => m.oid === this.me.oid);
    this.h.start && this.h.start({ ...p, me });
  }
  backToLobby() { this.started = false; if (this.ch) this.ch.send('back', {}); }
  sendPos(p) { if (this.ch) this.ch.send('pos', { ...p, id: this.me.oid }); }
  sendFin(t) { if (this.ch) this.ch.send('fin', { id: this.me.oid, t }); }
  send(ev, p) { if (this.ch) this.ch.send(ev, p); }
  leave() { if (this.ch) this.ch.leave(); this.ch = null; this.members = []; this.started = false; }
}

// --- platform.js ---
// Слой площадки. Игра вызывает только эти методы; что под ними — решает сборка (BUILD, см. build.js):
//   web          — itch.io / своя ссылка: без SDK и без рекламы;
//   crazygames   — Basic Launch: без SDK и без рекламы (так требует CrazyGames);
//   crazygames-full — Full Launch: SDK v3, реклама midgame/rewarded, облачное сохранение;
//   yandex       — Яндекс Игры: SDK, полноэкранная и rewarded-реклама, облачное сохранение, язык.
// Без рекламы кнопки «за видео» прячутся (CrazyGames запрещает кнопки за рекламу, которые ничего не дают).

const AD_POLICY = {
  interstitialMinGap: 180,     // сек между полноэкранными
  noAdsFirstSeconds: 120,      // у нового игрока в первые минуты рекламы нет
  minRunForAd: 30,             // после короткого заезда рекламы нет
  skipAfterRewarded: 180,      // после rewarded полноэкранную пропускаем
};
const SAVE_KEY = 'bs_save';
const BUILD_CFG = (typeof BUILD !== 'undefined' && BUILD) || { target: 'web', sdk: null, ads: false };

const PLAY_PRODUCTS = SHOP.ids;   // те же id создаются в Play Console → Монетизация → Товары (цены — SHOP.*.usd)

const Platform = {
  name: BUILD_CFG.target,
  sessionStart: performance.now() / 1000,
  lastInterstitial: -1e9,
  lastRewarded: -1e9,
  firstSession: true,
  adsEnabled: false,
  cg: null,          // CrazyGames SDK
  ysdk: null,        // Yandex SDK
  yplayer: null,
  cloud: null,       // сохранение из облака площадки
  onPause: null, onResume: null,

  iap: null, catalog: [],   // покупки за реальные деньги (сейчас — Яндекс Игры)
  // Кнопки «за видео» показываем, только если реклама реально может быть.
  get rewardedAvailable() { return this.adsEnabled; },

  async init() {
    try { this.firstSession = !localStorage.getItem('bs_seen'); localStorage.setItem('bs_seen', '1'); } catch (e) { /* хранилище недоступно */ }
    let lang = (navigator.language || 'en').slice(0, 2);
    if (BUILD_CFG.sdk === 'crazygames') await this._initCrazy().then((l) => { if (l) lang = l; }).catch((e) => console.warn('CrazyGames SDK', e));
    if (BUILD_CFG.sdk === 'yandex') await this._initYandex().then((l) => { if (l) lang = l; }).catch((e) => console.warn('Yandex SDK', e));
    this.adsEnabled = !!BUILD_CFG.ads && !!(this.cg || this.ysdk);
    if (this.ysdk) await this._initPayments().catch(() => {});
    if (BUILD_CFG.sdk === 'capacitor') await this._initPlay().catch((e) => console.warn('Play Billing', e));
    // Игра на английском везде; только на Яндекс Играх язык берётся у площадки (там русскоязычная аудитория).
    if (BUILD_CFG.target !== 'yandex') lang = 'en';
    return { lang };
  },

  async _initCrazy() {
    const C = window.CrazyGames && window.CrazyGames.SDK;
    if (!C) return null;
    await C.init();
    if (C.environment === 'disabled') return null;       // не на CrazyGames — работаем как обычная веб-версия
    this.cg = C;
    try { const raw = C.data.getItem(SAVE_KEY); if (raw) this.cloud = JSON.parse(raw); } catch (e) { /* нет сохранения */ }
    const info = C.user && C.user.systemInfo;
    return info && info.locale ? info.locale.slice(0, 2) : null;
  },

  async _initYandex() {
    if (!window.YaGames) return null;
    const y = await window.YaGames.init();
    this.ysdk = y;
    y.on && y.on('game_api_pause', () => this.onPause && this.onPause());
    y.on && y.on('game_api_resume', () => this.onResume && this.onResume());
    try {
      this.yplayer = await y.getPlayer({ scopes: false });
      const d = await this.yplayer.getData([SAVE_KEY]);
      if (d && d[SAVE_KEY]) this.cloud = d[SAVE_KEY];
    } catch (e) { /* без облака — локальное сохранение */ }
    return y.environment && y.environment.i18n ? y.environment.i18n.lang : null;
  },

  // --- Покупки (Яндекс: getPayments → getCatalog → purchase → consumePurchase) ---
  async _initPayments() {
    this.iap = await this.ysdk.getPayments({ signed: false });
    this.catalog = await this.iap.getCatalog();
  },
  // Android-приложение: Google Play Billing через плагин Capacitor @capgo/native-purchases.
  async _initPlay() {
    const C = window.Capacitor;
    if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
    const NP = C.registerPlugin('NativePurchases');
    const sup = await NP.isBillingSupported();
    if (!sup || !sup.isBillingSupported) return;
    const { products } = await NP.getProducts({ productIdentifiers: PLAY_PRODUCTS, productType: 'inapp' });
    this.play = NP;
    this.catalog = (products || []).map((p) => ({ id: p.identifier || p.productIdentifier, title: p.title, price: p.priceString, priceValue: p.priceString }));
    this.iap = { play: true };
  },
  get iapAvailable() { return !!(this.iap && this.catalog && this.catalog.length); },
  get iapProvider() { return this.ysdk ? 'Yandex Games' : this.play ? 'Google Play' : ''; },
  // Товар каталога: цена и значок валюты площадки (требование Яндекса 1.13.2 — брать из SDK).
  product(id) {
    const p = (this.catalog || []).find((x) => x.id === id); if (!p) return null;
    let icon = ''; try { icon = p.getPriceCurrencyImage ? p.getPriceCurrencyImage('small') : ''; } catch (e) { /* ignore */ }
    return { id, price: p.priceValue || p.price, priceText: p.price, icon, title: p.title };
  },
  // Монеты — расходуемая покупка (сразу «потребляем», можно купить снова); наборы — разовые (не потребляем).
  // credit(id) начисляет товар до потребления.
  async buy(id, credit) {
    if (!this.iap) return false;
    const consumable = !SHOP.isPack(id);
    if (this.play) {
      try {
        const tr = await this.play.purchaseProduct({ productIdentifier: id, productType: 'inapp', isConsumable: consumable });
        if (!tr) return false;
        credit(tr.productIdentifier || id);
        return true;
      } catch (e) { return false; }
    }
    try {
      const pur = await this.iap.purchase({ id });
      credit(pur.productID || id);
      if (consumable) await this.iap.consumePurchase(pur.purchaseToken);
      return true;
    } catch (e) { return false; }
  },
  // Незавершённые покупки (оплатил, но игра закрылась): начислить и потребить при запуске.
  async restorePurchases(credit) {
    if (!this.iap) return 0;
    let n = 0;
    if (this.play) {
      // Оплачено, но не выдано (приложение закрылось во время покупки): выдать и потребить.
      try {
        const { purchases } = await this.play.getPurchases({ productType: 'inapp' });
        for (const p of purchases || []) {
          const done = p.purchaseState === 'PURCHASED' || p.purchaseState === 1 || p.purchaseState === '1';
          if (!done || !p.purchaseToken || !PLAY_PRODUCTS.includes(p.productIdentifier)) continue;
          // Набор куплен навсегда: выдаём заново (credit сам не даст дважды), монеты — выдать и потребить.
          if (SHOP.isPack(p.productIdentifier)) { credit(p.productIdentifier); continue; }
          await this.play.consumePurchase({ purchaseToken: p.purchaseToken });
          credit(p.productIdentifier); n++;
        }
      } catch (e) { /* нет незавершённых */ }
      return n;
    }
    try {
      for (const pur of await this.iap.getPurchases()) {
        credit(pur.productID);
        if (!SHOP.isPack(pur.productID)) { await this.iap.consumePurchase(pur.purchaseToken); n++; }
      }
    } catch (e) { /* ignore */ }
    return n;
  },

  // Игра загружена и готова (Яндекс: обязательный вызов LoadingAPI.ready).
  gameReady() {
    try { this.ysdk && this.ysdk.features.LoadingAPI && this.ysdk.features.LoadingAPI.ready(); } catch (e) { /* ignore */ }
  },
  // Разметка геймплея: площадки не показывают рекламу и считают время игры только между start/stop.
  gameplayStart() {
    try { this.cg && this.cg.game.gameplayStart(); } catch (e) { /* ignore */ }
    try { this.ysdk && this.ysdk.features.GameplayAPI && this.ysdk.features.GameplayAPI.start(); } catch (e) { /* ignore */ }
  },
  gameplayStop() {
    try { this.cg && this.cg.game.gameplayStop(); } catch (e) { /* ignore */ }
    try { this.ysdk && this.ysdk.features.GameplayAPI && this.ysdk.features.GameplayAPI.stop(); } catch (e) { /* ignore */ }
  },

  now() { return performance.now() / 1000; },

  canShowInterstitial(runSeconds) {
    if (!this.adsEnabled) return false;
    const t = this.now();
    if (this.firstSession && t - this.sessionStart < AD_POLICY.noAdsFirstSeconds) return false;
    if (runSeconds < AD_POLICY.minRunForAd) return false;
    if (t - this.lastInterstitial < AD_POLICY.interstitialMinGap) return false;
    if (t - this.lastRewarded < AD_POLICY.skipAfterRewarded) return false;
    return true;
  },

  // Полноэкранная реклама между заездами. Возвращает true, если показали.
  showInterstitial(runSeconds) {
    if (!this.canShowInterstitial(runSeconds)) return Promise.resolve(false);
    this.lastInterstitial = this.now();
    return new Promise((done) => {
      const finish = (shown) => { this.onResume && this.onResume(); done(shown); };
      this.onPause && this.onPause();
      try {
        if (this.cg) {
          this.cg.ad.requestAd('midgame', { adStarted: () => {}, adFinished: () => finish(true), adError: () => finish(false) });
        } else if (this.ysdk) {
          this.ysdk.adv.showFullscreenAdv({ callbacks: { onClose: (shown) => finish(!!shown), onError: () => finish(false), onOffline: () => finish(false) } });
        } else finish(false);
      } catch (e) { finish(false); }
    });
  },

  // Реклама за награду. true — досмотрел, награда положена.
  showRewarded() {
    if (!this.adsEnabled) return Promise.resolve(false);
    return new Promise((done) => {
      let rewarded = false, closed = false;
      const finish = () => { if (closed) return; closed = true; this.lastRewarded = this.now(); this.onResume && this.onResume(); done(rewarded); };
      this.onPause && this.onPause();
      try {
        if (this.cg) {
          this.cg.ad.requestAd('rewarded', { adStarted: () => {}, adFinished: () => { rewarded = true; finish(); }, adError: () => finish() });
        } else if (this.ysdk) {
          this.ysdk.adv.showRewardedVideo({ callbacks: { onRewarded: () => { rewarded = true; }, onClose: () => finish(), onError: () => finish() } });
        } else finish();
      } catch (e) { finish(); }
    });
  },

  // --- Ссылки-вызовы (призрак) ---
  // Параметр вызова, с которым открыли игру: Яндекс передаёт его как ?payload=, CrazyGames — через invite-ссылку, веб — ?g=.
  // key 'g' — призрак, 'room' — комната онлайн-гонки. На Яндексе payload один: комната пишется как 'room-ABCD'.
  challengeParam(key = 'g') {
    try {
      if (this.ysdk) {
        const p = (this.ysdk.environment && this.ysdk.environment.payload) || '';
        if (key === 'room') return p.startsWith('room-') ? p.slice(5) : null;
        return p && !p.startsWith('room-') ? p : null;
      }
      if (this.cg) return this.cg.game.getInviteParam(key) || null;
    } catch (e) { /* ignore */ }
    return Share.fromUrl(location, key);
  },
  // Можно ли в этой сборке давать ссылки на внешние сайты (Яндекс и CrazyGames запрещают ссылки на другие площадки).
  get externalLinks() { return !['crazygames', 'yandex'].includes(BUILD_CFG.sdk) && BUILD_CFG.target !== 'crazygames'; },
  // Нативное окно «поделиться» в Android-приложении (в WebView нет navigator.share).
  get nativeShare() { const C = window.Capacitor; return C && C.isNativePlatform && C.isNativePlatform() ? (this._share || (this._share = C.registerPlugin('Share'))) : null; },
  // Ссылка, по которой друг откроет игру с этим вызовом. '' — ссылку дать нельзя (только картинка).
  async shareLink(g, key = 'g') {
    try {
      if (this.ysdk) {
        const env = this.ysdk.environment, tld = (env.i18n && env.i18n.tld) || 'ru';
        return `https://yandex.${tld}/games/app/${env.app.id}` + (g ? `?payload=${key === 'room' ? 'room-' : ''}${g}` : '');
      }
      if (this.cg) return g ? await this.cg.game.inviteLink({ [key]: g }) : '';
    } catch (e) { return ''; }
    if (!this.externalLinks) return '';
    if (BUILD_CFG.shareBase) return g ? Share.withParam(BUILD_CFG.shareBase, g, key) : BUILD_CFG.shareBase;
    // Своя страница (GitHub Pages и т.п.): ссылка на неё же. На itch.io игра в iframe чужого домена — без shareBase ссылки нет.
    if (/^https?:$/.test(location.protocol) && !/itch\.zone$|itch\.io$/.test(location.hostname)) return g ? Share.withParam(location.origin + location.pathname, g, key) : location.origin + location.pathname;
    return '';
  },
  // Адрес игры без вызова — для подписи на карточке.
  get homeUrl() { return this.externalLinks ? (BUILD_CFG.shareBase || '') : ''; },
  get crewConfig() { return BUILD_CFG.crew || null; },
  // Постоянный случайный id устройства для таблиц групп (не рекламный id, ни с чем не связан).
  deviceId() {
    try {
      let id = localStorage.getItem('bs_dev');
      if (!id) { id = crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, () => ((Math.random() * 16) | 0).toString(16)); localStorage.setItem('bs_dev', id); }
      return id;
    } catch (e) { return '00000000-0000-4000-8000-000000000000'; }
  },
  // Публичный случайный id игрока для жалоб/блокировки в онлайне (не связан с id устройства).
  publicId() {
    try { let id = localStorage.getItem('bs_oid'); if (!id) { id = Math.random().toString(36).slice(2, 12); localStorage.setItem('bs_oid', id); } return id; } catch (e) { return 'anon'; }
  },
  // Призраки лучших заездов — отдельно от сохранения (в облако площадки не отправляются, объём не раздувают).
  loadGhosts() { try { return JSON.parse(localStorage.getItem('bs_ghosts') || '{}'); } catch (e) { return {}; } },
  saveGhosts(g) { try { localStorage.setItem('bs_ghosts', JSON.stringify(g)); } catch (e) { /* ignore */ } },

  load() {
    if (this.cloud) return this.cloud;
    try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) { return {}; }
  },
  save(data) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
    try { this.cg && this.cg.data.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
    // Яндекс ограничивает частоту записи — не чаще раза в 3 с, последнее состояние не теряем.
    if (this.yplayer) {
      this._pending = data;
      if (!this._yTimer) this._yTimer = setTimeout(() => {
        this._yTimer = null;
        try { this.yplayer.setData({ [SAVE_KEY]: this._pending }, true); } catch (e) { /* ignore */ }
      }, 3000);
    }
  },
};
